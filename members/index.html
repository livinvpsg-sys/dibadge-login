<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>diBadge | Members</title>

  <script>
    (function() {
      const savedTheme = localStorage.getItem('dibadge_web_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>

  <style>
    :root {
      --jet-black: #0f0f0f;
      --paper-white: #f8f9fa;
      --slate-surface: #1e1e1e;
      --accent-white: #ffffff;
      --muted-gray: #8e8e93;
      --cool-ash: #a1a1a6;
      --slate-charcoal: #3a3a3c;
      --soft-border: #e5e5ea;
      --error-red: #ff3b30;
      --accent-teal: #14b8a6;

      --bg-color: #e8e9ed;
      --text-color: var(--slate-charcoal);
      --surface-color: var(--accent-white);
      --border-color: var(--soft-border);
      --subtext-color: var(--cool-ash);
      --tabbar-bg: var(--accent-white);
      --header-bg: var(--accent-white);
    }
    [data-theme="dark"] {
      --bg-color: var(--jet-black);
      --text-color: var(--accent-white);
      --surface-color: var(--slate-surface);
      --border-color: #2c2c2e;
      --subtext-color: var(--muted-gray);
      --tabbar-bg: #050505;
      --header-bg: #050505;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-color); color: var(--text-color); height: 100vh; overflow: hidden; }

    #authGate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--jet-black); display: flex; justify-content: center; align-items: center; z-index: 1000; color: var(--accent-white); font-size: 0.9rem; }

    #appShell { display: flex; flex-direction: column; height: 100vh; }

    .page-header { background: var(--header-bg); display: flex; align-items: center; gap: 14px; padding: 20px 28px; border-bottom: 1px solid var(--border-color); }
    .back-btn { background: transparent; border: none; color: var(--text-color); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 6px; border-radius: 8px; }
    .back-btn:hover { background: var(--surface-color); }
    .back-btn svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2; fill: none; }
    .page-title { font-size: 1.15rem; font-weight: 700; }

    /* Same three-column shell used on Projects/Chat/Forms — left icon rail, main content,
       right Activity Feed — so this page matches the rest of the app instead of standing
       alone as a plain centered form. */
    .dashboard-body-split { display: flex; flex: 1; min-height: 0; overflow: hidden; }
    .left-vertical-tabbar { width: 64px; flex-shrink: 0; background: var(--tabbar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; padding: 16px 0; }
    .tab-btn { width: 44px; height: 44px; border-radius: 10px; background: transparent; border: none; color: var(--subtext-color); display: flex; justify-content: center; align-items: center; margin-bottom: 10px; text-decoration: none; cursor: pointer; transition: all 0.2s; }
    .tab-btn svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .tab-btn:hover { background: var(--bg-color); color: var(--text-color); }
    .tab-btn.active { background: var(--bg-color); color: var(--text-color); }

    .member-detail-panel::-webkit-scrollbar, .activity-feed-panel::-webkit-scrollbar, .wa-list::-webkit-scrollbar { width: 10px; }
    .member-detail-panel::-webkit-scrollbar-track, .activity-feed-panel::-webkit-scrollbar-track, .wa-list::-webkit-scrollbar-track { background: transparent; }
    .member-detail-panel::-webkit-scrollbar-thumb, .activity-feed-panel::-webkit-scrollbar-thumb, .wa-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 6px; }
    .member-detail-panel::-webkit-scrollbar-thumb:hover, .activity-feed-panel::-webkit-scrollbar-thumb:hover, .wa-list::-webkit-scrollbar-thumb:hover { background: var(--subtext-color); }
    * { scrollbar-width: thin; scrollbar-color: var(--border-color) transparent; }

    @media (max-width: 1024px) { .activity-feed-panel { display: none; } }
    .activity-feed-panel {
      width: 300px;
      flex-shrink: 0;
      background: var(--surface-color);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      padding: 16px;
    }
    .details-panel-section-header { display: flex; align-items: center; justify-content: space-between; }
    .details-panel-title-group { display: flex; align-items: center; gap: 8px; }
    .details-panel-title-group svg { width: 16px; height: 16px; stroke: var(--subtext-color); stroke-width: 2; fill: none; flex-shrink: 0; }
    .details-panel-title { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--subtext-color); }
    .details-panel-live-dot { width: 8px; height: 8px; border-radius: 50%; background: #25D366; animation: livePulse 1.6s ease-in-out infinite; flex-shrink: 0; }
    @keyframes livePulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    .activity-feed-card { background: transparent; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; }
    .activity-feed-title { font-size: 0.85rem; font-weight: 700; color: var(--text-color); margin-bottom: 2px; }
    .activity-feed-desc { font-size: 0.78rem; color: var(--subtext-color); line-height: 1.4; }
    .activity-feed-time { font-size: 0.68rem; color: var(--subtext-color); margin-top: 6px; }

    /* Master-detail layout, matching chat's own panel widths exactly: the member list is
       sized like chat's own details panel (330px), and the detail pane takes the remaining
       space the same way chat's main message area does. */
    .member-list-panel {
      width: 330px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--surface-color);
      border-right: 1px solid var(--border-color);
      overflow: hidden;
    }
    .member-detail-panel {
      flex: 1;
      overflow-y: auto;
      padding: 32px;
    }
    .member-detail-empty {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--subtext-color);
      font-size: 0.9rem;
      text-align: center;
    }

    .wa-search-bar-wrap { padding: 16px 16px 10px 16px; flex-shrink: 0; }
    .wa-search-input {
      width: 100%;
      padding: 10px 14px;
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-radius: 20px;
      font-size: 0.9rem;
      outline: none;
    }
    .wa-search-input:focus { border-color: var(--accent-teal); }

    .wa-list { flex: 1; overflow-y: auto; padding: 8px 0 24px 0; }
    .wa-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      cursor: pointer;
    }
    .wa-row:hover { background: var(--surface-color); }
    .wa-row.selected { background: var(--surface-color); }
    .wa-avatar {
      width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
      background: var(--accent-teal); color: #04211d;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1rem;
    }
    .wa-avatar.large { width: 64px; height: 64px; font-size: 1.4rem; }
    .wa-row-info { flex: 1; min-width: 0; }
    .wa-row-name { font-size: 0.9rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wa-badge {
      display: inline-block;
      margin-top: 3px;
      padding: 2px 9px;
      border-radius: 10px;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .wa-badge.verified { background: rgba(20,184,166,0.15); color: var(--accent-teal); }
    .wa-badge.pending { background: rgba(255,179,0,0.15); color: #ffb300; }
    .wa-badge.unverified { background: var(--bg-color); color: var(--subtext-color); }

    .member-detail-header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
    .member-detail-name { font-size: 1.2rem; font-weight: 700; }
    .member-detail-actions { display: flex; flex-direction: column; gap: 14px; max-width: 420px; }

    .detail-tab-switcher { display: flex; gap: 4px; border-bottom: 1px solid var(--border-color); margin-bottom: 24px; }
    .detail-tab-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 10px 4px; margin-right: 20px;
      background: transparent; border: none; border-bottom: 2px solid transparent;
      color: var(--subtext-color); font-size: 0.88rem; font-weight: 600;
      cursor: pointer;
    }
    .detail-tab-btn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; }
    .detail-tab-btn.active { color: var(--text-color); border-bottom-color: var(--text-color); }
    .detail-tab-btn:hover { color: var(--text-color); }

    .doc-tab-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }

    .req-filter-pills { display: flex; gap: 8px; margin: 10px 0 18px 0; }
    .req-pill {
      padding: 6px 14px;
      border-radius: 16px;
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--subtext-color);
      opacity: 0.55;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .req-pill:hover { opacity: 0.8; }
    .req-pill.active { background: transparent; border-color: var(--text-color); color: var(--text-color); opacity: 1; }
    .doc-add-pill {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 18px;
      background: transparent; border: 1px solid var(--border-color); color: var(--text-color);
      font-size: 0.82rem; font-weight: 600; cursor: pointer;
    }
    .doc-add-pill:hover { border-color: var(--text-color); }
    .doc-add-pill svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2.2; fill: none; }

    .doc-card {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
      padding: 14px; border: 1px solid var(--border-color); border-radius: 10px; margin-bottom: 12px;
      max-width: 520px;
    }
    .doc-card-heading { font-size: 0.92rem; font-weight: 700; margin-bottom: 4px; }
    .doc-card-expiry { font-size: 0.78rem; color: var(--subtext-color); }
    .doc-card-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .doc-preview-thumb {
      width: 56px; height: 56px; border-radius: 8px; object-fit: cover;
      border: 1px solid var(--border-color); flex-shrink: 0;
    }
    .doc-preview-pdf {
      width: 56px; height: 56px; border-radius: 8px; flex-shrink: 0;
      background: var(--bg-color); border: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem; font-weight: 700; color: var(--subtext-color);
    }
    .doc-icon-btn {
      background: transparent; border: none; color: var(--subtext-color); cursor: pointer;
      display: flex; padding: 4px;
    }
    .doc-icon-btn:hover { color: var(--text-color); }
    .doc-icon-btn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; }

    .doc-modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 600; align-items: center; justify-content: center;
    }
    .doc-modal-overlay.active { display: flex; }
    .doc-modal-box {
      background: var(--surface-color); border: 1px solid var(--border-color);
      border-radius: 14px; padding: 24px; width: 92%; max-width: 440px;
      display: flex; flex-direction: column; gap: 16px; max-height: 90vh; overflow-y: auto;
    }
    .doc-modal-label { font-size: 0.8rem; font-weight: 600; color: var(--subtext-color); margin-bottom: 6px; display: block; }
    .doc-attach-row {
      display: flex; gap: 10px;
    }
    .doc-attach-btn {
      padding: 6px 0; border: none;
      background: transparent; color: var(--subtext-color); font-size: 0.9rem; font-weight: 500;
      cursor: pointer; display: flex; align-items: center; gap: 10px;
    }
    .doc-attach-btn:hover { color: var(--text-color); }
    .doc-attach-btn svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.8; fill: none; flex-shrink: 0; }
    .doc-attach-btn.has-file { color: var(--text-color); }
    .doc-file-chip {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 10px; border-radius: 14px; background: var(--bg-color);
      border: 1px solid var(--border-color); font-size: 0.76rem; color: var(--text-color);
      max-width: 180px;
    }
    .doc-file-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .doc-file-chip button { background: transparent; border: none; color: var(--subtext-color); cursor: pointer; display: flex; flex-shrink: 0; padding: 0; }
    .doc-file-chip button:hover { color: var(--text-color); }
    .doc-file-chip button svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 2.5; fill: none; }
    .doc-modal-textarea {
      width: 100%; padding: 8px 0; background: transparent; border: none; border-bottom: 1px solid var(--border-color);
      color: var(--text-color); border-radius: 0; font-size: 0.95rem; resize: none; min-height: 28px;
      font-family: inherit; outline: none;
    }
    .doc-modal-textarea:focus { border-bottom-color: var(--text-color); }
    .doc-modal-date-row { display: flex; align-items: center; gap: 14px; }
    .doc-date-wrapper { position: relative; flex: 1; }
    .doc-date-display {
      padding: 8px 0; border-bottom: 1px solid var(--border-color);
      color: var(--subtext-color); font-size: 0.95rem; font-family: inherit;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .doc-date-display svg { width: 17px; height: 17px; stroke: var(--text-color); stroke-width: 2; fill: none; flex-shrink: 0; transition: opacity 0.15s; opacity: 1; }
    .doc-date-display svg.dimmed { opacity: 0.3 !important; }
    .doc-na-chip { transition: opacity 0.15s; }
    .doc-na-chip.dimmed { opacity: 0.4; }
    .doc-date-display.has-value { color: var(--text-color); }
    .doc-date-wrapper:focus-within .doc-date-display { border-bottom-color: var(--text-color); }
    /* The native date input sits invisibly on top so its picker popup and keyboard entry
       still work exactly as normal — only its own text and placeholder are hidden, since
       neither can be restyled directly (a native date input always shows its own locale
       format, and never accepts custom placeholder text like "Expiry date"). The styled
       div behind it is what's actually visible. */
    .doc-date-native-input {
      position: absolute; inset: 0; width: 100%; height: 100%;
      opacity: 0; border: none; background: transparent; cursor: pointer; padding: 0; margin: 0;
    }
    :root .doc-date-native-input { color-scheme: light; }
    [data-theme="dark"] .doc-date-native-input { color-scheme: dark; }
    .doc-na-chip {
      display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 14px;
      border: 1px solid var(--border-color); font-size: 0.78rem; font-weight: 600; color: var(--subtext-color);
      cursor: pointer; white-space: nowrap; background: transparent;
    }
    .doc-na-chip.active { border-color: var(--text-color); color: var(--text-color); }
    .doc-modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 4px; }
    .doc-cancel-btn {
      background: transparent; border: none; color: var(--subtext-color);
      font-size: 0.85rem; font-weight: 600; cursor: pointer; padding: 8px 6px;
    }
    .doc-cancel-btn:hover { color: var(--text-color); }

    .wa-empty { text-align: center; padding: 40px 20px; color: var(--subtext-color); font-size: 0.85rem; }

    /* Invite-a-member modal, opened from the sidebar FAB */
    .invite-modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 500; align-items: center; justify-content: center;
    }
    .invite-modal-overlay.active { display: flex; }
    .invite-modal-box {
      background: var(--surface-color); border: 1px solid var(--border-color);
      border-radius: 14px; padding: 24px; width: 92%; max-width: 420px;
    }

    .not-allowed { text-align: center; padding: 60px 20px; color: var(--subtext-color); }

    .card { background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 14px; padding: 22px; margin-bottom: 24px; }
    .card-title { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
    .card-sub { font-size: 0.82rem; color: var(--subtext-color); margin-bottom: 18px; }

    .search-row { display: flex; gap: 10px; }
    .search-input {
      flex: 1;
      padding: 11px 12px;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-radius: 8px;
      font-size: 0.92rem;
      outline: none;
    }
    .search-input:focus { border-color: var(--accent-teal); }
    .search-btn {
      padding: 11px 20px;
      background: var(--accent-teal);
      color: #04211d;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .search-btn:hover { background: #0d9488; }
    .search-btn:disabled { opacity: 0.6; cursor: default; }

    .search-icon-btn {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      background: transparent;
      color: var(--subtext-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .search-icon-btn:hover { color: var(--text-color); border-color: var(--text-color); }
    .search-icon-btn svg { width: 19px; height: 19px; stroke: currentColor; stroke-width: 2.2; fill: none; }

    .search-status { margin-top: 12px; font-size: 0.85rem; color: var(--subtext-color); }

    .found-row {
      display: none;
      margin-top: 14px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 10px;
    }
    .found-row.active { display: flex; }
    .found-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .found-email { font-size: 0.9rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .found-type { font-size: 0.75rem; color: var(--subtext-color); }
    .verify-btn {
      padding: 8px 16px;
      background: var(--accent-teal);
      color: #04211d;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    .verify-btn:hover { background: #0d9488; }
    .verify-btn.danger { background: #ff5252; }
    .verify-btn.danger:hover { background: #e04848; }
    .verify-btn:disabled { opacity: 0.6; cursor: default; }

    .members-list { display: flex; flex-direction: column; gap: 10px; }
    .member-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
    }
    .member-info { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .member-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--accent-teal); color: #04211d;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.85rem; flex-shrink: 0;
    }
    .member-email { font-size: 0.88rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .member-status { font-size: 0.72rem; color: var(--accent-teal); font-weight: 600; }
    .remove-member-btn {
      background: transparent; border: none; color: var(--subtext-color);
      cursor: pointer; padding: 6px; border-radius: 8px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .remove-member-btn:hover { background: var(--bg-color); color: var(--error-red); }
    .remove-member-btn svg { width: 17px; height: 17px; stroke: currentColor; stroke-width: 2; fill: none; }

    .empty-state { font-size: 0.85rem; color: var(--subtext-color); text-align: center; padding: 20px 0; }
    .inline-error { color: #ff6b60; font-size: 0.82rem; margin-top: 10px; }

    .member-row { flex-direction: column; align-items: stretch; gap: 10px; }
    .member-row-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .tile-access-row { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 8px; border-top: 1px solid var(--border-color); }
    .tile-toggle-chip {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 10px; border-radius: 20px;
      border: 1px solid var(--border-color);
      font-size: 0.78rem; cursor: pointer; user-select: none;
      color: var(--subtext-color);
    }
    .tile-toggle-chip.active { border-color: var(--accent-teal); color: var(--accent-teal); }
    .tile-toggle-chip input { display: none; }
  </style>
</head>
<body>

  <div id="authGate">Checking your session…</div>

  <div id="appShell" style="display:none;">
    <header class="page-header">
      <button class="back-btn" onclick="window.location.href='../home/'" title="Back to Home">
        <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      </button>
      <span class="page-title">Members</span>
    </header>

    <div class="dashboard-body-split">
      <aside class="left-vertical-tabbar">
        <a href="../home/" class="tab-btn" title="Home">
          <svg viewBox="0 0 24 24" style="width: 22px; height: 22px;">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, collectionGroup,
      query, where, getDocs, serverTimestamp, arrayUnion, arrayRemove
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB2unuKGf0MQqxcB78Skh1H9U3ySFj16e0",
      authDomain: "dibadge-fabxdi.firebaseapp.com",
      projectId: "dibadge-fabxdi",
      storageBucket: "dibadge-fabxdi.firebasestorage.app",
      messagingSenderId: "390433769514",
      appId: "1:390433769514:web:10c4fb97906be8690b1b53",
      measurementId: "G-ZJVXLDZPRY"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    let currentUid = null;
    let currentOrgId = null;
    let isTrueCreator = false; // only the organisation's original creator — not a delegated admin — can appoint Super Admins
    let canApproveJoinRequests = false; // true creator or Super Admin — not general Members-tile admins
    let isCurrentUserSuperAdmin = false; // distinct from isTrueCreator — needed for the founder/super-admin/admin hierarchy below
    let orgCreatorUid = null; // the founder — shown with their own badge, and untouchable by anyone but themselves

    onAuthStateChanged(auth, async function(user) {
      const gate = document.getElementById('authGate');
      if (!user) {
        window.location.href = '../login/';
        return;
      }
      gate.style.display = 'none';
      document.getElementById('appShell').style.display = 'flex';
      currentUid = user.uid;

      const userSnap = await getDoc(doc(db, 'users', user.uid));
      const userData = userSnap.exists() ? userSnap.data() : null;

      // The account's saved theme is the source of truth — resync it here in case this
      // browser's localStorage doesn't match (cleared on restart, a different device).
      const savedTheme = userData ? userData.themePreference : null;
      if (savedTheme && savedTheme !== localStorage.getItem('dibadge_web_theme')) {
        document.documentElement.setAttribute('data-theme', savedTheme);
        localStorage.setItem('dibadge_web_theme', savedTheme);
      }

      if (userData && userData.accountType === 'organisation_creator') {
        currentOrgId = userData.organisationId;
        isTrueCreator = true;
        orgCreatorUid = user.uid;
        canApproveJoinRequests = true;

        // Self-heal: an org created before the founder's own member record was created
        // automatically at signup won't have one at all, so they'd never appear in their
        // own member list no matter how correct the list-loading logic is. Create it here,
        // once, if it's ever found missing — this fixes it permanently for that org from
        // this point on, not just for this one session.
        try {
          const ownMemberRef = doc(db, 'organisations', currentOrgId, 'members', user.uid);
          const ownMemberSnap = await getDoc(ownMemberRef);
          if (!ownMemberSnap.exists()) {
            await setDoc(ownMemberRef, {
              uid: user.uid,
              email: userData.email || user.email,
              status: 'verified',
              addedByUid: user.uid,
              addedAt: serverTimestamp(),
              canAccessOrgAccount: true,
              isSuperAdmin: false,
              tileAccess: { projects: true, hr: true, members: true }
            });
          }
        } catch (err) {
          // Not fatal — the list will just be missing the founder until this succeeds
          // on a future load.
        }

        renderCreatorView();
        loadUnifiedMemberList();
        return;
      }

      // Not the creator — check Super Admin status first (creator-equivalent access,
      // not gated by any individual tile toggle), then fall back to delegated
      // Members-tile access. Both require a Firestore index on the 'members'
      // collection group for the field being queried — Firestore will show a console
      // link to create whichever index is missing the first time each query runs.
      try {
        const superAdminQuery = query(
          collectionGroup(db, 'members'),
          where('uid', '==', user.uid),
          where('isSuperAdmin', '==', true)
        );
        const superAdminSnap = await getDocs(superAdminQuery);
        if (!superAdminSnap.empty) {
          currentOrgId = superAdminSnap.docs[0].ref.parent.parent.id;
          isTrueCreator = false; // still can't appoint other Super Admins — creator-only, by design
          isCurrentUserSuperAdmin = true;
          canApproveJoinRequests = true;
          const orgSnap = await getDoc(doc(db, 'organisations', currentOrgId));
          orgCreatorUid = orgSnap.exists() ? orgSnap.data().creatorUid : null;
          renderCreatorView();
          loadUnifiedMemberList();
          return;
        }
      } catch (err) {
        // Falls through to the delegated-admin check below.
      }

      try {
        const adminQuery = query(
          collectionGroup(db, 'members'),
          where('uid', '==', user.uid),
          where('tileAccess.members', '==', true)
        );
        const adminSnap = await getDocs(adminQuery);
        if (!adminSnap.empty) {
          // A person could in principle be a Members-admin for more than one org —
          // for now, use the first match.
          const memberDoc = adminSnap.docs[0];
          currentOrgId = memberDoc.ref.parent.parent.id;
          isTrueCreator = false;
          canApproveJoinRequests = false;
          const orgSnap = await getDoc(doc(db, 'organisations', currentOrgId));
          orgCreatorUid = orgSnap.exists() ? orgSnap.data().creatorUid : null;
          renderCreatorView();
          loadUnifiedMemberList();
          return;
        }
      } catch (err) {
        // Falls through to "not allowed" below — including the case where the
        // required index doesn't exist yet.
      }

      renderNotAllowed();
    });

    function renderNotAllowed() {
      document.getElementById('pageBody').innerHTML = `
        <div class="not-allowed">You don't have access to manage members for an organisation.</div>
      `;
    }

    function renderCreatorView() {
      document.getElementById('pageBody').innerHTML = `
        <div class="wa-search-bar-wrap">
          <input type="text" class="wa-search-input" id="memberSearchBox" placeholder="Search members.." oninput="renderMemberListUI()">
        </div>
        <div class="wa-list" id="waMemberList">
          <div class="wa-empty">Loading…</div>
        </div>
      `;
    }


    // ===================== Unified member list =====================
    // One combined, filterable, WhatsApp-style list replacing the four separate cards that
    // used to sit in the page center — Verified, Pending (both the org-invite and the
    // project-join-request kind), and Unverified (someone already in one of this org's
    // projects who isn't verified or pending yet) are all merged into one list here, with
    // a status badge distinguishing them and a click-to-expand row for whatever action
    // applies to that status.

    let allMemberRows = []; // [{ uid, email, status: 'verified', sortTime, data }] — verified staff only now
    let selectedMemberUid = null;
    let currentDetailTab = 'documents'; // 'documents' | 'requests' — resets to 'documents' whenever a new member is selected
    let currentDocuments = []; // cached documents for whichever member's Documents tab is currently open
    let editingDocId = null; // set when the Add-document modal is actually editing an existing one
    let memberDocSearchIndex = {}; // uid -> lowercase text blob of all their document descriptions, for search

    function escapeHtmlLocal(str) {
      const div = document.createElement('div');
      div.textContent = str == null ? '' : str;
      return div.innerHTML;
    }

    async function loadUnifiedMemberList() {
      const listEl = document.getElementById('waMemberList');
      if (!listEl || !currentOrgId) return;
      listEl.innerHTML = '<div class="wa-empty">Loading…</div>';

      const rows = [];

      // This page only manages already-verified staff now — pending invitations and
      // unverified (removed) members are handled entirely on the HR page instead, so
      // there's no need to fetch or show either of those here.
      try {
        const memberSnap = await getDocs(collection(db, 'organisations', currentOrgId, 'members'));
        memberSnap.forEach(docSnap => {
          const m = docSnap.data();
          if (m.status === 'unverified') return;
          rows.push({
            uid: docSnap.id, email: m.email, status: 'verified',
            sortTime: m.addedAt ? m.addedAt.toMillis() : 0,
            data: m
          });
        });
      } catch (err) {
        // Leave the list empty on failure rather than blocking the rest.
      }

      allMemberRows = rows;

      // Build a search index of every member's document descriptions, so searching "abcd"
      // can match a member because of a document titled "abcd" even though their own email
      // doesn't contain it. Done once here (not on every keystroke) and cached in
      // memberDocSearchIndex for renderMemberListUI to use.
      memberDocSearchIndex = {};
      const docFetches = rows.map(async r => {
        try {
          const docsSnap = await getDocs(collection(db, 'organisations', currentOrgId, 'members', r.uid, 'documents'));
          const descriptions = [];
          docsSnap.forEach(d => {
            const desc = d.data().description;
            if (desc) descriptions.push(desc.toLowerCase());
          });
          memberDocSearchIndex[r.uid] = descriptions.join(' ');
        } catch (err) {
          // Leave this member's index empty on failure — their own fields still match normally.
        }
      });
      await Promise.all(docFetches);

      renderMemberListUI();
    }

    function renderMemberListUI() {
      const listEl = document.getElementById('waMemberList');
      if (!listEl) return;
      const searchBox = document.getElementById('memberSearchBox');
      const q = (searchBox ? searchBox.value : '').trim().toLowerCase();

      let rows = allMemberRows.slice();
      if (q) {
        rows = rows.filter(r =>
          (r.email || '').toLowerCase().includes(q) ||
          (memberDocSearchIndex[r.uid] || '').includes(q)
        );
      }

      rows.sort((a, b) => b.sortTime - a.sortTime); // most recently verified first

      if (rows.length === 0) {
        listEl.innerHTML = '<div class="wa-empty">No members to show.</div>';
        return;
      }

      listEl.innerHTML = '';
      rows.forEach(r => {
        const badgeLabel = r.uid === orgCreatorUid ? 'Founder'
          : r.status === 'pending' ? 'Pending'
          : (r.status.charAt(0).toUpperCase() + r.status.slice(1));
        const row = document.createElement('div');
        row.className = 'wa-row' + (selectedMemberUid === r.uid ? ' selected' : '');
        row.dataset.uid = r.uid;
        row.innerHTML = `
          <div class="wa-avatar">${(r.email || '?').charAt(0).toUpperCase()}</div>
          <div class="wa-row-info">
            <div class="wa-row-name">${escapeHtmlLocal(r.email || r.uid)}</div>
            <span class="wa-badge ${r.status}">${badgeLabel}</span>
          </div>
        `;
        row.onclick = () => selectMember(r);
        listEl.appendChild(row);
      });

      // Keep the detail pane in sync with the list — if the selected member fell out of
      // the current filter/search, or their data changed, refresh or clear accordingly.
      if (selectedMemberUid) {
        const match = allMemberRows.find(r => r.uid === selectedMemberUid);
        if (match) renderMemberDetailPane(match);
        else clearMemberSelection();
      }
    }

    function renderMemberDetailPane(r) {
      const panel = document.getElementById('memberDetailPanel');
      if (!panel) return;

      const badgeLabel = r.uid === orgCreatorUid ? 'Founder' : 'Verified';

      panel.innerHTML = `
        <div class="member-detail-header">
          <div class="wa-avatar large">${(r.email || '?').charAt(0).toUpperCase()}</div>
          <div>
            <div class="member-detail-name">${escapeHtmlLocal(r.email || r.uid)}</div>
            <span class="wa-badge ${r.status}">${badgeLabel}</span>
          </div>
        </div>
        <div class="detail-tab-switcher">
          <button class="detail-tab-btn${currentDetailTab === 'documents' ? ' active' : ''}" data-tab="documents">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
            Documents
          </button>
          <button class="detail-tab-btn${currentDetailTab === 'requests' ? ' active' : ''}" data-tab="requests">
            <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            Requests
          </button>
        </div>
        <div id="memberDetailTabContent"></div>
      `;
      panel.querySelectorAll('.detail-tab-btn').forEach(btn => {
        btn.onclick = () => switchDetailTab(btn.dataset.tab, r);
      });

      renderMemberDetailTabContent(r);
    }

    function switchDetailTab(tab, r) {
      currentDetailTab = tab;
      document.querySelectorAll('.detail-tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      renderMemberDetailTabContent(r);
    }

    // Documents and Requests both apply to the founder exactly the same as anyone else —
    // neither is about verification power (unlike the old Details/Permission tabs this
    // page used to have), they're administrative record-keeping and leave/claims/overtime
    // approvals, which the founder can have and use just like any other verified member.
    function renderMemberDetailTabContent(r) {
      if (currentDetailTab === 'requests') {
        renderMemberRequestsTabContent(r);
      } else {
        renderMemberDocumentsTabContent(r);
      }
    }

    function selectMember(r) {
      selectedMemberUid = r.uid;
      currentDetailTab = 'documents';
      document.querySelectorAll('.wa-row').forEach(el => {
        el.classList.toggle('selected', el.dataset.uid === r.uid);
      });
      renderMemberDetailPane(r);
    }

    function clearMemberSelection() {
      selectedMemberUid = null;
      document.getElementById('memberDetailPanel').innerHTML =
        '<div class="member-detail-empty">Select a member to view details.</div>';
    }

    // ===================== Global requests view (Leave / Overtime / Claims) =====================
    // Unlike the per-member Requests tab (which shows one person's own request history),
    // these three sidebar icons show every member's requests of one specific type at once,
    // date-ordered — the view a manager actually needs to work through a stack of pending
    // leave requests without opening each person individually. Fetches each verified
    // member's own requests subcollection directly (allMemberRows is already the full,
    // correct list of who's in this org) rather than a cross-org collection-group query,
    // since that would need every request document to carry a denormalized org ID field
    // that doesn't exist in the schema — this way needs no schema change at all.

    let currentGlobalRequestType = null; // 'leave' | 'overtime' | 'claim' | null (null = normal member-list view)

    const REQUEST_TYPE_LABELS = { leave: 'Leave', overtime: 'Overtime', claim: 'Claims' };

    function showMembersListView() {
      currentGlobalRequestType = null;
      ['sidebarTabMembers', 'sidebarTabLeave', 'sidebarTabOvertime', 'sidebarTabClaims'].forEach(id => {
        document.getElementById(id).classList.toggle('active', id === 'sidebarTabMembers');
      });
      if (selectedMemberUid) {
        const match = allMemberRows.find(r => r.uid === selectedMemberUid);
        if (match) { renderMemberDetailPane(match); return; }
      }
      clearMemberSelection();
    }
    window.showMembersListView = showMembersListView;

    let cachedGlobalRequests = []; // the last-fetched combined list, so filter pills can re-render without re-fetching
    let currentGlobalRequestStatusFilter = 'all'; // 'all' | 'pending' | 'approved'

    async function showGlobalRequestsView(type) {
      currentGlobalRequestType = type;
      currentGlobalRequestStatusFilter = 'all';
      selectedMemberUid = null;
      document.querySelectorAll('.wa-row').forEach(el => el.classList.remove('selected'));
      const idForType = { leave: 'sidebarTabLeave', overtime: 'sidebarTabOvertime', claim: 'sidebarTabClaims' }[type];
      ['sidebarTabMembers', 'sidebarTabLeave', 'sidebarTabOvertime', 'sidebarTabClaims'].forEach(id => {
        document.getElementById(id).classList.toggle('active', id === idForType);
      });

      const panel = document.getElementById('memberDetailPanel');
      panel.innerHTML = `
        <div class="member-detail-header" style="margin-bottom:8px;">
          <div class="member-detail-name">${REQUEST_TYPE_LABELS[type]} requests</div>
        </div>
        <div class="req-filter-pills" id="globalRequestsFilterPills">
          <button class="req-pill active" data-status="all" onclick="setGlobalRequestsFilter('all')">All</button>
          <button class="req-pill" data-status="pending" onclick="setGlobalRequestsFilter('pending')">Pending</button>
          <button class="req-pill" data-status="approved" onclick="setGlobalRequestsFilter('approved')">Approved</button>
        </div>
        <div id="globalRequestsListArea"><div class="wa-empty">Loading…</div></div>
      `;

      const listArea = document.getElementById('globalRequestsListArea');
      const combined = [];
      try {
        const fetches = allMemberRows.map(async r => {
          try {
            const snap = await getDocs(query(
              collection(db, 'organisations', currentOrgId, 'members', r.uid, 'requests'),
              where('type', '==', type)
            ));
            snap.forEach(d => combined.push({ id: d.id, memberUid: r.uid, memberEmail: r.email, ...d.data() }));
          } catch (err) {
            // Skip this member's requests on failure — the rest of the list still renders.
          }
        });
        await Promise.all(fetches);
      } catch (err) {
        // Falls through to the empty-state / partial-results rendering below.
      }

      combined.sort((a, b) => (b.submittedAt?.toMillis?.() || 0) - (a.submittedAt?.toMillis?.() || 0));
      cachedGlobalRequests = combined;
      renderGlobalRequestsList();
    }

    function setGlobalRequestsFilter(status) {
      currentGlobalRequestStatusFilter = status;
      document.querySelectorAll('.req-pill').forEach(p => p.classList.toggle('active', p.dataset.status === status));
      renderGlobalRequestsList();
    }
    window.setGlobalRequestsFilter = setGlobalRequestsFilter;

    function renderGlobalRequestsList() {
      const listArea = document.getElementById('globalRequestsListArea');
      if (!listArea) return;
      const type = currentGlobalRequestType;

      let rows = cachedGlobalRequests;
      if (currentGlobalRequestStatusFilter !== 'all') {
        rows = rows.filter(req => (req.status || 'pending') === currentGlobalRequestStatusFilter);
      }

      if (rows.length === 0) {
        listArea.innerHTML = `<div class="wa-empty">No ${REQUEST_TYPE_LABELS[type].toLowerCase()} requests${currentGlobalRequestStatusFilter !== 'all' ? ' with this status' : ''}.</div>`;
        return;
      }

      listArea.innerHTML = '';
      rows.forEach(req => {
        const statusLabel = req.status || 'pending';
        const submittedDate = req.submittedAt && req.submittedAt.toDate ? req.submittedAt.toDate() : null;
        const card = document.createElement('div');
        card.className = 'mail-card';
        card.innerHTML = `
          <div class="mail-subject">${escapeHtmlLocal(req.memberEmail || req.memberUid)}${req.details ? ' — ' + escapeHtmlLocal(req.details) : ''}</div>
          <div class="mail-time">${submittedDate ? submittedDate.toLocaleString() : ''}</div>
          <span class="mail-status ${statusLabel}">${statusLabel.charAt(0).toUpperCase() + statusLabel.slice(1)}</span>
          ${statusLabel === 'pending' ? `
          <div style="display:flex; gap:8px; margin-top:10px;">
            <button class="verify-btn">Approve</button>
            <button class="verify-btn danger">Reject</button>
          </div>` : ''}
        `;
        if (statusLabel === 'pending') {
          const [approveBtn, rejectBtn] = card.querySelectorAll('.verify-btn');
          approveBtn.onclick = async () => { await respondToRequest(req.memberUid, req.id, 'approved'); showGlobalRequestsView(type); };
          rejectBtn.onclick = async () => { await respondToRequest(req.memberUid, req.id, 'rejected'); showGlobalRequestsView(type); };
        }
        listArea.appendChild(card);
      });
    }
    window.showGlobalRequestsView = showGlobalRequestsView;

    // ===================== Member documents (certifications, licenses, IDs, etc.) =====================

    let pendingDocFiles = []; // [{ file, kind: 'image'|'pdf' }, ...] — staged until Save is pressed
    let existingAttachments = []; // attachments already saved on the document being edited
    let docModalMemberUid = null; // which member's Documents tab the open modal is adding/editing for

    // Document management is administrative record-keeping — anyone who can even reach
    // this page already has org-admin-level access (creator, Super Admin, or a delegated
    // Members-tile admin — that's exactly what gates entry to this whole view in the auth
    // callback above), so there's no further per-target restriction to check here, matching
    // the documents security rule itself.
    function canManageDocuments() {
      return true;
    }

    // ===================== Requests (leave, claims, overtime) =====================
    // Submitted from the member's own diBadge app — this page only approves or rejects
    // them, it never creates one. An approved request is expected to also show up on the
    // HR page's calendar for that member; wiring that display is a separate, later piece
    // of work — this only records the approval itself.

    function canManageRequests() {
      return true; // same reasoning as canManageDocuments above
    }

    let cachedMemberRequests = []; // the last-fetched list for whichever member's Requests tab is open
    let currentMemberRequestStatusFilter = 'all'; // 'all' | 'pending' | 'approved'

    async function renderMemberRequestsTabContent(r) {
      const content = document.getElementById('memberDetailTabContent');
      if (!content) return;
      currentMemberRequestStatusFilter = 'all';

      content.innerHTML = `
        <div class="doc-tab-header">
          <span style="font-size:0.8rem; color:var(--subtext-color); font-weight:600;">REQUESTS</span>
        </div>
        <div class="req-filter-pills" id="memberRequestsFilterPills">
          <button class="req-pill active" data-status="all" onclick="setMemberRequestsFilter('all')">All</button>
          <button class="req-pill" data-status="pending" onclick="setMemberRequestsFilter('pending')">Pending</button>
          <button class="req-pill" data-status="approved" onclick="setMemberRequestsFilter('approved')">Approved</button>
        </div>
        <div id="requestsListArea"><div class="wa-empty">Loading…</div></div>
      `;

      const listArea = document.getElementById('requestsListArea');
      try {
        const snap = await getDocs(collection(db, 'organisations', currentOrgId, 'members', r.uid, 'requests'));
        const requests = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        requests.sort((a, b) => (b.submittedAt?.toMillis?.() || 0) - (a.submittedAt?.toMillis?.() || 0));
        cachedMemberRequests = requests;
        renderMemberRequestsList(r);
      } catch (err) {
        listArea.innerHTML = '<div class="wa-empty">Couldn\'t load requests.</div>';
      }
    }

    function setMemberRequestsFilter(status) {
      currentMemberRequestStatusFilter = status;
      document.querySelectorAll('#memberRequestsFilterPills .req-pill').forEach(p => p.classList.toggle('active', p.dataset.status === status));
      const r = allMemberRows.find(row => row.uid === selectedMemberUid);
      if (r) renderMemberRequestsList(r);
    }
    window.setMemberRequestsFilter = setMemberRequestsFilter;

    function renderMemberRequestsList(r) {
      const listArea = document.getElementById('requestsListArea');
      if (!listArea) return;
      const canManage = canManageRequests();

      let rows = cachedMemberRequests;
      if (currentMemberRequestStatusFilter !== 'all') {
        rows = rows.filter(req => (req.status || 'pending') === currentMemberRequestStatusFilter);
      }

      if (rows.length === 0) {
        listArea.innerHTML = `<div class="wa-empty">No requests${currentMemberRequestStatusFilter !== 'all' ? ' with this status' : ' yet'}.</div>`;
        return;
      }

      listArea.innerHTML = '';
      rows.forEach(req => {
        const typeLabel = (req.type || 'request').charAt(0).toUpperCase() + (req.type || 'request').slice(1);
        const statusLabel = req.status || 'pending';
        const submittedDate = req.submittedAt && req.submittedAt.toDate ? req.submittedAt.toDate() : null;
        const card = document.createElement('div');
        card.className = 'mail-card';
        card.innerHTML = `
          <div class="mail-subject">${escapeHtmlLocal(typeLabel)}${req.details ? ' — ' + escapeHtmlLocal(req.details) : ''}</div>
          <div class="mail-time">${submittedDate ? submittedDate.toLocaleString() : ''}</div>
          <span class="mail-status ${statusLabel}">${statusLabel.charAt(0).toUpperCase() + statusLabel.slice(1)}</span>
          ${canManage && statusLabel === 'pending' ? `
          <div style="display:flex; gap:8px; margin-top:10px;">
            <button class="verify-btn">Approve</button>
            <button class="verify-btn danger">Reject</button>
          </div>` : ''}
        `;
        if (canManage && statusLabel === 'pending') {
          const [approveBtn, rejectBtn] = card.querySelectorAll('.verify-btn');
          approveBtn.onclick = () => respondToRequest(r.uid, req.id, 'approved');
          rejectBtn.onclick = () => respondToRequest(r.uid, req.id, 'rejected');
        }
        listArea.appendChild(card);
      });
    }

    async function respondToRequest(memberUid, requestId, decision) {
      try {
        await updateDoc(doc(db, 'organisations', currentOrgId, 'members', memberUid, 'requests', requestId), {
          status: decision,
          decidedByUid: currentUid,
          decidedAt: serverTimestamp()
        });
        const r = allMemberRows.find(row => row.uid === memberUid);
        if (r) renderMemberRequestsTabContent(r);
      } catch (err) {
        alert('Could not update this request — please try again.');
      }
    }

    async function renderMemberDocumentsTabContent(r) {
      const content = document.getElementById('memberDetailTabContent');
      if (!content) return;
      const canManage = canManageDocuments();

      content.innerHTML = `
        <div class="doc-tab-header">
          <span style="font-size:0.8rem; color:var(--subtext-color); font-weight:600;">DOCUMENTS</span>
          ${canManage ? `
          <button class="doc-add-pill" onclick="openDocModal('${r.uid}')">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Add
          </button>` : ''}
        </div>
        <div id="docListArea"><div class="wa-empty">Loading…</div></div>
      `;

      const listArea = document.getElementById('docListArea');
      try {
        const snap = await getDocs(collection(db, 'organisations', currentOrgId, 'members', r.uid, 'documents'));
        if (snap.empty) {
          listArea.innerHTML = '<div class="wa-empty">No documents yet.</div>';
          currentDocuments = [];
          return;
        }
        currentDocuments = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        // Most-recently-added first.
        currentDocuments.sort((a, b) => (b.uploadedAt?.toMillis?.() || 0) - (a.uploadedAt?.toMillis?.() || 0));

        listArea.innerHTML = '';
        currentDocuments.forEach(docData => {
          const expiryLabel = docData.isNA ? 'No expiry' : (docData.expiryDate ? `Expires ${docData.expiryDate}` : '');
          const attachments = docData.attachments || [];
          const previewsHtml = attachments.map(att =>
            att.fileType === 'image'
              ? `<a href="${att.fileUrl}" target="_blank" rel="noopener"><img class="doc-preview-thumb" src="${att.fileUrl}" alt="attachment"></a>`
              : `<a href="${att.fileUrl}" target="_blank" rel="noopener"><div class="doc-preview-pdf">PDF</div></a>`
          ).join('');
          const card = document.createElement('div');
          card.className = 'doc-card';
          card.innerHTML = `
            <div>
              <div class="doc-card-heading">${escapeHtmlLocal(docData.description || 'Untitled')}</div>
              <div class="doc-card-expiry">${expiryLabel}</div>
            </div>
            <div class="doc-card-right">
              <div style="display:flex; gap:6px; flex-wrap:wrap; max-width:130px; justify-content:flex-end;">${previewsHtml}</div>
              ${canManage ? `
              <button class="doc-icon-btn" title="Edit">
                <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
              </button>
              <button class="doc-icon-btn" title="Delete">
                <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>
              </button>` : ''}
            </div>
          `;
          if (canManage) {
            const [editBtn, deleteBtn] = card.querySelectorAll('.doc-icon-btn');
            editBtn.onclick = () => openDocModal(r.uid, docData);
            deleteBtn.onclick = () => deleteDocument(r.uid, docData);
          }
          listArea.appendChild(card);
        });
      } catch (err) {
        listArea.innerHTML = '<div class="wa-empty">Couldn\'t load documents.</div>';
      }
    }

    function openDocModal(memberUid, existingDoc) {
      docModalMemberUid = memberUid;
      editingDocId = existingDoc ? existingDoc.id : null;
      pendingDocFiles = [];
      existingAttachments = existingDoc ? (existingDoc.attachments || []) : [];

      document.getElementById('docModalTitle').textContent = existingDoc ? 'Edit Document' : 'Add Document';
      document.getElementById('docDescriptionInput').value = existingDoc ? (existingDoc.description || '') : '';
      document.getElementById('docExpiryInput').value = existingDoc && !existingDoc.isNA ? (existingDoc.expiryDate || '') : '';
      document.getElementById('docExpiryInput').disabled = !!(existingDoc && existingDoc.isNA);
      document.getElementById('docNaChip').classList.toggle('active', !!(existingDoc && existingDoc.isNA));
      document.getElementById('docFileInput').value = '';
      renderDocFileChips();
      updateDocExpiryDisplay();

      document.getElementById('docModalOverlay').classList.add('active');
    }

    function closeDocModal(event) {
      if (event && event.target !== event.currentTarget) return;
      document.getElementById('docModalOverlay').classList.remove('active');
      pendingDocFiles = [];
      existingAttachments = [];
      editingDocId = null;
    }
    window.openDocModal = openDocModal;
    window.closeDocModal = closeDocModal;

    function renderDocFileChips() {
      const row = document.getElementById('docFileChipsRow');
      row.innerHTML = '';
      const attachBtn = document.getElementById('docAttachBtn');
      const total = existingAttachments.length + pendingDocFiles.length;
      attachBtn.classList.toggle('has-file', total > 0);
      document.getElementById('docAttachLabel').textContent = total > 0
        ? `${total} file${total > 1 ? 's' : ''} attached — add more`
        : 'Attachment';

      existingAttachments.forEach((att, idx) => {
        const chip = document.createElement('div');
        chip.className = 'doc-file-chip';
        chip.innerHTML = `<span>${escapeHtmlLocal(att.fileName || 'file')}</span><button title="Remove"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>`;
        chip.querySelector('button').onclick = () => {
          existingAttachments.splice(idx, 1);
          renderDocFileChips();
        };
        row.appendChild(chip);
      });
      pendingDocFiles.forEach((pf, idx) => {
        const chip = document.createElement('div');
        chip.className = 'doc-file-chip';
        chip.innerHTML = `<span>${escapeHtmlLocal(pf.file.name)}</span><button title="Remove"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>`;
        chip.querySelector('button').onclick = () => {
          pendingDocFiles.splice(idx, 1);
          renderDocFileChips();
        };
        row.appendChild(chip);
      });
    }

    function handleDocFileSelected(event) {
      const files = Array.from(event.target.files || []);
      files.forEach(file => {
        const kind = file.type === 'application/pdf' ? 'pdf' : 'image';
        pendingDocFiles.push({ file, kind });
      });
      event.target.value = ''; // lets the same file be re-picked later if removed and re-added
      renderDocFileChips();
    }
    window.handleDocFileSelected = handleDocFileSelected;

    function toggleDocNA() {
      const chip = document.getElementById('docNaChip');
      const input = document.getElementById('docExpiryInput');
      const nowActive = !chip.classList.contains('active');
      chip.classList.toggle('active', nowActive);
      input.disabled = nowActive;
      if (nowActive) input.value = '';
      updateDocExpiryDisplay();
    }
    window.toggleDocNA = toggleDocNA;

    // A native date input always renders its own value in the browser's own locale format
    // and never accepts custom placeholder text — this drives the separate styled display
    // div sitting visibly on top of it (see .doc-date-display / .doc-date-native-input).
    function formatExpiryDateDisplay(isoDateStr) {
      const [year, month, day] = isoDateStr.split('-');
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return `${day}-${months[parseInt(month, 10) - 1]}-${year}`;
    }

    function updateDocExpiryDisplay() {
      const input = document.getElementById('docExpiryInput');
      const display = document.getElementById('docExpiryDisplay');
      const textEl = document.getElementById('docExpiryDisplayText');
      const icon = display.querySelector('svg');
      const naChip = document.getElementById('docNaChip');
      const naActive = naChip.classList.contains('active');

      if (naActive) {
        textEl.textContent = 'No expiry';
        display.classList.add('has-value');
        icon.classList.add('dimmed');
        naChip.classList.remove('dimmed');
      } else if (input.value) {
        textEl.textContent = formatExpiryDateDisplay(input.value);
        display.classList.add('has-value');
        icon.classList.remove('dimmed');
        naChip.classList.add('dimmed');
      } else {
        textEl.textContent = 'Expiry date';
        display.classList.remove('has-value');
        icon.classList.remove('dimmed');
        naChip.classList.remove('dimmed');
      }
    }
    window.updateDocExpiryDisplay = updateDocExpiryDisplay;

    async function saveDocument() {
      const description = document.getElementById('docDescriptionInput').value.trim();
      const isNA = document.getElementById('docNaChip').classList.contains('active');
      const expiryDate = isNA ? null : (document.getElementById('docExpiryInput').value || null);
      const memberUid = docModalMemberUid;

      if (!description) {
        alert('Please add a description.');
        return;
      }
      if (existingAttachments.length === 0 && pendingDocFiles.length === 0) {
        alert('Please attach at least one photo or PDF.');
        return;
      }

      const btn = document.getElementById('docSaveBtn');
      btn.disabled = true;
      btn.textContent = 'Saving…';

      try {
        const docId = editingDocId || doc(collection(db, 'organisations', currentOrgId, 'members', memberUid, 'documents')).id;
        const docRef = doc(db, 'organisations', currentOrgId, 'members', memberUid, 'documents', docId);

        const newlyUploaded = [];
        for (const pf of pendingDocFiles) {
          const storageRef = ref(storage, `organisations/${currentOrgId}/members/${memberUid}/documents/${docId}/${pf.file.name}`);
          await uploadBytes(storageRef, pf.file);
          const fileUrl = await getDownloadURL(storageRef);
          newlyUploaded.push({ fileUrl, fileName: pf.file.name, fileType: pf.kind });
        }

        const payload = {
          description,
          isNA,
          expiryDate,
          attachments: [...existingAttachments, ...newlyUploaded],
          uploadedByUid: currentUid,
          uploadedAt: serverTimestamp()
        };

        await setDoc(docRef, payload, { merge: true });
        closeDocModal();
        const r = allMemberRows.find(row => row.uid === memberUid);
        if (r) renderMemberDocumentsTabContent(r);
        // A description just changed, which the search index above is keyed on — refresh
        // that index in the background so the member list's search stays accurate without
        // making the person wait on it before the modal closes.
        loadUnifiedMemberList();
      } catch (err) {
        alert('Could not save the document — please try again.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Save';
      }
    }
    window.saveDocument = saveDocument;

    let pendingDeleteDoc = null; // { memberUid, docData } — staged while the confirm popup is open

    function deleteDocument(memberUid, docData) {
      pendingDeleteDoc = { memberUid, docData };
      document.getElementById('deleteDocConfirmMessage').textContent =
        `"${docData.description || 'This document'}" and its attachment${(docData.attachments || []).length > 1 ? 's' : ''} will be permanently removed.`;
      document.getElementById('deleteDocConfirmOverlay').classList.add('active');
    }

    function closeDeleteDocConfirm(event) {
      if (event && event.target !== event.currentTarget) return;
      document.getElementById('deleteDocConfirmOverlay').classList.remove('active');
      pendingDeleteDoc = null;
    }
    window.closeDeleteDocConfirm = closeDeleteDocConfirm;

    async function confirmDeleteDocument() {
      if (!pendingDeleteDoc) return;
      const { memberUid, docData } = pendingDeleteDoc;
      closeDeleteDocConfirm();
      try {
        await deleteDoc(doc(db, 'organisations', currentOrgId, 'members', memberUid, 'documents', docData.id));
        for (const att of (docData.attachments || [])) {
          try {
            await deleteObject(ref(storage, `organisations/${currentOrgId}/members/${memberUid}/documents/${docData.id}/${att.fileName}`));
          } catch (err) {
            // The Firestore record is already gone — a leftover Storage file isn't a blocking failure.
          }
        }
        const r = allMemberRows.find(row => row.uid === memberUid);
        if (r) renderMemberDocumentsTabContent(r);
        loadUnifiedMemberList(); // refresh the document search index too
      } catch (err) {
        alert('Could not delete the document — please try again.');
      }
    }
    window.confirmDeleteDocument = confirmDeleteDocument;
  </script>
</body>
</html>
