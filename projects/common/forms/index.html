        if (selectedImageBlock === block) selectedImageBlock = null;
        hasUnsavedChanges = true;
        pushHistorySnapshot();
      });

      // Move — same alignment-guide-aware dragging as the other block types
      moveHandle.addEventListener('pointerdown', function(e) {
        e.preventDefault();
        e.stopPropagation();
        block.classList.add('image-dragging');
        const startX = e.clientX, startY = e.clientY;
        const startLeft = parseFloat(block.style.left) || 0;
        const startTop = parseFloat(block.style.top) || 0;
        const blockW = block.offsetWidth, blockH = block.offsetHeight;

        function onMove(ev) {
          const dx = ev.clientX - startX, dy = ev.clientY - startY;
          const maxLeft = Math.max(0, page.clientWidth - blockW);
          const maxTop = Math.max(0, page.clientHeight - blockH);
          const newLeft = Math.min(maxLeft, Math.max(0, startLeft + dx));
          const newTop = Math.min(maxTop, Math.max(0, startTop + dy));
          const snapped = applyAlignmentSnap(page, block, newLeft, newTop);
          block.style.left = snapped.left + 'px';
          block.style.top = snapped.top + 'px';
          hasUnsavedChanges = true;
        }
        function onUp() {
          block.classList.remove('image-dragging');
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
          clearAlignmentGuides(page);
          pushHistorySnapshot();
        }
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
      });

      // 8 resize handles — corners scale proportionally (anchored at the opposite corner),
      // edge midpoints resize only that one side. Both are clamped so the image can never be
      // dragged past the page's own edges.
      resizeHandles.forEach(function(handle) {
        const dir = handle.getAttribute('data-dir');
        const isCorner = dir.length === 2;

        handle.addEventListener('pointerdown', function(e) {
          e.preventDefault();
          e.stopPropagation();
          const pageRect = page.getBoundingClientRect();
          const startLeft = parseFloat(block.style.left) || 0;
          const startTop = parseFloat(block.style.top) || 0;
          const startW = block.offsetWidth, startH = block.offsetHeight;
          const aspect = startW / startH;

          let anchorLeft, anchorTop, draggedX, draggedY;
          if (isCorner) {
            if (dir === 'nw') { anchorLeft = startLeft + startW; anchorTop = startTop + startH; draggedX = startLeft; draggedY = startTop; }
            else if (dir === 'ne') { anchorLeft = startLeft; anchorTop = startTop + startH; draggedX = startLeft + startW; draggedY = startTop; }
            else if (dir === 'sw') { anchorLeft = startLeft + startW; anchorTop = startTop; draggedX = startLeft; draggedY = startTop + startH; }
            else { anchorLeft = startLeft; anchorTop = startTop; draggedX = startLeft + startW; draggedY = startTop + startH; } // se
          }
          const origDist = isCorner ? (Math.hypot(draggedX - anchorLeft, draggedY - anchorTop) || 1) : 0;

          function onMove(ev) {
            const mouseX = ev.clientX - pageRect.left;
            const mouseY = ev.clientY - pageRect.top;
            let newLeft = startLeft, newTop = startTop, newW = startW, newH = startH;

            if (isCorner) {
              const newDist = Math.hypot(mouseX - anchorLeft, mouseY - anchorTop);
              const scale = Math.max(0.15, newDist / origDist);
              newW = Math.max(20, startW * scale);
              newH = newW / aspect;
              if (dir === 'nw') { newLeft = anchorLeft - newW; newTop = anchorTop - newH; }
              else if (dir === 'ne') { newLeft = anchorLeft; newTop = anchorTop - newH; }
              else if (dir === 'sw') { newLeft = anchorLeft - newW; newTop = anchorTop; }
              else { newLeft = anchorLeft; newTop = anchorTop; } // se
            } else {
              if (dir === 'e') { newW = Math.max(20, mouseX - startLeft); }
              else if (dir === 'w') { newW = Math.max(20, startLeft + startW - mouseX); newLeft = startLeft + startW - newW; }
              else if (dir === 's') { newH = Math.max(20, mouseY - startTop); }
              else if (dir === 'n') { newH = Math.max(20, startTop + startH - mouseY); newTop = startTop + startH - newH; }
            }

            // Clamp to the page's own boundaries — resizing can never push the image outside it
            if (newLeft < 0) { newW += newLeft; newLeft = 0; }
            if (newTop < 0) { newH += newTop; newTop = 0; }
            if (newLeft + newW > page.clientWidth) newW = page.clientWidth - newLeft;
            if (newTop + newH > page.clientHeight) newH = page.clientHeight - newTop;
            newW = Math.max(20, newW);
            newH = Math.max(20, newH);

            block.style.left = newLeft + 'px';
            block.style.top = newTop + 'px';
            block.style.width = newW + 'px';
            block.style.height = newH + 'px';
            hasUnsavedChanges = true;
          }
          function onUp() {
            document.removeEventListener('pointermove', onMove);
            document.removeEventListener('pointerup', onUp);
            pushHistorySnapshot();
          }
          document.addEventListener('pointermove', onMove);
          document.addEventListener('pointerup', onUp);
        });
      });

      // Rotation — drag around the block's own center
      rotateHandle.addEventListener('pointerdown', function(e) {
        e.preventDefault();
        e.stopPropagation();
        function onMove(ev) {
          const rect = block.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          const angle = Math.atan2(ev.clientY - cy, ev.clientX - cx) * 180 / Math.PI + 90;
          block.style.transform = 'rotate(' + angle + 'deg)';
          hasUnsavedChanges = true;
        }
        function onUp() {
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
          pushHistorySnapshot();
        }
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
      });
    }

    const TEXT_ALIGN_COMMANDS = ['justifyLeft', 'justifyCenter', 'justifyRight', 'justifyFull'];
    let textAlignIndex = 0;

    function cycleTextAlign() {
      document.getElementById('formSheet').focus();
      document.execCommand(TEXT_ALIGN_COMMANDS[textAlignIndex]);
      textAlignIndex = (textAlignIndex + 1) % TEXT_ALIGN_COMMANDS.length;
      hasUnsavedChanges = true;
      pushHistorySnapshot();
    }

    function applyFillColor(color) {
      document.getElementById('formSheet').focus();
      document.execCommand('hiliteColor', false, color);
      hasUnsavedChanges = true;
      pushHistorySnapshot();
    }

    function applyTextColor(color) {
      document.getElementById('formSheet').focus();
      document.execCommand('foreColor', false, color);
      hasUnsavedChanges = true;
      pushHistorySnapshot();
    }

    // ===================== Save toast =====================
    function showSaveToast(message) {
      const toast = document.getElementById('saveToast');
      if (!toast) return;
      toast.textContent = message || 'Saved';
      toast.classList.add('active');
      clearTimeout(saveToastTimer);
      saveToastTimer = setTimeout(function() { toast.classList.remove('active'); }, 1800);
    }

    function handleSaveClick() {
      saveCurrentFormContent();
      hasUnsavedChanges = false;
      showSaveToast('Saved');
    }

    // Undo button flushes any pending debounced typing snapshot first — otherwise clicking
    // Undo right after typing (before the 500ms debounce fires) has nothing to undo yet and
    // silently does nothing, which looks like a broken button.
    function handleUndoClick() {
      clearTimeout(historyDebounceTimer);
      pushHistorySnapshot();
      undoFormChange();
    }
  </script>
</body>
</html>
