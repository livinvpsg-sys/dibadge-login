<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>diBadge | Project Forms</title>

  <script>
    (function() {
      const savedTheme = localStorage.getItem('dibadge_web_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>

  <style>
    :root {
      --jet-black: #0f0f0f;
      --paper-white: #f8f9fa;
      --slate-surface: #1e1e1e;
      --accent-white: #ffffff;
      --muted-gray: #8e8e93;
      --cool-ash: #a1a1a6;
      --soft-border: #e5e5ea;

      --bg-color: var(--paper-white);
      --text-color: var(--jet-black);
      --surface-color: var(--accent-white);
      --header-bg: var(--paper-white);
      --tabbar-bg: var(--paper-white);
      --border-color: var(--soft-border);
      --subtext-color: var(--cool-ash);
    }
    [data-theme="dark"] {
      --bg-color: var(--jet-black);
      --text-color: var(--accent-white);
      --surface-color: var(--slate-surface);
      --header-bg: #050505;
      --tabbar-bg: #050505;
      --border-color: #2c2c2e;
      --subtext-color: var(--muted-gray);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    /* Themed scrollbar, matching the chat screen — not the browser default */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #000000; }
    ::-webkit-scrollbar-thumb { background: var(--slate-surface, #1e1e1e); border-radius: 4px; border: 1px solid var(--border-color, #2c2c2e); }
    ::-webkit-scrollbar-thumb:hover { background: #2c2c2e; }
    * { scrollbar-width: thin; scrollbar-color: var(--slate-surface, #1e1e1e) #000000; }

    /* Header — same shell as the Projects screen */
    .dashboard-header { background: var(--header-bg); color: var(--text-color); padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 64px; flex-shrink: 0; border-bottom: 1px solid var(--border-color); }
    .default-header-title { display: flex; align-items: center; gap: 12px; }
    .default-header-title h1 { font-size: 1.25rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .header-center { flex: 1; max-width: 450px; margin: 0 20px; display: flex; align-items: center; gap: 12px; }
    .search-input { flex: 1; background: var(--surface-color); color: var(--text-color); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 20px; font-size: 0.88rem; outline: none; }
    .search-input::placeholder { color: var(--subtext-color); }
    .view-mode-toggle { display: flex; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 2px; }
    .view-btn { background: transparent; border: none; color: var(--subtext-color); padding: 6px 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
    .view-btn svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; }
    .view-btn.active { background: var(--paper-white); color: var(--jet-black); }

    .folder-header-nav { display: flex; align-items: center; gap: 12px; font-size: 1.05rem; font-weight: 600; }
    .header-back-icon { background: transparent; border: none; color: var(--text-color); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; border-radius: 6px; }
    .header-back-icon:hover { background: var(--surface-color); }
    .header-breadcrumb-path { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .breadcrumb-item { cursor: pointer; color: var(--subtext-color); text-decoration: none; }
    .breadcrumb-item:hover { text-decoration: underline; }
    .breadcrumb-item.active { color: var(--text-color); cursor: default; text-decoration: none; }

    .dashboard-body-split { display: flex; flex: 1; height: calc(100vh - 64px); overflow: hidden; position: relative; }

    /* Left Navigation Bar — same as Projects screen */
    .left-vertical-tabbar { width: 64px; background: var(--tabbar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; padding: 16px 0; z-index: 10; }
    .tab-btn { width: 44px; height: 44px; border-radius: 10px; background: transparent; border: none; color: var(--subtext-color); display: flex; justify-content: center; align-items: center; margin-bottom: 10px; text-decoration: none; cursor: pointer; transition: all 0.2s; }
    .tab-btn svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .tab-btn:hover { background: var(--slate-surface); color: #ffffff; }
    .tab-btn.active { background: var(--slate-surface); color: #ffffff; }
    .main-nav-group { display: flex; flex-direction: column; align-items: center; width: 100%; }
    .fab-tab-btn { margin-top: auto; background: var(--paper-white); color: var(--jet-black); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); cursor: pointer; display: flex; }
    .fab-tab-btn:hover { opacity: 0.9; transform: scale(1.05); }

    /* Forms library workspace */
    .forms-workspace { flex: 1; padding: 24px; overflow-y: auto; background: var(--bg-color); }
    .forms-panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .forms-panel-header h2 { font-size: 1.05rem; font-weight: 700; }
    .forms-add-btn { background: var(--surface-color); border: 1px solid var(--border-color); color: var(--text-color); padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    .forms-add-btn:hover { background: var(--border-color); }
    .forms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
    .form-card { background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 16px 12px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; cursor: pointer; transition: transform 0.15s, background 0.15s; }
    .form-card:hover { transform: translateY(-3px); background: rgba(255,255,255,0.05); }
    .form-card svg { width: 40px; height: 40px; stroke: var(--text-color); fill: none; stroke-width: 1.6; }
    .form-card-name { font-size: 0.82rem; font-weight: 600; color: var(--text-color); line-height: 1.25; word-break: break-word; }

    .forms-list-container { display: flex; flex-direction: column; gap: 2px; }
    .form-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 8px; cursor: pointer; transition: background 0.15s; }
    .form-row:hover { background: rgba(255,255,255,0.05); }
    .form-row svg { width: 22px; height: 22px; stroke: var(--text-color); fill: none; stroke-width: 1.6; flex-shrink: 0; }
    .form-row-name { font-size: 0.88rem; font-weight: 600; color: var(--text-color); }

    /* Individual form work screen — a blank A4 page, same idea as opening a new Word document */
    .form-sheet-wrapper { flex: 1; overflow-y: auto; padding: 40px; display: flex; justify-content: center; background: var(--bg-color); }
    .a4-page {
      background: #ffffff;
      width: 794px;       /* A4 at 96dpi */
      min-height: 1123px;
      max-width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.45);
      padding: 72px 76px;
      color: #1a1a1a;
      font-size: 1rem;
      line-height: 1.6;
      outline: none;
      box-sizing: border-box;
      position: relative; /* positioning context for floating blocks like Question & Answer */
    }
    .a4-page:empty:before {
      content: attr(data-placeholder);
      color: #999;
    }

    /* Form-building tool rail */
    .form-tools-rail {
      width: 56px;
      flex-shrink: 0;
      background: var(--surface-color);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0;
      gap: 6px;
    }
    .form-tool-btn {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: transparent;
      border: none;
      color: var(--subtext-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .form-tool-btn:hover { background: var(--border-color); color: var(--text-color); }
    .form-tool-btn-inactive { opacity: 0.35; }
    .form-tool-btn-inactive:hover { background: transparent; }

    /* Save confirmation toast */
    .save-toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #1e1e1e;
      color: #fff;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 300;
    }
    .save-toast.active {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .form-tool-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .form-tool-divider { width: 28px; height: 1px; background: var(--border-color); margin: 6px 0; }

    /* Inserted question/options blocks — light styling since the page itself is white */
    /* Question & Answer — a floating, movable, resizable block (like a text box in Word) */
    .qa-block {
      position: absolute;
      min-width: 160px;
      pointer-events: none; /* the wrapper itself never intercepts clicks — only its specific
                                interactive children (below) re-enable pointer events */
    }
    .qa-block.qa-dragging { z-index: 50; }
    .qa-move-zone {
      position: absolute;
      top: -26px; left: -2px;
      width: 62px; height: 34px;
      z-index: 5;
      pointer-events: auto; /* taller zone spans down to the block's corner so hovering there
                                still triggers it, while the icons render at the top with
                                visible breathing room above the block itself */
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }
    .qa-move-handle, .qa-delete-handle {
      display: none;
      align-items: center;
      justify-content: center;
      width: 26px; height: 26px;
      border-radius: 5px;
      background: #ffffff;
      border: 1.5px solid #666;
      color: #333;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      user-select: none;
      flex-shrink: 0;
    }
    .qa-move-handle svg, .qa-delete-handle svg { width: 15px; height: 15px; stroke: #333; stroke-width: 1.8; fill: none; }
    .qa-move-handle { cursor: move; }
    .qa-delete-handle { cursor: pointer; }
    .qa-delete-handle:hover { border-color: #ff3b30; }
    .qa-delete-handle:hover svg { stroke: #ff3b30; }
    .qa-move-zone:hover .qa-move-handle,
    .qa-move-zone:hover .qa-delete-handle { display: flex; }
    .qa-question-input {
      display: block;
      width: 100%;
      border: none;
      outline: none;
      font-weight: 700;
      font-size: 1rem;
      padding: 4px 2px;
      background: transparent;
      color: #1a1a1a;
      font-family: inherit;
      box-sizing: border-box;
      pointer-events: auto; /* needs to be typable */
    }
    .qa-question-input::placeholder { color: #999; font-weight: 700; }
    .qa-answer-box {
      position: relative;
      border: 1px solid #999;
      border-radius: 4px;
      min-height: 32px;
      margin-top: 2px;
      box-sizing: border-box;
      pointer-events: none; /* just a visual box — clicks pass through except the two thin
                                resize lines below, so it never blocks content near/behind it */
    }
    .qa-resize-right {
      position: absolute;
      top: 6px; bottom: 6px; right: -2px;
      width: 5px;
      cursor: ew-resize;
      pointer-events: auto; /* thin precise strip right on the border line, not a wide zone */
    }
    .qa-resize-bottom {
      position: absolute;
      left: 6px; right: 6px; bottom: -2px;
      height: 5px;
      cursor: ns-resize;
      pointer-events: auto; /* thin precise strip right on the border line, not a wide zone */
    }

    /* Button — same floating/movable/resizable pattern as Question & Answer, one editable shape */
    .btn-block {
      position: absolute;
      min-width: 90px;
      pointer-events: none;
    }
    .btn-block.btn-dragging { z-index: 50; }
    .btn-move-zone {
      position: absolute;
      top: -26px; left: -2px;
      width: 62px; height: 34px;
      z-index: 5;
      pointer-events: auto;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }
    .btn-move-handle, .btn-delete-handle {
      display: none;
      align-items: center;
      justify-content: center;
      width: 26px; height: 26px;
      border-radius: 5px;
      background: #ffffff;
      border: 1.5px solid #666;
      color: #333;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      user-select: none;
      flex-shrink: 0;
    }
    .btn-move-handle svg, .btn-delete-handle svg { width: 15px; height: 15px; stroke: #333; stroke-width: 1.8; fill: none; }
    .btn-move-handle { cursor: move; }
    .btn-delete-handle { cursor: pointer; }
    .btn-delete-handle:hover { border-color: #ff3b30; }
    .btn-delete-handle:hover svg { stroke: #ff3b30; }
    .btn-move-zone:hover .btn-move-handle,
    .btn-move-zone:hover .btn-delete-handle { display: flex; }
    .btn-shape-wrapper { position: relative; }
    .btn-shape {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      border: 1px solid #999;
      border-radius: 6px;
      padding: 8px 16px;
      background: #f0f0f0;
      color: #1a1a1a;
      font-weight: 600;
      text-align: center;
      outline: none;
      box-sizing: border-box;
      pointer-events: auto;
    }
    .btn-resize-right {
      position: absolute;
      top: 6px; bottom: 6px; right: -2px;
      width: 5px;
      cursor: ew-resize;
      pointer-events: auto;
    }
    .btn-resize-bottom {
      position: absolute;
      left: 6px; right: 6px; bottom: -2px;
      height: 5px;
      cursor: ns-resize;
      pointer-events: auto;
    }

    /* Table — same floating-block pattern (move/delete), plus hover-revealed add-row and
       add-column controls at its edges, like Word */
    .table-block {
      position: absolute;
      pointer-events: none;
    }
    .table-block.table-dragging { z-index: 50; }
    .table-move-zone {
      position: absolute;
      top: -26px; left: -2px;
      width: 90px; height: 34px;
      z-index: 5;
      pointer-events: auto;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }
    .table-move-handle, .table-edit-handle, .table-delete-handle {
      display: none;
      align-items: center;
      justify-content: center;
      width: 26px; height: 26px;
      border-radius: 5px;
      background: #ffffff;
      border: 1.5px solid #666;
      color: #333;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      user-select: none;
      flex-shrink: 0;
    }
    .table-move-handle svg, .table-edit-handle svg, .table-delete-handle svg { width: 15px; height: 15px; stroke: #333; stroke-width: 1.8; fill: none; }
    .table-move-handle { cursor: move; }
    .table-edit-handle { cursor: pointer; }
    .table-delete-handle { cursor: pointer; }
    .table-edit-handle:hover { border-color: #14b8a6; }
    .table-edit-handle:hover svg { stroke: #14b8a6; }
    .table-delete-handle:hover { border-color: #ff3b30; }
    .table-delete-handle:hover svg { stroke: #ff3b30; }
    .table-move-zone:hover .table-move-handle,
    .table-move-zone:hover .table-edit-handle,
    .table-move-zone:hover .table-delete-handle { display: flex; }

    .table-wrapper {
      position: relative;
      display: inline-block;
      margin-left: 22px;
      margin-top: 22px;
    }
    .table-block .inserted-table {
      border-collapse: collapse;
      pointer-events: auto;
      background: #fff;
    }
    .table-block .inserted-table td {
      border: 1px solid #999;
      padding: 8px 10px;
      min-width: 50px;
      min-height: 16px;
      outline: none;
    }

    /* Hover the left margin (rows) or top margin (columns) — completely separate strips so
       they never fight over the same pixels — and a "+" snaps to whichever boundary line is
       nearest the cursor, matching Word's actual table-editing behavior. */
    .table-row-margin {
      position: absolute;
      left: -22px; top: 0; bottom: 0;
      width: 22px;
      pointer-events: auto;
      z-index: 5;
    }
    .table-col-margin {
      position: absolute;
      top: -22px; left: 0; right: 0;
      height: 22px;
      pointer-events: auto;
      z-index: 5;
    }
    .table-row-insert-marker, .table-col-insert-marker {
      display: none;
      position: absolute;
      align-items: center;
      justify-content: center;
      width: 18px; height: 18px;
      border-radius: 4px;
      background: #f0f0f0;
      border: 1px solid #999;
      color: #333;
      font-weight: 700;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      pointer-events: auto;
    }
    .table-row-insert-marker:hover, .table-col-insert-marker:hover {
      background: #333;
      color: #fff;
      border-color: #333;
    }
    .inserted-image { max-width: 100%; margin: 12px 0; display: block; }

    /* Row/column resize — thin strips right on each INTERNAL boundary line (not the margins,
       not the insert markers), giving a resize cursor and a visible highlight while dragging. */
    .table-row-resize-handle {
      position: absolute;
      left: 0; right: 0;
      height: 6px;
      cursor: row-resize;
      pointer-events: auto;
      z-index: 7;
    }
    .table-col-resize-handle {
      position: absolute;
      top: 0; bottom: 0;
      width: 6px;
      cursor: col-resize;
      pointer-events: auto;
      z-index: 7;
    }
    .table-row-resize-handle:hover, .table-row-resize-handle.table-resizing,
    .table-col-resize-handle:hover, .table-col-resize-handle.table-resizing {
      background: rgba(51,51,51,0.25);
    }

    /* Image block — same floating move/delete pattern as the other tools, plus a full
       PowerPoint-style selection UI (red dashed outline, 8 resize handles, rotation handle)
       shown only once the image itself is clicked. */
    .image-block {
      position: absolute;
    }
    .image-block.image-dragging { z-index: 50; }
    .image-move-zone {
      position: absolute;
      top: -26px; left: -2px;
      width: 62px; height: 34px;
      z-index: 5;
      pointer-events: auto;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }
    .image-move-handle, .image-delete-handle {
      display: none;
      align-items: center;
      justify-content: center;
      width: 26px; height: 26px;
      border-radius: 5px;
      background: #ffffff;
      border: 1.5px solid #666;
      color: #333;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      user-select: none;
      flex-shrink: 0;
    }
    .image-move-handle svg, .image-delete-handle svg { width: 15px; height: 15px; stroke: #333; stroke-width: 1.8; fill: none; }
    .image-move-handle { cursor: move; }
    .image-delete-handle { cursor: pointer; }
    .image-delete-handle:hover { border-color: #ff3b30; }
    .image-delete-handle:hover svg { stroke: #ff3b30; }
    .image-move-zone:hover .image-move-handle,
    .image-move-zone:hover .image-delete-handle { display: flex; }

    .image-selection-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .inserted-image-el {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: auto;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
    }
    .image-selection-outline {
      display: none;
      position: absolute;
      inset: 0;
      border: 2px dashed #ff2d2d;
      pointer-events: none;
    }
    .image-block.selected .image-selection-outline { display: block; }

    .image-resize-handle {
      display: none;
      position: absolute;
      width: 9px; height: 9px;
      background: #fff;
      border: 1.5px solid #ff2d2d;
      border-radius: 2px;
      pointer-events: auto;
      z-index: 6;
    }
    .image-block.selected .image-resize-handle { display: block; }
    .image-resize-handle.handle-nw { top: -5px; left: -5px; cursor: nwse-resize; }
    .image-resize-handle.handle-n  { top: -5px; left: 50%; margin-left: -4.5px; cursor: ns-resize; }
    .image-resize-handle.handle-ne { top: -5px; right: -5px; cursor: nesw-resize; }
    .image-resize-handle.handle-e  { top: 50%; right: -5px; margin-top: -4.5px; cursor: ew-resize; }
    .image-resize-handle.handle-se { bottom: -5px; right: -5px; cursor: nwse-resize; }
    .image-resize-handle.handle-s  { bottom: -5px; left: 50%; margin-left: -4.5px; cursor: ns-resize; }
    .image-resize-handle.handle-sw { bottom: -5px; left: -5px; cursor: nesw-resize; }
    .image-resize-handle.handle-w  { top: 50%; left: -5px; margin-top: -4.5px; cursor: ew-resize; }

    .image-rotate-line {
      display: none;
      position: absolute;
      top: -12px; left: 50%;
      width: 1px; height: 12px;
      background: #999;
      pointer-events: none;
    }
    .image-block.selected .image-rotate-line { display: block; }
    .image-rotate-handle {
      display: none;
      align-items: center;
      justify-content: center;
      position: absolute;
      top: -34px; left: 50%;
      transform: translateX(-50%);
      width: 22px; height: 22px;
      border-radius: 50%;
      background: #fff;
      border: 1.5px solid #666;
      cursor: grab;
      pointer-events: auto;
      z-index: 6;
    }
    .image-block.selected .image-rotate-handle { display: flex; }
    .image-rotate-handle svg { width: 13px; height: 13px; stroke: #333; stroke-width: 2; fill: none; }

    /* Activity Feed — identical component/styling to the chat screen's */
    .activity-feed-panel { width: 300px; flex-shrink: 0; background: var(--surface-color); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 12px; overflow-y: auto; padding: 16px; height: 100%; }
    .details-panel-section-header { display: flex; align-items: center; justify-content: space-between; }
    .details-panel-title-group { display: flex; align-items: center; gap: 8px; }
    .details-panel-title-group svg { width: 16px; height: 16px; stroke: var(--subtext-color); stroke-width: 2; fill: none; flex-shrink: 0; }
    .details-panel-title { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--subtext-color); }
    .details-panel-live-dot { width: 8px; height: 8px; border-radius: 50%; background: #25D366; animation: livePulse 1.6s ease-in-out infinite; flex-shrink: 0; }
    @keyframes livePulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    .activity-feed-card { background: transparent; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; }
    .activity-feed-title { font-size: 0.85rem; font-weight: 700; color: var(--text-color); margin-bottom: 2px; }
    .activity-feed-desc { font-size: 0.78rem; color: var(--subtext-color); line-height: 1.4; }
    .activity-feed-time { font-size: 0.68rem; color: var(--subtext-color); margin-top: 6px; }

    /* Add Form modal */
    /* Rename/New popups — dark rounded card, underline input, plain Cancel + pill OK */
    .group-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .group-modal-overlay.active { display: flex; }
    .group-modal-box {
      background: var(--surface-color);
      border-radius: 20px;
      padding: 28px 24px 20px 24px;
      width: 320px;
      max-width: 100%;
    }
    .group-modal-title {
      font-size: 1.3rem;
      font-weight: 500;
      color: var(--text-color);
      margin-bottom: 22px;
    }
    .group-modal-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-color);
      font-size: 0.95rem;
      padding: 6px 2px 10px 2px;
      outline: none;
      margin-bottom: 20px;
      box-sizing: border-box;
    }
    .group-modal-input::placeholder { color: var(--subtext-color); }
    .group-modal-input:focus { border-bottom-color: var(--subtext-color); }
    .group-modal-message {
      font-size: 0.85rem;
      color: var(--subtext-color);
      margin-bottom: 22px;
      line-height: 1.4;
    }
    .table-size-inputs-row { display: flex; gap: 20px; margin-bottom: 4px; }
    .table-size-input-label { font-size: 0.72rem; color: var(--subtext-color); margin-bottom: 4px; }
    .table-size-number-input { width: 70px; margin-bottom: 8px; }
    .group-modal-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 20px;
    }
    .group-modal-cancel-btn {
      background: transparent;
      border: none;
      color: var(--text-color);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      padding: 4px;
    }
    .group-modal-ok-btn {
      background: var(--border-color);
      border: none;
      color: var(--text-color);
      font-size: 0.95rem;
      font-weight: 700;
      padding: 10px 26px;
      border-radius: 24px;
      cursor: pointer;
    }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 15, 15, 0.75); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 100; }
    .modal-card { background: var(--surface-color); padding: 28px; border-radius: 12px; text-align: left; max-width: 380px; width: 90%; position: relative; color: var(--text-color); border: 1px solid var(--border-color); }
    .modal-card h3 { text-align: center; margin-bottom: 16px; font-size: 1.1rem; }
    .modal-label { display: block; font-size: 0.82rem; color: var(--subtext-color); margin: 10px 0 4px 0; font-weight: 600; }
    .modal-input { width: 100%; padding: 10px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); border-radius: 6px; font-size: 0.9rem; outline: none; }
    .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
    .modal-btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .btn-save { background: var(--paper-white); color: var(--jet-black); }
    .btn-cancel { background: var(--border-color); color: var(--text-color); }
    .close-btn { position: absolute; top: 14px; right: 14px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--subtext-color); }

    @media (max-width: 1024px) { .activity-feed-panel { display: none; } }
  </style>
</head>
<body>

  <header class="dashboard-header">
    <div style="display:flex; align-items:center; gap:12px;">
      <div class="default-header-title" id="libraryHeaderTitle">
        <h1>
          <svg style="width:24px; height:24px; stroke:currentColor; stroke-width:2; fill:none;" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="12" x2="16" y2="12"></line><line x1="8" y1="16" x2="16" y2="16"></line></svg>

  </header>

  <div class="dashboard-body-split">

    <aside class="left-vertical-tabbar">
      <div class="main-nav-group">
        <a href="../../home" class="tab-btn" title="Home" onclick="return handleNavAttempt(event, '../../home')">
          <svg viewBox="0 0 24 24" style="width: 22px; height: 22px;">
            <path d="M2.768 19.985c0 1.978 1.594 3.584 3.563 3.584h10.615c1.968 0 3.563-1.605 3.563-3.584V10.611c0-1.973-1.596-3.577-3.563-3.577H9.859c-0.463 0-0.899 0.229-1.164 0.62-0.266 0.385-0.323 0.874-0.153 1.311 0.527 1.382 1.85 2.292 3.325 2.292h4.038v7.65H7.857v-6.551c0-0.979-0.401-1.921-1.108-2.598L4.011 7.199c-0.202-0.194-0.502-0.251-0.757-0.136-0.255 0.109-0.418 0.36-0.418 0.641v11.691zM7.897 0.669c0-0.204-0.165-0.365-0.362-0.365H3.163c-0.198 0-0.356 0.161-0.356 0.365v3.995c0 0.199 0.158 0.36 0.356 0.36h4.377c0.197 0 0.362-0.161 0.362-0.36V0.669z" fill="#008080" stroke="none"/>

    <!-- Add Form modal -->
    <div class="group-modal-overlay" id="addFormModal" onclick="closeAddFormModal()">
      <div class="group-modal-box" onclick="event.stopPropagation()">

    <!-- Table size prompt -->
    <div class="group-modal-overlay" id="tableSizeOverlay" onclick="closeTableSizeModal()">
      <div class="group-modal-box" onclick="event.stopPropagation()">

            <div class="table-size-input-label">Columns</div>

        </div>
        <div class="group-modal-actions">
          <button class="group-modal-cancel-btn" onclick="closeTableSizeModal()">Cancel</button>
          <button class="group-modal-ok-btn" onclick="confirmInsertTable()">OK</button>

      </div>
    </div>

    <!-- Edit Table modal: adjust column/row counts and uniform column width / row height -->
    <div class="group-modal-overlay" id="tableEditOverlay" onclick="closeTableEditModal()">
      <div class="group-modal-box" onclick="event.stopPropagation()">
        <div class="group-modal-title">Edit Table</div>
        <div class="table-size-inputs-row">
          <div>
            <div class="table-size-input-label">Columns</div>
            <input type="number" class="group-modal-input table-size-number-input" id="editTableColsInput" min="1" max="15">
          </div>
          <div>
            <div class="table-size-input-label">Rows</div>

          <div>

            <input type="number" class="group-modal-input table-size-number-input" id="editTableColWidthInput" min="20" max="600">
          </div>

            <div class="table-size-input-label">Row Height (px)</div>

    <!-- Unsaved changes prompt — same styling as the chat's remove/delete confirmations -->

      <div class="group-modal-box" onclick="event.stopPropagation()">

        <div class="group-modal-message">Save before leaving?</div>
        <div class="group-modal-actions">
          <button class="group-modal-cancel-btn" onclick="cancelPendingNav()">Cancel</button>
          <button class="group-modal-cancel-btn" onclick="discardAndLeave()">Discard</button>
          <button class="group-modal-ok-btn" onclick="saveAndLeave()">Save</button>

    <!-- Forms library (list of all forms) -->
    <main class="forms-workspace" id="formsLibraryWorkspace">
      <div class="forms-panel-header">
        <h2>Project Forms</h2>
      </div>
      <div class="forms-grid" id="formsGrid"></div>

    <!-- Individual form (shown when a form is opened via ?name=) -->
    <main class="form-sheet-wrapper" id="formSheetWrapper" style="display:none;">
      <div class="a4-page" id="formSheet" contenteditable="true" data-placeholder="Start designing this form..." oninput="handleFormPageInput();"></div>

    <!-- Form-building tool rail — only shown while editing a form, not in the library view -->
    <aside class="form-tools-rail" id="formToolsRail" style="display:none;">
      <button class="form-tool-btn" onmousedown="event.preventDefault();" onclick="handleSaveClick()" title="Save">

      </button>
      <button class="form-tool-btn" id="formUndoBtn" onmousedown="event.preventDefault();" onclick="handleUndoClick()" title="Undo">
        <svg viewBox="0 0 24 24"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-15-6.7L3 13"></path></svg>
      </button>
      <button class="form-tool-btn" id="formRedoBtn" onmousedown="event.preventDefault();" onclick="redoFormChange()" title="Redo">

      <button class="form-tool-btn" onmousedown="event.preventDefault();" onclick="insertButtonBlock()" title="Button">

      </button>

      </button>
      <button class="form-tool-btn" onmousedown="event.preventDefault();" onclick="document.getElementById('formImageInput').click()" title="Insert Picture">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
      </button>

      <button class="form-tool-btn" onmousedown="event.preventDefault();" onclick="cycleTextAlign()" title="Text Align">
        <svg viewBox="0 0 24 24"><line x1="17" y1="10" x2="3" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line><line x1="17" y1="18" x2="3" y2="18"></line></svg>
      </button>
      <button class="form-tool-btn" onmousedown="event.preventDefault(); saveFormSelection();" onclick="document.getElementById('fillColorInput').click()" title="Fill Color">
        <svg viewBox="0 0 24 24"><path d="M19 11l-6-6-9 9 6 6z"></path><path d="M4 14l6 6"></path><line x1="19" y1="11" x2="19" y2="20"></line><line x1="15" y1="20" x2="23" y2="20"></line></svg>

      </button>
      <input type="color" id="fillColorInput" style="display:none" onchange="restoreFormSelection(); applyFillColor(this.value);">
      <input type="color" id="textColorInput" style="display:none" onchange="restoreFormSelection(); applyTextColor(this.value);">

    <aside class="activity-feed-panel">

          <span class="details-panel-title">Activity Feed</span>

  <div class="save-toast" id="saveToast">Saved</div>

  <script>
    // This page is the REAL destination for the "Project forms" nav icon — a standalone
    // library, not an in-page panel embedded in the Projects screen.

    const FORMS_LIBRARY_KEY = 'dibadge_global_forms_library';
    let libraryViewMode = 'grid';

    // Declared early (before init() runs on page load) — showFormSheet() -> resetHistoryWithCurrentState()
    // reads these on the very first load, and `let` bindings aren't usable before their own
    // declaration line executes. Declaring them down near their functions (where they used to
    // be) threw "Cannot access 'formHistory' before initialization" on load, which silently
    // aborted the rest of this script's top-level execution — breaking Undo/Redo AND, as a
    // side effect, every `let` declared further down the file, including the save toast's timer.
    let formHistory = [];
    let formHistoryIndex = -1;
    let isRestoringHistory = false;
    let historyDebounceTimer = null;
    let saveToastTimer = null;

    function getDefaultForms() {
      return [
        'Tower B Foundation Log Sheet',
        'Daily Site Inspection Form',
        'Safety Compliance Checklist',
        'Material Delivery Record',
        'Concrete Pour Approval Form',
        'Equipment Maintenance Log'
      ];
    }

    function getFormsLibrary() {
      const stored = localStorage.getItem(FORMS_LIBRARY_KEY);
      if (!stored) {
        const defaults = getDefaultForms();
        localStorage.setItem(FORMS_LIBRARY_KEY, JSON.stringify(defaults));
        return defaults;
      }
      try {
        const parsed = JSON.parse(stored);
        return Array.isArray(parsed) ? parsed : getDefaultForms();
      } catch (e) {
        return getDefaultForms();
      }
    }

    function saveFormsLibrary(forms) {
      localStorage.setItem(FORMS_LIBRARY_KEY, JSON.stringify(forms));
    }

    function setLibraryViewMode(mode) {
      libraryViewMode = mode;
      document.getElementById('btnViewTile').classList.toggle('active', mode === 'grid');
      document.getElementById('btnViewList').classList.toggle('active', mode === 'list');
      renderFormsLibrary();
    }

    function renderFormsLibrary() {
      const grid = document.getElementById('formsGrid');
      const query = document.getElementById('formSearchInput').value.toLowerCase().trim();
      const forms = getFormsLibrary().filter(name => name.toLowerCase().includes(query));

      if (libraryViewMode === 'list') {
        grid.className = 'forms-list-container';
        grid.innerHTML = forms.map(name => `
          <div class="form-row" title="${name}" onclick="openForm('${name.replace(/'/g, "\\'")}')">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="12" x2="16" y2="12"></line><line x1="8" y1="16" x2="16" y2="16"></line></svg>
            <span class="form-row-name">${name}</span>
          </div>
        `).join('');
      } else {
        grid.className = 'forms-grid';
        grid.innerHTML = forms.map(name => `
          <div class="form-card" title="${name}" onclick="openForm('${name.replace(/'/g, "\\'")}')">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="12" x2="16" y2="12"></line><line x1="8" y1="16" x2="16" y2="16"></line></svg>
            <div class="form-card-name">${name}</div>
          </div>
        `).join('');
      }
    }

    function openAddFormModal() {
      document.getElementById('newFormNameInput').value = '';
      document.getElementById('addFormModal').classList.add('active');
      document.getElementById('newFormNameInput').focus();
    }
    function closeAddFormModal() {
      document.getElementById('addFormModal').classList.remove('active');
    }
    function confirmAddForm() {
      const name = document.getElementById('newFormNameInput').value.trim();
      if (!name) return;
      const forms = getFormsLibrary();
      forms.push(name);
      saveFormsLibrary(forms);
      closeAddFormModal();
      openForm(name); // jump straight into the new form's work screen, ready to design
    }

    // ---- Opening / viewing a specific form ----

    // ===================== Unsaved-changes tracking + persistence =====================
    // In-app navigation (breadcrumb, sidebar, back arrow) is fully under our control and gets
    // the custom confirmation styled like the chat's remove/delete popups. Actually closing or
    // refreshing the browser tab is NOT something a webpage can style — browsers only allow
    // their own plain native "leave site?" dialog for that (a hard security restriction, the
    // same for every site), so that case uses the standard beforeunload prompt instead.

    let hasUnsavedChanges = false;
    let currentFormName = null;
    let pendingNavUrl = null; // a real URL, or '__library__' for the in-page library view
    const FORM_CONTENT_KEY_PREFIX = 'dibadge_form_content_';

    function saveCurrentFormContent() {
      if (!currentFormName) return;
      const page = document.getElementById('formSheet');
      localStorage.setItem(FORM_CONTENT_KEY_PREFIX + currentFormName, page.innerHTML);
    }

    function loadFormContent(name) {
      return localStorage.getItem(FORM_CONTENT_KEY_PREFIX + name);
    }

    // Every in-app link/button that leaves the current form routes through this first.
    function handleNavAttempt(event, url) {
      if (!hasUnsavedChanges) return true; // nothing to protect — let it navigate normally
      if (event) event.preventDefault();
      pendingNavUrl = url;
      document.getElementById('unsavedChangesOverlay').classList.add('active');
      return false;
    }

    function cancelPendingNav() {
      pendingNavUrl = null;
      document.getElementById('unsavedChangesOverlay').classList.remove('active');
    }

    function discardAndLeave() {
      hasUnsavedChanges = false;
      document.getElementById('unsavedChangesOverlay').classList.remove('active');
      proceedPendingNav();
    }

    function saveAndLeave() {
      saveCurrentFormContent();
      hasUnsavedChanges = false;
      document.getElementById('unsavedChangesOverlay').classList.remove('active');
      proceedPendingNav();
    }

    function proceedPendingNav() {
      const url = pendingNavUrl;
      pendingNavUrl = null;
      if (url === '__library__') {
        window.history.pushState({}, '', window.location.pathname);
        showLibrary();
      } else if (url) {
        window.location.href = url;
      }
    }

    // Native browser dialog only — cannot be replaced with the app's own styled popup.
    window.addEventListener('beforeunload', function(e) {
      if (!hasUnsavedChanges) return;
      e.preventDefault();
      e.returnValue = '';
    });

    function openForm(name) {
      window.history.pushState({}, '', `?name=${encodeURIComponent(name)}`);
      showFormSheet(name);
    }

    function backToLibrary() {
      handleNavAttempt(null, '__library__');
      if (!hasUnsavedChanges) {
        window.history.pushState({}, '', window.location.pathname);
        showLibrary();
      }
    }

    function showLibrary() {
      document.getElementById('formsLibraryWorkspace').style.display = 'block';
      document.getElementById('formSheetWrapper').style.display = 'none';
      document.getElementById('formToolsRail').style.display = 'none';
      document.getElementById('libraryHeaderTitle').style.display = 'flex';
      document.getElementById('libraryHeaderCenter').style.display = 'flex';
      document.getElementById('formHeaderNav').style.display = 'none';
      renderFormsLibrary();
    }

    function showFormSheet(name) {
      document.getElementById('formsLibraryWorkspace').style.display = 'none';
      document.getElementById('formSheetWrapper').style.display = 'flex';
      document.getElementById('libraryHeaderTitle').style.display = 'none';
      document.getElementById('libraryHeaderCenter').style.display = 'none';
      document.getElementById('formHeaderNav').style.display = 'flex';

      document.getElementById('breadcrumbBar').innerHTML = `
        <span class="breadcrumb-item" onclick="backToLibrary()">Project Forms</span>
        <span>&gt;</span>
        <span class="breadcrumb-item active">${name}</span>
      `;

      // Blank A4 page, same idea as opening a new Word document — loads any previously saved
      // content for this form, or starts empty if there is none yet.
      currentFormName = name;
      hasUnsavedChanges = false;
      const page = document.getElementById('formSheet');
      const saved = loadFormContent(name);
      page.innerHTML = saved || '';
      // Re-attach drag/resize behavior to any Question & Answer blocks restored from storage —
      // innerHTML assignment brings back the markup but not the JS listeners that were on it.
      page.querySelectorAll('.qa-block').forEach(block => wireQaBlockInteractions(block));
      page.querySelectorAll('.btn-block').forEach(block => wireButtonBlockInteractions(block));
      page.querySelectorAll('.table-block').forEach(block => wireTableBlockInteractions(block));
      page.querySelectorAll('.image-block').forEach(block => wireImageBlockInteractions(block));
      ensureFlowAnchor();
      document.getElementById('formToolsRail').style.display = 'flex';
      resetHistoryWithCurrentState();

      // Empty page (new form, or nothing saved yet) — put the cursor at the very start so
      // typing or using a tool immediately begins there, with no click needed first.
      if (!page.textContent.trim() && page.querySelectorAll('.qa-block, .btn-block, .table-block, .image-block, img').length === 0) {
        placeCursorAtPageStart();
      }
    }

    (function init() {
      const urlParams = new URLSearchParams(window.location.search);
      const formName = urlParams.get('name');
      if (formName) {
        showFormSheet(formName);
      } else {
        showLibrary();
      }
    })();

    window.addEventListener('popstate', function() {
      const urlParams = new URLSearchParams(window.location.search);
      const formName = urlParams.get('name');
      if (formName) showFormSheet(formName);
      else showLibrary();
    });

    // ===================== Form-building tool rail =====================
    // Every tool operates on the current cursor position / selection inside the A4 page.
    // Buttons use onmousedown+preventDefault so clicking them never steals focus away from
    // the page — that's what keeps the selection valid for insertion or execCommand calls.
    // The two exceptions (color pickers, image file picker) hand off to native browser UI,
    // which DOES steal focus — so those save the selection first and restore it once the
    // native picker returns a value, before applying it.

    let savedFormRange = null;

    function saveFormSelection() {
      const sel = window.getSelection();
      const page = document.getElementById('formSheet');
      if (sel.rangeCount > 0 && page.contains(sel.anchorNode)) {
        savedFormRange = sel.getRangeAt(0).cloneRange();
      }
    }

    function restoreFormSelection() {
      if (!savedFormRange) return;
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(savedFormRange);
    }

    // Guarantees a real cursor lands wherever you click on the page — including blank space
    // near/around a floating Question & Answer block — so the next tool or typed text starts
    // exactly there. Only acts as a fallback: if the browser already placed a valid cursor (or
    // you dragged to select a range of text), this leaves it alone rather than overriding it.
    (function setupClickToPlaceCursor() {
      const page = document.getElementById('formSheet');
      page.addEventListener('mouseup', function(e) {
        const sel = window.getSelection();
        if (sel.rangeCount > 0 && page.contains(sel.anchorNode)) return; // browser already placed a valid, typable cursor — never override this

        let range = null;
        if (document.caretRangeFromPoint) {
          range = document.caretRangeFromPoint(e.clientX, e.clientY);
        } else if (document.caretPositionFromPoint) {
          const pos = document.caretPositionFromPoint(e.clientX, e.clientY);
          if (pos && pos.offsetNode) {
            range = document.createRange();
            range.setStart(pos.offsetNode, pos.offset);
            range.collapse(true);
          }
        }

        if (range && page.contains(range.startContainer)) {
          page.focus();
          sel.removeAllRanges();
          sel.addRange(range);
        } else {
          placeCursorAtPageStart();
        }
      });
    })();

    // ===================== Undo / Redo history =====================
    // Snapshot-based: keeps full page.innerHTML states, since content here is a mix of typed
    // text and custom floating blocks (Question & Answer, Button) that don't fit a simple
    // text-only undo model.

    function rewireAllBlocks() {
      const page = document.getElementById('formSheet');
      page.querySelectorAll('.qa-block').forEach(block => wireQaBlockInteractions(block));
      page.querySelectorAll('.btn-block').forEach(block => wireButtonBlockInteractions(block));
      page.querySelectorAll('.table-block').forEach(block => wireTableBlockInteractions(block));
      page.querySelectorAll('.image-block').forEach(block => wireImageBlockInteractions(block));
    }

    function pushHistorySnapshot() {
      if (isRestoringHistory) return;
      const page = document.getElementById('formSheet');
      const snapshot = page.innerHTML;
      if (formHistory.length > 0 && formHistory[formHistoryIndex] === snapshot) return; // no real change
      formHistory = formHistory.slice(0, formHistoryIndex + 1); // drop any redo branch
      formHistory.push(snapshot);
      formHistoryIndex = formHistory.length - 1;
      if (formHistory.length > 50) {
        formHistory.shift();
        formHistoryIndex--;
      }
      updateUndoRedoButtons();
    }

    function resetHistoryWithCurrentState() {
      const page = document.getElementById('formSheet');
      formHistory = [page.innerHTML];
      formHistoryIndex = 0;
      updateUndoRedoButtons();
    }

    function updateUndoRedoButtons() {
      const undoBtn = document.getElementById('formUndoBtn');
      const redoBtn = document.getElementById('formRedoBtn');
      // Visual-only "looks inactive" state — deliberately NOT the real disabled property,
      // which blocks the browser from firing onclick at all. A quick click right after typing
      // (before the debounced snapshot lands) needs the click to still go through so its own
      // flush-then-check logic can run; undoFormChange()/redoFormChange() already correctly
      // no-op internally when there's genuinely nothing to undo/redo.
      if (undoBtn) undoBtn.classList.toggle('form-tool-btn-inactive', formHistoryIndex <= 0);
      if (redoBtn) redoBtn.classList.toggle('form-tool-btn-inactive', formHistoryIndex >= formHistory.length - 1);
    }

    function undoFormChange() {
      if (formHistoryIndex <= 0) return;
      formHistoryIndex--;
      isRestoringHistory = true;
      document.getElementById('formSheet').innerHTML = formHistory[formHistoryIndex];
      rewireAllBlocks();
      isRestoringHistory = false;
      hasUnsavedChanges = true;
      updateUndoRedoButtons();
    }

    function redoFormChange() {
      if (formHistoryIndex >= formHistory.length - 1) return;
      formHistoryIndex++;
      isRestoringHistory = true;
      document.getElementById('formSheet').innerHTML = formHistory[formHistoryIndex];
      rewireAllBlocks();
      isRestoringHistory = false;
      hasUnsavedChanges = true;
      updateUndoRedoButtons();
    }

    // Called by the page's oninput — typing is continuous, so history snapshots are debounced
    // to one per pause in typing, rather than one per keystroke.
    function handleFormPageInput() {
      hasUnsavedChanges = true;
      clearTimeout(historyDebounceTimer);
      historyDebounceTimer = setTimeout(pushHistorySnapshot, 500);
    }

    // Standard Ctrl+Z / Ctrl+Y (or Ctrl+Shift+Z) shortcuts, same as the toolbar buttons
    document.getElementById('formSheet').addEventListener('keydown', function(e) {
      const ctrlOrCmd = e.ctrlKey || e.metaKey;
      if (!ctrlOrCmd) return;
      if (e.key === 'z' && !e.shiftKey) {
        e.preventDefault();
        clearTimeout(historyDebounceTimer);
        pushHistorySnapshot(); // capture whatever was just typed before jumping back
        undoFormChange();
      } else if (e.key === 'y' || (e.key === 'z' && e.shiftKey)) {
        e.preventDefault();
        redoFormChange();
      }
    });

    // ===================== Alignment guides (smart guides, PowerPoint-style) =====================
    // While dragging a floating block (Q&A, Button, Table), compares its edges/centers against
    // every OTHER block's edges/centers, and against the page's own edges/center. When one is
    // within a small threshold, the drag snaps to it exactly and a thin magenta guide line is
    // drawn showing what it aligned to.

    const ALIGNMENT_SNAP_THRESHOLD = 6;

    function getAlignmentOverlay(page) {
      let overlay = document.getElementById('alignmentGuidesOverlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'alignmentGuidesOverlay';
        overlay.style.position = 'absolute';
        overlay.style.inset = '0';
        overlay.style.pointerEvents = 'none';
        overlay.style.zIndex = '100';
        page.appendChild(overlay);
      }
      return overlay;
    }

    // A table-block's actual visible table sits offset from the block's own left/top by
    // .table-wrapper's margin (reserved for the row/col insert-margin strips) — so alignment
    // must measure against where the content visually starts, not the invisible block boundary,
    // or a table would look misaligned even while snapped "correctly" by raw coordinates.
    function getVisualOffset(block) {
      if (!block.classList.contains('table-block')) return { dx: 0, dy: 0 };
      const wrapper = block.querySelector('.table-wrapper');
      if (!wrapper) return { dx: 0, dy: 0 };
      const cs = getComputedStyle(wrapper);
      return { dx: parseFloat(cs.marginLeft) || 0, dy: parseFloat(cs.marginTop) || 0 };
    }

    function getVisualBox(block, rawLeft, rawTop) {
      const offset = getVisualOffset(block);
      const inner = block.classList.contains('table-block') ? block.querySelector('.inserted-table') : null;
      const w = inner ? inner.offsetWidth : block.offsetWidth;
      const h = inner ? inner.offsetHeight : block.offsetHeight;
      return { left: rawLeft + offset.dx, top: rawTop + offset.dy, width: w, height: h };
    }

    function collectAlignmentEdges(page, excludeBlock) {
      const blocks = Array.from(page.querySelectorAll('.qa-block, .btn-block, .table-block, .image-block')).filter(function(b) { return b !== excludeBlock; });
      const xs = [], ys = [];
      blocks.forEach(function(b) {
        const rawLeft = parseFloat(b.style.left) || 0;
        const rawTop = parseFloat(b.style.top) || 0;
        const box = getVisualBox(b, rawLeft, rawTop);
        xs.push(box.left, box.left + box.width / 2, box.left + box.width);
        ys.push(box.top, box.top + box.height / 2, box.top + box.height);
      });
      // Page's own edges and center count as alignment targets too
      xs.push(0, page.clientWidth / 2, page.clientWidth);
      ys.push(0, page.clientHeight / 2, page.clientHeight);
      return { xs: xs, ys: ys };
    }

    function applyAlignmentSnap(page, block, candidateLeft, candidateTop) {
      const offset = getVisualOffset(block);
      const box = getVisualBox(block, candidateLeft, candidateTop);
      const w = box.width, h = box.height;
      const edges = collectAlignmentEdges(page, block);

      const candidateXs = { left: box.left, centerX: box.left + w / 2, right: box.left + w };
      const candidateYs = { top: box.top, centerY: box.top + h / 2, bottom: box.top + h };

      let bestXDist = ALIGNMENT_SNAP_THRESHOLD + 1, guideX = null, snappedVisualLeft = box.left;
      Object.keys(candidateXs).forEach(function(key) {
        const val = candidateXs[key];
        edges.xs.forEach(function(edgeX) {
          const dist = Math.abs(val - edgeX);
          if (dist < bestXDist) {
            bestXDist = dist;
            guideX = edgeX;
            if (key === 'left') snappedVisualLeft = edgeX;
            else if (key === 'centerX') snappedVisualLeft = edgeX - w / 2;
            else snappedVisualLeft = edgeX - w;
          }
        });
      });

      let bestYDist = ALIGNMENT_SNAP_THRESHOLD + 1, guideY = null, snappedVisualTop = box.top;
      Object.keys(candidateYs).forEach(function(key) {
        const val = candidateYs[key];
        edges.ys.forEach(function(edgeY) {
          const dist = Math.abs(val - edgeY);
          if (dist < bestYDist) {
            bestYDist = dist;
            guideY = edgeY;
            if (key === 'top') snappedVisualTop = edgeY;
            else if (key === 'centerY') snappedVisualTop = edgeY - h / 2;
            else snappedVisualTop = edgeY - h;
          }
        });
      });

      renderAlignmentGuides(page, guideX, guideY);

      // Convert the snapped VISUAL position back to the block's own raw left/top before
      // returning — the caller sets block.style.left/top directly with this value.
      const snappedLeft = snappedVisualLeft - offset.dx;
      const snappedTop = snappedVisualTop - offset.dy;
      return {
        left: guideX !== null ? snappedLeft : candidateLeft,
        top: guideY !== null ? snappedTop : candidateTop
      };
    }

    function renderAlignmentGuides(page, guideX, guideY) {
      const overlay = getAlignmentOverlay(page);
      overlay.innerHTML = '';
      if (guideX !== null) {
        const line = document.createElement('div');
        line.style.position = 'absolute';
        line.style.left = guideX + 'px';
        line.style.top = '0';
        line.style.bottom = '0';
        line.style.width = '1px';
        line.style.background = '#ff2fd6';
        overlay.appendChild(line);
      }
      if (guideY !== null) {
        const line = document.createElement('div');
        line.style.position = 'absolute';
        line.style.top = guideY + 'px';
        line.style.left = '0';
        line.style.right = '0';
        line.style.height = '1px';
        line.style.background = '#ff2fd6';
        overlay.appendChild(line);
      }
    }

    function clearAlignmentGuides(page) {
      const overlay = document.getElementById('alignmentGuidesOverlay');
      if (overlay) overlay.innerHTML = '';
    }

    // A floating block (Question & Answer, Button, Table) is position:absolute — it's removed
    // from the page's normal flow entirely. If it's the ONLY thing on the page, there is no
    // real flowing text position left anywhere for a cursor to rest in and accept typed
    // characters, even in the "blank" space around it. This guarantees a genuine empty line
    // always exists in the page's actual flow, so typing outside a floating block always works.
    function ensureFlowAnchor() {
      const page = document.getElementById('formSheet');
      const hasFlowContent = Array.from(page.childNodes).some(function(n) {
        if (n.nodeType === Node.TEXT_NODE) return true;
        if (n.nodeType === Node.ELEMENT_NODE) return !n.classList.contains('qa-block') && !n.classList.contains('btn-block') && !n.classList.contains('table-block') && !n.classList.contains('image-block');
        return false;
      });
      if (!hasFlowContent) {
        // Fill the page with enough blank lines to span its height, so clicking at different
        // VERTICAL positions lands on a nearby line, instead of the single point that exists
        // when there's only one blank line. Horizontal position on a blank line still always
        // resolves to its start — that's inherent to how text cursors work (a blank line has
        // no characters to position "between"), true in every text editor, not fixable here.
        const approxLineHeightPx = 25.6; // ~1rem font-size * 1.6 line-height
        const usableHeightPx = 1123 - 144; // A4 page height minus its top+bottom padding
        const lineCount = Math.max(1, Math.ceil(usableHeightPx / approxLineHeightPx));
        for (let i = 0; i < lineCount; i++) {
          page.appendChild(document.createElement('br'));
        }
      }
    }

    function placeCursorAtPageStart() {
      const page = document.getElementById('formSheet');
      page.focus();
      const range = document.createRange();
      range.selectNodeContents(page);
      range.collapse(true); // true = collapse to the START, not the end
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

    function placeCursorAtPageEnd() {
      const page = document.getElementById('formSheet');
      page.focus();
      const range = document.createRange();
      range.selectNodeContents(page);
      range.collapse(false); // false = collapse to the END
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

    function insertHtmlAtCursor(html) {
      const page = document.getElementById('formSheet');
      page.focus();
      const sel = window.getSelection();
      if (sel.rangeCount === 0 || !page.contains(sel.anchorNode)) {
        page.insertAdjacentHTML('beforeend', html);
      } else {
        const range = sel.getRangeAt(0);
        range.deleteContents();
        const frag = range.createContextualFragment(html);
        const lastNode = frag.lastChild;
        range.insertNode(frag);
        if (lastNode) {
          range.setStartAfter(lastNode);
          range.collapse(true);
          sel.removeAllRanges();
          sel.addRange(range);
        }
      }
      hasUnsavedChanges = true;
      pushHistorySnapshot();
    }

    // Question & Answer — inserted as a floating block (not flowing text), so it can be freely
    // moved and resized like a text box, independent of the surrounding document.
    let qaBlockCascadeOffset = 0;

    function insertQuestionBlock() {
      const page = document.getElementById('formSheet');

      const block = document.createElement('div');
      block.className = 'qa-block';
      block.contentEditable = 'false'; // an atomic block — its own <input> stays interactive,
                                        // but the page's contenteditable doesn't intercept clicks/drags on it
      block.style.left = (20 + qaBlockCascadeOffset) + 'px';
      block.style.top = (20 + qaBlockCascadeOffset) + 'px';
      block.style.width = '380px';
      qaBlockCascadeOffset = (qaBlockCascadeOffset + 24) % 120; // so repeated inserts don't stack exactly on top of each other

      block.innerHTML = `
        <div class="qa-move-zone">
          <div class="qa-move-handle" title="Move"><svg viewBox="0 0 24 24"><polyline points="5 9 2 12 5 15"></polyline><polyline points="9 5 12 2 15 5"></polyline><polyline points="15 19 12 22 9 19"></polyline><polyline points="19 9 22 12 19 15"></polyline><line x1="2" y1="12" x2="22" y2="12"></line><line x1="12" y1="2" x2="12" y2="22"></line></svg></div>
          <div class="qa-delete-handle" title="Delete"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg></div>
        </div>
        <input type="text" class="qa-question-input" placeholder="Question">
        <div class="qa-answer-box">
          <div class="qa-resize-right"></div>
          <div class="qa-resize-bottom"></div>
        </div>
      `;
      page.appendChild(block);
      wireQaBlockInteractions(block);
      ensureFlowAnchor();
      hasUnsavedChanges = true;
      pushHistorySnapshot();
    }

    function wireQaBlockInteractions(block) {
      const page = document.getElementById('formSheet');
      const moveHandle = block.querySelector('.qa-move-handle');
      const deleteHandle = block.querySelector('.qa-delete-handle');
      const rightHandle = block.querySelector('.qa-resize-right');
      const bottomHandle = block.querySelector('.qa-resize-bottom');
      const answerBox = block.querySelector('.qa-answer-box');

      // Delete — removes this whole Question & Answer block from the page
      deleteHandle.addEventListener('pointerdown', function(e) {
        e.preventDefault();
        e.stopPropagation();
      });
      deleteHandle.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        block.remove();
        hasUnsavedChanges = true;
        pushHistorySnapshot();
      });

      // Move — drag the "+" handle to reposition the whole block anywhere within the page
      moveHandle.addEventListener('pointerdown', function(e) {
        e.preventDefault();
        e.stopPropagation();
        block.classList.add('qa-dragging');
        const startX = e.clientX, startY = e.clientY;
        const startLeft = parseFloat(block.style.left) || 0;
        const startTop = parseFloat(block.style.top) || 0;
        const blockW = block.offsetWidth, blockH = block.offsetHeight;

        function onMove(ev) {
          const dx = ev.clientX - startX, dy = ev.clientY - startY;
          const maxLeft = Math.max(0, page.clientWidth - blockW);
          const maxTop = Math.max(0, page.clientHeight - blockH);
          let newLeft = Math.min(maxLeft, Math.max(0, startLeft + dx));
          let newTop = Math.min(maxTop, Math.max(0, startTop + dy));
          const snapped = applyAlignmentSnap(page, block, newLeft, newTop);
          block.style.left = snapped.left + 'px';
          block.style.top = snapped.top + 'px';
          hasUnsavedChanges = true;
        }
        function onUp() {
          block.classList.remove('qa-dragging');
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
          clearAlignmentGuides(page);
          pushHistorySnapshot();
        }
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
      });

      // Resize width — right edge only (left edge stays fixed)
      rightHandle.addEventListener('pointerdown', function(e) {
        e.preventDefault();
        e.stopPropagation();
        const startX = e.clientX;
        const startWidth = block.offsetWidth;
        function onMove(ev) {
          const dx = ev.clientX - startX;
          block.style.width = Math.max(140, startWidth + dx) + 'px';
          hasUnsavedChanges = true;
        }
        function onUp() {
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
          pushHistorySnapshot();
        }
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
      });

      // Resize the answer box's height — bottom edge only (top edge stays fixed)
      bottomHandle.addEventListener('pointerdown', function(e) {
        e.preventDefault();
        e.stopPropagation();
        const startY = e.clientY;
        const startHeight = answerBox.offsetHeight;
        function onMove(ev) {
          const dy = ev.clientY - startY;
          answerBox.style.minHeight = Math.max(28, startHeight + dy) + 'px';
          hasUnsavedChanges = true;
        }
        function onUp() {
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
          pushHistorySnapshot();
        }
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
      });
    }

    // Button — same floating-block idea as Question & Answer, one editable shape with its own
    // move handle and edge-only resize handles.
    function insertButtonBlock() {
      const page = document.getElementById('formSheet');

      const block = document.createElement('div');
      block.className = 'btn-block';
      block.contentEditable = 'false';
      block.style.left = (20 + qaBlockCascadeOffset) + 'px';
      block.style.top = (20 + qaBlockCascadeOffset) + 'px';
      block.style.width = '140px';
      qaBlockCascadeOffset = (qaBlockCascadeOffset + 24) % 120;

      block.innerHTML = `
        <div class="btn-move-zone">

    // A single "+" per axis that snaps to whichever boundary line the cursor is nearest —
    // hovering the left margin reveals it for rows, the top margin for columns. This avoids the
    // overlap problem of many separate always-present zone strips competing for the same pixels.
    function setupTableInsertMarkers(block) {
      const table = block.querySelector('.inserted-table');
      const rowMargin = block.querySelector('.table-row-margin');
      const colMargin = block.querySelector('.table-col-margin');
      const rowMarker = block.querySelector('.table-row-insert-marker');
      const colMarker = block.querySelector('.table-col-insert-marker');
      if (!table || !rowMargin || !colMargin) return;

      rowMargin.addEventListener('mousemove', function(e) {
        const rows = Array.from(table.rows);
        if (rows.length === 0) return;
        const marginRect = rowMargin.getBoundingClientRect();
        const mouseY = e.clientY - marginRect.top;
        const boundaries = [rows[0].offsetTop];
        rows.forEach(function(r) { boundaries.push(r.offsetTop + r.offsetHeight); });
        let nearestIdx = 0, nearestDist = Infinity;
        boundaries.forEach(function(y, idx) {
          const d = Math.abs(y - mouseY);
          if (d < nearestDist) { nearestDist = d; nearestIdx = idx; }
        });
        rowMarker.style.display = 'flex';
        rowMarker.style.top = (boundaries[nearestIdx] - 9) + 'px';
        rowMarker.dataset.insertIndex = nearestIdx;
      });
      rowMargin.addEventListener('mouseleave', function() { rowMarker.style.display = 'none'; });

      colMargin.addEventListener('mousemove', function(e) {
        const rows = Array.from(table.rows);
        if (rows.length === 0) return;
        const cells = Array.from(rows[0].cells);
        if (cells.length === 0) return;
        const marginRect = colMargin.getBoundingClientRect();
        const mouseX = e.clientX - marginRect.left;
        const boundaries = [cells[0].offsetLeft];
        cells.forEach(function(c) { boundaries.push(c.offsetLeft + c.offsetWidth); });
        let nearestIdx = 0, nearestDist = Infinity;
        boundaries.forEach(function(x, idx) {
          const d = Math.abs(x - mouseX);
          if (d < nearestDist) { nearestDist = d; nearestIdx = idx; }
        });
        colMarker.style.display = 'flex';
        colMarker.style.left = (boundaries[nearestIdx] - 9) + 'px';
        colMarker.dataset.insertIndex = nearestIdx;
      });
      colMargin.addEventListener('mouseleave', function() { colMarker.style.display = 'none'; });

      rowMarker.addEventListener('pointerdown', function(e) { e.preventDefault(); e.stopPropagation(); });
      rowMarker.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        insertTableRowAt(table, parseInt(rowMarker.dataset.insertIndex, 10) || 0);
        setupTableResizeHandles(block);
        hasUnsavedChanges = true;
        pushHistorySnapshot();
      });

      colMarker.addEventListener('pointerdown', function(e) { e.preventDefault(); e.stopPropagation(); });
      colMarker.addEventListener('click', function(e) {

        e.stopPropagation();
        insertTableColAt(table, parseInt(colMarker.dataset.insertIndex, 10) || 0);
        setupTableResizeHandles(block);
        hasUnsavedChanges = true;
        pushHistorySnapshot();
      });
    }

    // Resize handles sit right on each INTERNAL row/column boundary line — dragging one resizes
    // that specific row's height or column's width. Rebuilt after every structural change since
    // boundary positions shift.
    function setupTableResizeHandles(block) {
      const table = block.querySelector('.inserted-table');
      const wrapper = block.querySelector('.table-wrapper');
      if (!table || !wrapper) return;
      wrapper.querySelectorAll('.table-row-resize-handle, .table-col-resize-handle').forEach(function(el) { el.remove(); });

      const rows = Array.from(table.rows);
      for (let i = 0; i < rows.length - 1; i++) {
        const boundaryY = rows[i].offsetTop + rows[i].offsetHeight;
        const handle = document.createElement('div');
        handle.className = 'table-row-resize-handle';
        handle.style.top = (boundaryY - 3) + 'px';
        wrapper.appendChild(handle);
        wireRowResizeHandle(block, handle, rows[i]);
      }

      if (rows.length > 0) {
        const cells = Array.from(rows[0].cells);
        for (let i = 0; i < cells.length - 1; i++) {
          const boundaryX = cells[i].offsetLeft + cells[i].offsetWidth;
          const handle = document.createElement('div');
          handle.className = 'table-col-resize-handle';
          handle.style.left = (boundaryX - 3) + 'px';
          wrapper.appendChild(handle);
          wireColResizeHandle(block, handle, table, i);
        }
      }
    }

    function wireRowResizeHandle(block, handle, row) {
      handle.addEventListener('pointerdown', function(e) {
        e.preventDefault();
        e.stopPropagation();
        handle.classList.add('table-resizing');
        const startY = e.clientY;
        const startHeight = row.offsetHeight;
        function onMove(ev) {
          const newHeight = Math.max(20, startHeight + (ev.clientY - startY));
          row.style.height = newHeight + 'px';
          Array.from(row.cells).forEach(function(td) { td.style.height = newHeight + 'px'; });
          hasUnsavedChanges = true;
        }
        function onUp() {
          handle.classList.remove('table-resizing');
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
          setupTableResizeHandles(block); // reposition remaining handles to match the new height
          pushHistorySnapshot();
        }
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
      });
    }

    function wireColResizeHandle(block, handle, table, colIndex) {
      handle.addEventListener('pointerdown', function(e) {
        e.preventDefault();
        e.stopPropagation();
        handle.classList.add('table-resizing');
        const startX = e.clientX;
        const cellsInCol = Array.from(table.rows).map(function(r) { return r.cells[colIndex]; }).filter(Boolean);
        const startWidth = cellsInCol.length > 0 ? cellsInCol[0].offsetWidth : 50;

          const newWidth = Math.max(30, startWidth + (ev.clientX - startX));
          cellsInCol.forEach(function(td) { td.style.width = newWidth + 'px'; });

          handle.classList.remove('table-resizing');

          pushHistorySnapshot();

        document.addEventListener('pointerup', onUp);

    // ---------- Edit Table modal: column/row counts and uniform width/height ----------

    let tableEditTargetBlock = null;

    function openTableEditModal(block) {
      tableEditTargetBlock = block;
      const table = block.querySelector('.inserted-table');
      const rowCount = table.rows.length;
      const colCount = rowCount > 0 ? table.rows[0].cells.length : 1;
      const firstCell = rowCount > 0 ? table.rows[0].cells[0] : null;
      document.getElementById('editTableColsInput').value = colCount;
      document.getElementById('editTableRowsInput').value = rowCount;
      document.getElementById('editTableColWidthInput').value = firstCell ? Math.round(firstCell.offsetWidth) : 60;

    }

    function closeTableEditModal() {
      document.getElementById('tableEditOverlay').classList.remove('active');

    }

    function confirmTableEdit() {
      if (!tableEditTargetBlock) return;
      const block = tableEditTargetBlock;
      const table = block.querySelector('.inserted-table');
      const targetCols = Math.max(1, Math.min(15, parseInt(document.getElementById('editTableColsInput').value, 10) || 1));
      const targetRows = Math.max(1, Math.min(30, parseInt(document.getElementById('editTableRowsInput').value, 10) || 1));
      const colWidth = Math.max(20, parseInt(document.getElementById('editTableColWidthInput').value, 10) || 60);
      const rowHeight = Math.max(16, parseInt(document.getElementById('editTableRowHeightInput').value, 10) || 32);

      while (table.rows.length < targetRows) insertTableRowAt(table, table.rows.length);
      while (table.rows.length > targetRows) table.rows[table.rows.length - 1].remove();

      const currentCols = table.rows.length > 0 ? table.rows[0].cells.length : 0;
      if (currentCols < targetCols) {
        for (let i = currentCols; i < targetCols; i++) insertTableColAt(table, table.rows[0] ? table.rows[0].cells.length : 0);
      } else if (currentCols > targetCols) {
        Array.from(table.rows).forEach(function(row) {
          while (row.cells.length > targetCols) row.cells[row.cells.length - 1].remove();
        });
      }

      Array.from(table.rows).forEach(function(row) {
        row.style.height = rowHeight + 'px';
        Array.from(row.cells).forEach(function(td) {
          td.style.width = colWidth + 'px';
          td.style.height = rowHeight + 'px';
        });
      });

      closeTableEditModal();
      setupTableResizeHandles(block);
      hasUnsavedChanges = true;
      pushHistorySnapshot();
    }

    function insertTableRowAt(table, index) {
      const colCount = table.rows.length > 0 ? table.rows[0].cells.length : 1;
      const tr = document.createElement('tr');
      for (let c = 0; c < colCount; c++) {
        const td = document.createElement('td');
        td.contentEditable = 'true';
        td.innerHTML = '&nbsp;';
        tr.appendChild(td);
      }
      // A row's real parent isn't always <table> directly — browsers auto-wrap bare <tr>
      // elements (from innerHTML) in an implicit <tbody>, so insertBefore/append must target
      // that actual parent, not assume it's the table itself.
      if (index >= table.rows.length) {
        if (table.rows.length > 0) table.rows[table.rows.length - 1].parentNode.appendChild(tr);
        else table.appendChild(tr);
      } else {
        const refRow = table.rows[index];
        refRow.parentNode.insertBefore(tr, refRow);
      }
    }

    function insertTableColAt(table, index) {
      Array.from(table.rows).forEach(function(row) {
        const td = document.createElement('td');
        td.contentEditable = 'true';
        td.innerHTML = '&nbsp;';
        if (index >= row.cells.length) row.appendChild(td);
        else row.insertBefore(td, row.cells[index]);
      });
    }

    // ---------- Image: floating block with full PowerPoint-style selection UI ----------

    let selectedImageBlock = null;

    document.addEventListener('mousedown', function(e) {
      if (!e.target.closest('.image-block')) deselectAllImageBlocks();
    });

    function computeFitSize(naturalW, naturalH, maxW, maxH) {
      let w = naturalW, h = naturalH;
      if (w > maxW) { h = h * (maxW / w); w = maxW; }
      if (h > maxH) { w = w * (maxH / h); h = maxH; }
      return { width: Math.max(20, Math.round(w)), height: Math.max(20, Math.round(h)) };
    }

      const reader = new FileReader();

        img.onload = function() {
          const page = document.getElementById('formSheet');
          // Never overflow the page — shrink to fit within it (preserving aspect ratio) if
          // the source image is larger than the available space.
          const fit = computeFitSize(img.naturalWidth, img.naturalHeight, page.clientWidth, page.clientHeight);
          createImageBlock(e.target.result, fit.width, fit.height);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
      input.value = '';
    }

          <div class="image-delete-handle" title="Delete"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg></div>

    function wireImageBlockInteractions(block) {
      const page = document.getElementById('formSheet');
      const moveHandle = block.querySelector('.image-move-handle');
      const deleteHandle = block.querySelector('.image-delete-handle');
      const img = block.querySelector('.inserted-image-el');
      const rotateHandle = block.querySelector('.image-rotate-handle');
      const resizeHandles = block.querySelectorAll('.image-resize-handle');

      // Click the image itself -> select it (shows the red dashed outline + handles)
      img.addEventListener('pointerdown', function(e) { e.stopPropagation(); });
      img.addEventListener('click', function(e) {

      deleteHandle.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
