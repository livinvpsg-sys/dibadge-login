<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>diBadge | Project Forms</title>

  <script>
    (function() {
      const savedTheme = localStorage.getItem('dibadge_web_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>

  <style>
    :root {
      --jet-black: #0f0f0f;
      --paper-white: #f8f9fa;
      --slate-surface: #1e1e1e;
      --accent-white: #ffffff;
      --muted-gray: #8e8e93;
      --cool-ash: #a1a1a6;
      --soft-border: #e5e5ea;

      --bg-color: var(--paper-white);
      --text-color: var(--jet-black);
      --surface-color: var(--accent-white);
      --header-bg: var(--paper-white);
      --tabbar-bg: var(--paper-white);
      --border-color: var(--soft-border);
      --subtext-color: var(--cool-ash);
    }
    [data-theme="dark"] {
      --bg-color: var(--jet-black);
      --text-color: var(--accent-white);
      --surface-color: var(--slate-surface);
      --header-bg: #050505;
      --tabbar-bg: #050505;
      --border-color: #2c2c2e;
      --subtext-color: var(--muted-gray);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    /* Themed scrollbar, matching the chat screen — not the browser default */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #000000; }
    ::-webkit-scrollbar-thumb { background: var(--slate-surface, #1e1e1e); border-radius: 4px; border: 1px solid var(--border-color, #2c2c2e); }
    ::-webkit-scrollbar-thumb:hover { background: #2c2c2e; }
    * { scrollbar-width: thin; scrollbar-color: var(--slate-surface, #1e1e1e) #000000; }

    /* Header — same shell as the Projects screen */
    .dashboard-header { background: var(--header-bg); color: var(--text-color); padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 64px; flex-shrink: 0; border-bottom: 1px solid var(--border-color); }
    .default-header-title { display: flex; align-items: center; gap: 12px; }
    .default-header-title h1 { font-size: 1.25rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .header-center { flex: 1; max-width: 450px; margin: 0 20px; display: flex; align-items: center; gap: 12px; }
    .search-input { flex: 1; background: var(--surface-color); color: var(--text-color); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 20px; font-size: 0.88rem; outline: none; }
    .search-input::placeholder { color: var(--subtext-color); }
    .view-mode-toggle { display: flex; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 2px; }
    .view-btn { background: transparent; border: none; color: var(--subtext-color); padding: 6px 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
    .view-btn svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; }
    .view-btn.active { background: var(--paper-white); color: var(--jet-black); }

    .folder-header-nav { display: flex; align-items: center; gap: 12px; font-size: 1.05rem; font-weight: 600; }
    .header-back-icon { background: transparent; border: none; color: var(--text-color); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; border-radius: 6px; }
    .header-back-icon:hover { background: var(--surface-color); }
    .header-breadcrumb-path { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .breadcrumb-item { cursor: pointer; color: var(--subtext-color); text-decoration: none; }
    .breadcrumb-item:hover { text-decoration: underline; }
    .breadcrumb-item.active { color: var(--text-color); cursor: default; text-decoration: none; }

    .dashboard-body-split { display: flex; flex: 1; height: calc(100vh - 64px); overflow: hidden; position: relative; }

    /* Left Navigation Bar — same as Projects screen */
    .left-vertical-tabbar { width: 64px; background: var(--tabbar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; padding: 16px 0; z-index: 10; }
    .tab-btn { width: 44px; height: 44px; border-radius: 10px; background: transparent; border: none; color: var(--subtext-color); display: flex; justify-content: center; align-items: center; margin-bottom: 10px; text-decoration: none; cursor: pointer; transition: all 0.2s; }
    .tab-btn svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .tab-btn:hover { background: var(--slate-surface); color: #ffffff; }
    .tab-btn.active { background: var(--slate-surface); color: #ffffff; }
    .main-nav-group { display: flex; flex-direction: column; align-items: center; width: 100%; }
    .fab-tab-btn { margin-top: auto; background: var(--paper-white); color: var(--jet-black); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); cursor: pointer; display: flex; }
    .fab-tab-btn:hover { opacity: 0.9; transform: scale(1.05); }

    /* Forms library workspace */
    .forms-workspace { flex: 1; padding: 24px; overflow-y: auto; background: var(--bg-color); }
    .forms-panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .forms-panel-header h2 { font-size: 1.05rem; font-weight: 700; }
    .forms-add-btn { background: var(--surface-color); border: 1px solid var(--border-color); color: var(--text-color); padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    .forms-add-btn:hover { background: var(--border-color); }
    .forms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
    .form-card { background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 16px 12px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; cursor: pointer; transition: transform 0.15s, background 0.15s; }
    .form-card:hover { transform: translateY(-3px); background: rgba(255,255,255,0.05); }
    .form-card svg { width: 40px; height: 40px; stroke: var(--text-color); fill: none; stroke-width: 1.6; }
    .form-card-name { font-size: 0.82rem; font-weight: 600; color: var(--text-color); line-height: 1.25; word-break: break-word; }

    .forms-list-container { display: flex; flex-direction: column; gap: 2px; }
    .form-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 8px; cursor: pointer; transition: background 0.15s; }
    .form-row:hover { background: rgba(255,255,255,0.05); }
    .form-row svg { width: 22px; height: 22px; stroke: var(--text-color); fill: none; stroke-width: 1.6; flex-shrink: 0; }
    .form-row-name { font-size: 0.88rem; font-weight: 600; color: var(--text-color); }

    /* Individual form work screen — a blank A4 page, same idea as opening a new Word document */
    .form-sheet-wrapper { flex: 1; overflow-y: auto; padding: 40px; display: flex; justify-content: center; background: var(--bg-color); }
    .a4-page {
      background: #ffffff;
      width: 794px;       /* A4 at 96dpi */
      min-height: 1123px;
      max-width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.45);
      padding: 72px 76px;
      color: #1a1a1a;
      font-size: 1rem;
      line-height: 1.6;
      outline: none;
      box-sizing: border-box;
      position: relative; /* positioning context for floating blocks like Question & Answer */
    }
    .a4-page:empty:before {
      content: attr(data-placeholder);
      color: #999;
    }

    /* Form-building tool rail */
    .form-tools-rail {
      width: 56px;
      flex-shrink: 0;
      background: var(--surface-color);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0;
      gap: 6px;
    }
    .form-tool-btn {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: transparent;
      border: none;
      color: var(--subtext-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .form-tool-btn:hover { background: var(--border-color); color: var(--text-color); }
    .form-tool-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .form-tool-divider { width: 28px; height: 1px; background: var(--border-color); margin: 6px 0; }

    /* Inserted question/options blocks — light styling since the page itself is white */
    /* Question & Answer — a floating, movable, resizable block (like a text box in Word) */
    .qa-block {
      position: absolute;
      min-width: 160px;
      pointer-events: none; /* the wrapper itself never intercepts clicks — only its specific
                                interactive children (below) re-enable pointer events */
    }
    .qa-block.qa-dragging { z-index: 50; }
    .qa-move-zone {
      position: absolute;
      top: -6px; left: -6px;
      width: 26px; height: 26px;
      z-index: 5;
      pointer-events: auto; /* needs hover detection, but it's a small fixed corner zone */
    }
    .qa-move-handle {
      display: none;
      align-items: center;
      justify-content: center;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: #14b8a6;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
      cursor: move;
      box-shadow: 0 1px 4px rgba(0,0,0,0.35);
      user-select: none;
    }
    .qa-move-zone:hover .qa-move-handle { display: flex; }
    .qa-question-input {
      display: block;
      width: 100%;
      border: none;
      outline: none;
      font-weight: 700;
      font-size: 1rem;
      padding: 4px 2px;
      background: transparent;
      color: #1a1a1a;
      font-family: inherit;
      box-sizing: border-box;
      pointer-events: auto; /* needs to be typable */
    }
    .qa-question-input::placeholder { color: #999; font-weight: 700; }
    .qa-answer-box {
      position: relative;
      border: 1px solid #999;
      border-radius: 4px;
      min-height: 32px;
      margin-top: 2px;
      box-sizing: border-box;
      pointer-events: none; /* just a visual box — clicks pass through except the two thin
                                resize lines below, so it never blocks content near/behind it */
    }
    .qa-resize-right {
      position: absolute;
      top: 6px; bottom: 6px; right: -2px;
      width: 5px;
      cursor: ew-resize;
      pointer-events: auto; /* thin precise strip right on the border line, not a wide zone */
    }
    .qa-resize-bottom {
      position: absolute;
      left: 6px; right: 6px; bottom: -2px;
      height: 5px;
      cursor: ns-resize;
      pointer-events: auto; /* thin precise strip right on the border line, not a wide zone */
    }

    /* Button — same floating/movable/resizable pattern as Question & Answer, one editable shape */
    .btn-block {
      position: absolute;
      min-width: 90px;
      pointer-events: none;
    }
    .btn-block.btn-dragging { z-index: 50; }
    .btn-move-zone {
      position: absolute;
      top: -6px; left: -6px;
      width: 26px; height: 26px;
      z-index: 5;
      pointer-events: auto;
    }
    .btn-move-handle {
      display: none;
      align-items: center;
      justify-content: center;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: #14b8a6;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
      cursor: move;
      box-shadow: 0 1px 4px rgba(0,0,0,0.35);
      user-select: none;
    }
    .btn-move-zone:hover .btn-move-handle { display: flex; }
    .btn-shape-wrapper { position: relative; }
    .btn-shape {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      border: 1px solid #999;
      border-radius: 6px;
      padding: 8px 16px;
      background: #f0f0f0;
      color: #1a1a1a;
      font-weight: 600;
      text-align: center;
      outline: none;
      box-sizing: border-box;
      pointer-events: auto;
    }
    .btn-resize-right {
      position: absolute;
      top: 6px; bottom: 6px; right: -2px;
      width: 5px;
      cursor: ew-resize;
      pointer-events: auto;
    }
    .btn-resize-bottom {
      position: absolute;
      left: 6px; right: 6px; bottom: -2px;
      height: 5px;
      cursor: ns-resize;
      pointer-events: auto;
    }
    .inserted-table { border-collapse: collapse; width: 100%; margin: 12px 0; }
    .inserted-table td { border: 1px solid #999; padding: 8px; min-width: 60px; }
    .inserted-image { max-width: 100%; margin: 12px 0; display: block; }

    /* Activity Feed — identical component/styling to the chat screen's */
    .activity-feed-panel { width: 300px; flex-shrink: 0; background: var(--surface-color); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 12px; overflow-y: auto; padding: 16px; height: 100%; }
    .details-panel-section-header { display: flex; align-items: center; justify-content: space-between; }
    .details-panel-title-group { display: flex; align-items: center; gap: 8px; }
    .details-panel-title-group svg { width: 16px; height: 16px; stroke: var(--subtext-color); stroke-width: 2; fill: none; flex-shrink: 0; }
    .details-panel-title { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--subtext-color); }
    .details-panel-live-dot { width: 8px; height: 8px; border-radius: 50%; background: #25D366; animation: livePulse 1.6s ease-in-out infinite; flex-shrink: 0; }
    @keyframes livePulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    .activity-feed-card { background: transparent; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; }
    .activity-feed-title { font-size: 0.85rem; font-weight: 700; color: var(--text-color); margin-bottom: 2px; }
    .activity-feed-desc { font-size: 0.78rem; color: var(--subtext-color); line-height: 1.4; }
    .activity-feed-time { font-size: 0.68rem; color: var(--subtext-color); margin-top: 6px; }

    /* Add Form modal */
    /* Rename/New popups — dark rounded card, underline input, plain Cancel + pill OK */
    .group-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .group-modal-overlay.active { display: flex; }
    .group-modal-box {
      background: var(--surface-color);
      border-radius: 20px;
      padding: 28px 24px 20px 24px;
      width: 320px;
      max-width: 100%;
    }
    .group-modal-title {
      font-size: 1.3rem;
      font-weight: 500;
      color: var(--text-color);
      margin-bottom: 22px;
    }
    .group-modal-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-color);
      font-size: 0.95rem;
      padding: 6px 2px 10px 2px;
      outline: none;
      margin-bottom: 20px;
      box-sizing: border-box;
    }
    .group-modal-input::placeholder { color: var(--subtext-color); }
    .group-modal-input:focus { border-bottom-color: var(--subtext-color); }
    .group-modal-message {
      font-size: 0.85rem;
      color: var(--subtext-color);
      margin-bottom: 22px;
      line-height: 1.4;
    }
    .group-modal-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 20px;
    }
    .group-modal-cancel-btn {
      background: transparent;
      border: none;
      color: var(--text-color);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      padding: 4px;
    }
    .group-modal-ok-btn {
      background: var(--border-color);
      border: none;
      color: var(--text-color);
      font-size: 0.95rem;
      font-weight: 700;
      padding: 10px 26px;
      border-radius: 24px;
      cursor: pointer;
    }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 15, 15, 0.75); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 100; }
    .modal-card { background: var(--surface-color); padding: 28px; border-radius: 12px; text-align: left; max-width: 380px; width: 90%; position: relative; color: var(--text-color); border: 1px solid var(--border-color); }
    .modal-card h3 { text-align: center; margin-bottom: 16px; font-size: 1.1rem; }
    .modal-label { display: block; font-size: 0.82rem; color: var(--subtext-color); margin: 10px 0 4px 0; font-weight: 600; }
    .modal-input { width: 100%; padding: 10px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); border-radius: 6px; font-size: 0.9rem; outline: none; }
    .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
    .modal-btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .btn-save { background: var(--paper-white); color: var(--jet-black); }
    .btn-cancel { background: var(--border-color); color: var(--text-color); }
    .close-btn { position: absolute; top: 14px; right: 14px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--subtext-color); }

    @media (max-width: 1024px) { .activity-feed-panel { display: none; } }
  </style>
</head>
<body>

  <header class="dashboard-header">
    <div style="display:flex; align-items:center; gap:12px;">
      <div class="default-header-title" id="libraryHeaderTitle">
        <h1>
          <svg style="width:24px; height:24px; stroke:currentColor; stroke-width:2; fill:none;" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="12" x2="16" y2="12"></line><line x1="8" y1="16" x2="16" y2="16"></line></svg>
          <span>Project Forms</span>
        </h1>
      </div>
      <div class="folder-header-nav" id="formHeaderNav" style="display:none;">
        <button class="header-back-icon" onclick="backToLibrary()" title="Back">
          <svg style="width:22px; height:22px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </button>
        <div class="header-breadcrumb-path" id="breadcrumbBar"></div>
      </div>
    </div>

    <div class="header-center" id="libraryHeaderCenter">
      <input type="text" id="formSearchInput" class="search-input" placeholder="search forms.." oninput="renderFormsLibrary()" />
      <div class="view-mode-toggle">
        <button class="view-btn active" id="btnViewTile" onclick="setLibraryViewMode('grid')" title="Tile Grid View">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        </button>
        <button class="view-btn" id="btnViewList" onclick="setLibraryViewMode('list')" title="Detailed List View">
          <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="dashboard-body-split">

    <aside class="left-vertical-tabbar">
      <div class="main-nav-group">
        <a href="../home" class="tab-btn" title="Home" onclick="return handleNavAttempt(event, '../home')">
          <svg viewBox="0 0 24 24" style="width: 22px; height: 22px;">
            <path d="M2.768 19.985c0 1.978 1.594 3.584 3.563 3.584h10.615c1.968 0 3.563-1.605 3.563-3.584V10.611c0-1.973-1.596-3.577-3.563-3.577H9.859c-0.463 0-0.899 0.229-1.164 0.62-0.266 0.385-0.323 0.874-0.153 1.311 0.527 1.382 1.85 2.292 3.325 2.292h4.038v7.65H7.857v-6.551c0-0.979-0.401-1.921-1.108-2.598L4.011 7.199c-0.202-0.194-0.502-0.251-0.757-0.136-0.255 0.109-0.418 0.36-0.418 0.641v11.691zM7.897 0.669c0-0.204-0.165-0.365-0.362-0.365H3.163c-0.198 0-0.356 0.161-0.356 0.365v3.995c0 0.199 0.158 0.36 0.356 0.36h4.377c0.197 0 0.362-0.161 0.362-0.36V0.669z" fill="#008080" stroke="none"/>
          </svg>
        </a>
        <a href="../index.html" class="tab-btn" title="Projects" onclick="return handleNavAttempt(event, '../index.html')">
          <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
        </a>
        <button class="tab-btn active" title="Project forms">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="12" x2="16" y2="12"></line><line x1="8" y1="16" x2="16" y2="16"></line></svg>
        </button>
        <a href="../index.html" class="tab-btn" title="Schedule" onclick="return handleNavAttempt(event, '../index.html')">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        </a>
      </div>
      <button class="tab-btn fab-tab-btn" onclick="openAddFormModal()" title="Add Form">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
    </aside>

    <!-- Add Form modal -->
    <div class="group-modal-overlay" id="addFormModal" onclick="closeAddFormModal()">
      <div class="group-modal-box" onclick="event.stopPropagation()">
        <div class="group-modal-title">New Form</div>
        <input type="text" class="group-modal-input" id="newFormNameInput" placeholder="Name" onkeydown="if(event.key==='Enter'){event.preventDefault(); confirmAddForm();}">
        <div class="group-modal-actions">
          <button class="group-modal-cancel-btn" onclick="closeAddFormModal()">Cancel</button>
          <button class="group-modal-ok-btn" onclick="confirmAddForm()">OK</button>
        </div>
      </div>
    </div>

    <!-- Unsaved changes prompt — same styling as the chat's remove/delete confirmations -->
    <div class="group-modal-overlay" id="unsavedChangesOverlay" onclick="cancelPendingNav()">
      <div class="group-modal-box" onclick="event.stopPropagation()">
        <div class="group-modal-title">Unsaved Changes</div>
        <div class="group-modal-message">Save before leaving?</div>
        <div class="group-modal-actions">
          <button class="group-modal-cancel-btn" onclick="cancelPendingNav()">Cancel</button>
          <button class="group-modal-cancel-btn" onclick="discardAndLeave()">Discard</button>
          <button class="group-modal-ok-btn" onclick="saveAndLeave()">Save</button>
        </div>
      </div>
    </div>

    <!-- Forms library (list of all forms) -->
    <main class="forms-workspace" id="formsLibraryWorkspace">
      <div class="forms-panel-header">
        <h2>Project Forms</h2>
      </div>
      <div class="forms-grid" id="formsGrid"></div>
    </main>

    <!-- Individual form (shown when a form is opened via ?name=) -->
    <main class="form-sheet-wrapper" id="formSheetWrapper" style="display:none;">
      <div class="a4-page" id="formSheet" contenteditable="true" data-placeholder="Start designing this form..." oninput="hasUnsavedChanges = true;"></div>
    </main>

    <!-- Form-building tool rail — only shown while editing a form, not in the library view -->
    <aside class="form-tools-rail" id="formToolsRail" style="display:none;">
      <button class="form-tool-btn" onmousedown="event.preventDefault();" onclick="insertQuestionBlock()" title="Question &amp; Answer">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
      </button>
      <button class="form-tool-btn" onmousedown="event.preventDefault();" onclick="insertButtonBlock()" title="Button">
        <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="4"></rect></svg>
      </button>
      <button class="form-tool-btn" onmousedown="event.preventDefault();" onclick="insertTable()" title="Table">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="12" y1="3" x2="12" y2="21"></line></svg>
      </button>
      <button class="form-tool-btn" onmousedown="event.preventDefault(); saveFormSelection();" onclick="document.getElementById('formImageInput').click()" title="Insert Picture">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
      </button>
      <div class="form-tool-divider"></div>
      <button class="form-tool-btn" onmousedown="event.preventDefault();" onclick="cycleTextAlign()" title="Text Align">
        <svg viewBox="0 0 24 24"><line x1="17" y1="10" x2="3" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line><line x1="17" y1="18" x2="3" y2="18"></line></svg>
      </button>
      <button class="form-tool-btn" onmousedown="event.preventDefault(); saveFormSelection();" onclick="document.getElementById('fillColorInput').click()" title="Fill Color">
        <svg viewBox="0 0 24 24"><path d="M19 11l-6-6-9 9 6 6z"></path><path d="M4 14l6 6"></path><line x1="19" y1="11" x2="19" y2="20"></line><line x1="15" y1="20" x2="23" y2="20"></line></svg>
      </button>
      <button class="form-tool-btn" onmousedown="event.preventDefault(); saveFormSelection();" onclick="document.getElementById('textColorInput').click()" title="Text Color">
        <svg viewBox="0 0 24 24"><path d="M9 4l-5.5 14h2.2l1.2-3.4h6.2L14.3 18h2.2L11 4z"></path><path d="M7.7 12.6h6.6"></path><line x1="17" y1="20" x2="23" y2="20"></line></svg>
      </button>
      <input type="color" id="fillColorInput" style="display:none" onchange="restoreFormSelection(); applyFillColor(this.value);">
      <input type="color" id="textColorInput" style="display:none" onchange="restoreFormSelection(); applyTextColor(this.value);">
      <input type="file" id="formImageInput" accept="image/*" style="display:none" onchange="restoreFormSelection(); insertImageFromFile(this);">
    </aside>

    <aside class="activity-feed-panel">
      <div class="details-panel-section-header">
        <div class="details-panel-title-group">
          <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
          <span class="details-panel-title">Activity Feed</span>
        </div>
        <span class="details-panel-live-dot" title="Live"></span>
      </div>
      <div class="activity-feed-card">
        <div class="activity-feed-title">New Project Initialized</div>
        <div class="activity-feed-desc">Amber Holdings setup complete.</div>
        <div class="activity-feed-time">1 hour ago</div>
      </div>
    </aside>
  </div>

  <script>
    // This page is the REAL destination for the "Project forms" nav icon — a standalone
    // library, not an in-page panel embedded in the Projects screen.

    const FORMS_LIBRARY_KEY = 'dibadge_global_forms_library';
    let libraryViewMode = 'grid';

    function getDefaultForms() {
      return [
        'Tower B Foundation Log Sheet',
        'Daily Site Inspection Form',
        'Safety Compliance Checklist',
        'Material Delivery Record',
        'Concrete Pour Approval Form',
        'Equipment Maintenance Log'
      ];
    }

    function getFormsLibrary() {
      const stored = localStorage.getItem(FORMS_LIBRARY_KEY);
      if (!stored) {
        const defaults = getDefaultForms();
        localStorage.setItem(FORMS_LIBRARY_KEY, JSON.stringify(defaults));
        return defaults;
      }
      try {
        const parsed = JSON.parse(stored);
        return Array.isArray(parsed) ? parsed : getDefaultForms();
      } catch (e) {
        return getDefaultForms();
      }
    }

    function saveFormsLibrary(forms) {
      localStorage.setItem(FORMS_LIBRARY_KEY, JSON.stringify(forms));
    }

    function setLibraryViewMode(mode) {
      libraryViewMode = mode;
      document.getElementById('btnViewTile').classList.toggle('active', mode === 'grid');
      document.getElementById('btnViewList').classList.toggle('active', mode === 'list');
      renderFormsLibrary();
    }

    function renderFormsLibrary() {
      const grid = document.getElementById('formsGrid');
      const query = document.getElementById('formSearchInput').value.toLowerCase().trim();
      const forms = getFormsLibrary().filter(name => name.toLowerCase().includes(query));

      if (libraryViewMode === 'list') {
        grid.className = 'forms-list-container';
        grid.innerHTML = forms.map(name => `
          <div class="form-row" title="${name}" onclick="openForm('${name.replace(/'/g, "\\'")}')">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="12" x2="16" y2="12"></line><line x1="8" y1="16" x2="16" y2="16"></line></svg>
            <span class="form-row-name">${name}</span>
          </div>
        `).join('');
      } else {
        grid.className = 'forms-grid';
        grid.innerHTML = forms.map(name => `
          <div class="form-card" title="${name}" onclick="openForm('${name.replace(/'/g, "\\'")}')">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="12" x2="16" y2="12"></line><line x1="8" y1="16" x2="16" y2="16"></line></svg>
            <div class="form-card-name">${name}</div>
          </div>
        `).join('');
      }
    }

    function openAddFormModal() {
      document.getElementById('newFormNameInput').value = '';
      document.getElementById('addFormModal').classList.add('active');
      document.getElementById('newFormNameInput').focus();
    }
    function closeAddFormModal() {
      document.getElementById('addFormModal').classList.remove('active');
    }
    function confirmAddForm() {
      const name = document.getElementById('newFormNameInput').value.trim();
      if (!name) return;
      const forms = getFormsLibrary();
      forms.push(name);
      saveFormsLibrary(forms);
      closeAddFormModal();
      openForm(name); // jump straight into the new form's work screen, ready to design
    }

    // ---- Opening / viewing a specific form ----

    // ===================== Unsaved-changes tracking + persistence =====================
    // In-app navigation (breadcrumb, sidebar, back arrow) is fully under our control and gets
    // the custom confirmation styled like the chat's remove/delete popups. Actually closing or
    // refreshing the browser tab is NOT something a webpage can style — browsers only allow
    // their own plain native "leave site?" dialog for that (a hard security restriction, the
    // same for every site), so that case uses the standard beforeunload prompt instead.

    let hasUnsavedChanges = false;
    let currentFormName = null;
    let pendingNavUrl = null; // a real URL, or '__library__' for the in-page library view
    const FORM_CONTENT_KEY_PREFIX = 'dibadge_form_content_';

    function saveCurrentFormContent() {
      if (!currentFormName) return;
      const page = document.getElementById('formSheet');
      localStorage.setItem(FORM_CONTENT_KEY_PREFIX + currentFormName, page.innerHTML);
    }

    function loadFormContent(name) {
      return localStorage.getItem(FORM_CONTENT_KEY_PREFIX + name);
    }

    // Every in-app link/button that leaves the current form routes through this first.
    function handleNavAttempt(event, url) {
      if (!hasUnsavedChanges) return true; // nothing to protect — let it navigate normally
      if (event) event.preventDefault();
      pendingNavUrl = url;
      document.getElementById('unsavedChangesOverlay').classList.add('active');
      return false;
    }

    function cancelPendingNav() {
      pendingNavUrl = null;
      document.getElementById('unsavedChangesOverlay').classList.remove('active');
    }

    function discardAndLeave() {
      hasUnsavedChanges = false;
      document.getElementById('unsavedChangesOverlay').classList.remove('active');
      proceedPendingNav();
    }

    function saveAndLeave() {
      saveCurrentFormContent();
      hasUnsavedChanges = false;
      document.getElementById('unsavedChangesOverlay').classList.remove('active');
      proceedPendingNav();
    }

    function proceedPendingNav() {
      const url = pendingNavUrl;
      pendingNavUrl = null;
      if (url === '__library__') {
        window.history.pushState({}, '', window.location.pathname);
        showLibrary();
      } else if (url) {
        window.location.href = url;
      }
    }

    // Native browser dialog only — cannot be replaced with the app's own styled popup.
    window.addEventListener('beforeunload', function(e) {
      if (!hasUnsavedChanges) return;
      e.preventDefault();
      e.returnValue = '';
    });

    function openForm(name) {
      window.history.pushState({}, '', `?name=${encodeURIComponent(name)}`);
      showFormSheet(name);
    }

    function backToLibrary() {
      handleNavAttempt(null, '__library__');
      if (!hasUnsavedChanges) {
        window.history.pushState({}, '', window.location.pathname);
        showLibrary();
      }
    }

    function showLibrary() {
      document.getElementById('formsLibraryWorkspace').style.display = 'block';
      document.getElementById('formSheetWrapper').style.display = 'none';
      document.getElementById('formToolsRail').style.display = 'none';
      document.getElementById('libraryHeaderTitle').style.display = 'flex';
      document.getElementById('libraryHeaderCenter').style.display = 'flex';
      document.getElementById('formHeaderNav').style.display = 'none';
      renderFormsLibrary();
    }

    function showFormSheet(name) {
      document.getElementById('formsLibraryWorkspace').style.display = 'none';
      document.getElementById('formSheetWrapper').style.display = 'flex';
      document.getElementById('libraryHeaderTitle').style.display = 'none';
      document.getElementById('libraryHeaderCenter').style.display = 'none';
      document.getElementById('formHeaderNav').style.display = 'flex';

      document.getElementById('breadcrumbBar').innerHTML = `
        <span class="breadcrumb-item" onclick="backToLibrary()">Project Forms</span>
        <span>&gt;</span>
        <span class="breadcrumb-item active">${name}</span>
      `;

      // Blank A4 page, same idea as opening a new Word document — loads any previously saved
      // content for this form, or starts empty if there is none yet.
      currentFormName = name;
      hasUnsavedChanges = false;
      const page = document.getElementById('formSheet');
      const saved = loadFormContent(name);
      page.innerHTML = saved || '';
      // Re-attach drag/resize behavior to any Question & Answer blocks restored from storage —
      // innerHTML assignment brings back the markup but not the JS listeners that were on it.
      page.querySelectorAll('.qa-block').forEach(block => wireQaBlockInteractions(block));
      page.querySelectorAll('.btn-block').forEach(block => wireButtonBlockInteractions(block));
      document.getElementById('formToolsRail').style.display = 'flex';

      // Empty page (new form, or nothing saved yet) — put the cursor at the very start so
      // typing or using a tool immediately begins there, with no click needed first.
      if (!page.textContent.trim() && page.querySelectorAll('.qa-block, .btn-block, table, img').length === 0) {
        placeCursorAtPageStart();
      }
    }

    (function init() {
      const urlParams = new URLSearchParams(window.location.search);
      const formName = urlParams.get('name');
      if (formName) {
        showFormSheet(formName);
      } else {
        showLibrary();
      }
    })();

    window.addEventListener('popstate', function() {
      const urlParams = new URLSearchParams(window.location.search);
      const formName = urlParams.get('name');
      if (formName) showFormSheet(formName);
      else showLibrary();
    });

    // ===================== Form-building tool rail =====================
    // Every tool operates on the current cursor position / selection inside the A4 page.
    // Buttons use onmousedown+preventDefault so clicking them never steals focus away from
    // the page — that's what keeps the selection valid for insertion or execCommand calls.
    // The two exceptions (color pickers, image file picker) hand off to native browser UI,
    // which DOES steal focus — so those save the selection first and restore it once the
    // native picker returns a value, before applying it.

    let savedFormRange = null;

    function saveFormSelection() {
      const sel = window.getSelection();
      const page = document.getElementById('formSheet');
      if (sel.rangeCount > 0 && page.contains(sel.anchorNode)) {
        savedFormRange = sel.getRangeAt(0).cloneRange();
      }
    }

    function restoreFormSelection() {
      if (!savedFormRange) return;
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(savedFormRange);
    }

    // Guarantees a real cursor lands wherever you click on the page — including blank space
    // near/around a floating Question & Answer block — so the next tool or typed text starts
    // exactly there. Only acts as a fallback: if the browser already placed a valid cursor (or
    // you dragged to select a range of text), this leaves it alone rather than overriding it.
    (function setupClickToPlaceCursor() {
      const page = document.getElementById('formSheet');
      page.addEventListener('mouseup', function(e) {
        const sel = window.getSelection();
        if (sel.rangeCount > 0 && !sel.getRangeAt(0).collapsed) return; // a real drag-selection — don't touch it
        if (sel.rangeCount > 0 && page.contains(sel.anchorNode)) return; // browser already placed it correctly

        let range = null;
        if (document.caretRangeFromPoint) {
          range = document.caretRangeFromPoint(e.clientX, e.clientY);
        } else if (document.caretPositionFromPoint) {
          const pos = document.caretPositionFromPoint(e.clientX, e.clientY);
          if (pos && pos.offsetNode) {
            range = document.createRange();
            range.setStart(pos.offsetNode, pos.offset);
            range.collapse(true);
          }
        }

        // A floating block (like Question & Answer) sits OUTSIDE the page's normal flow —
        // it doesn't push other content down. So on an otherwise-blank page, the browser's
        // caret lookup can snap to that block's content regardless of how far away you
        // actually clicked. Reject that: only trust the resolved position if it's genuinely
        // near where you clicked, and not inside a floating block at all.
        let usableRange = null;
        if (range && page.contains(range.startContainer)) {
          const insideFloatingBlock = range.startContainer.parentElement && range.startContainer.parentElement.closest('.qa-block, .btn-block');
          const rect = range.getClientRects()[0] || range.getBoundingClientRect();
          const closeEnough = rect && Math.abs(rect.top - e.clientY) < 60;
          if (!insideFloatingBlock && closeEnough) usableRange = range;
        }

        if (usableRange) {
          page.focus();
          sel.removeAllRanges();
          sel.addRange(usableRange);
        } else if (page.textContent.trim() || page.querySelector('table, img')) {
          // There's real content elsewhere on the page, just not near this click — the
          // standard "clicked below everything" behavior is to land at the end of it.
          placeCursorAtPageEnd();
        } else {
          placeCursorAtPageStart();
        }
      });
    })();

    function placeCursorAtPageStart() {
      const page = document.getElementById('formSheet');
      page.focus();
      const range = document.createRange();
      range.selectNodeContents(page);
      range.collapse(true); // true = collapse to the START, not the end
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

    function placeCursorAtPageEnd() {
      const page = document.getElementById('formSheet');
      page.focus();
      const range = document.createRange();
      range.selectNodeContents(page);
      range.collapse(false); // false = collapse to the END
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

    function insertHtmlAtCursor(html) {
      const page = document.getElementById('formSheet');
      page.focus();
      const sel = window.getSelection();
      if (sel.rangeCount === 0 || !page.contains(sel.anchorNode)) {
        page.insertAdjacentHTML('beforeend', html);
      } else {
        const range = sel.getRangeAt(0);
        range.deleteContents();
        const frag = range.createContextualFragment(html);
        const lastNode = frag.lastChild;
        range.insertNode(frag);
        if (lastNode) {
          range.setStartAfter(lastNode);
          range.collapse(true);
          sel.removeAllRanges();
          sel.addRange(range);
        }
      }
      hasUnsavedChanges = true;
    }

    // Question & Answer — inserted as a floating block (not flowing text), so it can be freely
    // moved and resized like a text box, independent of the surrounding document.
    let qaBlockCascadeOffset = 0;

    function insertQuestionBlock() {
      const page = document.getElementById('formSheet');

      const block = document.createElement('div');
      block.className = 'qa-block';
      block.contentEditable = 'false'; // an atomic block — its own <input> stays interactive,
                                        // but the page's contenteditable doesn't intercept clicks/drags on it
      block.style.left = (20 + qaBlockCascadeOffset) + 'px';
      block.style.top = (20 + qaBlockCascadeOffset) + 'px';
      block.style.width = '380px';
      qaBlockCascadeOffset = (qaBlockCascadeOffset + 24) % 120; // so repeated inserts don't stack exactly on top of each other

      block.innerHTML = `
        <div class="qa-move-zone"><div class="qa-move-handle" title="Move">+</div></div>
        <input type="text" class="qa-question-input" placeholder="Question">
        <div class="qa-answer-box">
          <div class="qa-resize-right"></div>
          <div class="qa-resize-bottom"></div>
        </div>
      `;
      page.appendChild(block);
      wireQaBlockInteractions(block);
      hasUnsavedChanges = true;
    }

    function wireQaBlockInteractions(block) {
      const page = document.getElementById('formSheet');
      const moveHandle = block.querySelector('.qa-move-handle');
      const rightHandle = block.querySelector('.qa-resize-right');
      const bottomHandle = block.querySelector('.qa-resize-bottom');
      const answerBox = block.querySelector('.qa-answer-box');

      // Move — drag the "+" handle to reposition the whole block anywhere within the page
      moveHandle.addEventListener('pointerdown', function(e) {
        e.preventDefault();
        e.stopPropagation();
        block.classList.add('qa-dragging');
        const startX = e.clientX, startY = e.clientY;
        const startLeft = parseFloat(block.style.left) || 0;
        const startTop = parseFloat(block.style.top) || 0;
        const blockW = block.offsetWidth, blockH = block.offsetHeight;

        function onMove(ev) {
          const dx = ev.clientX - startX, dy = ev.clientY - startY;
          const maxLeft = Math.max(0, page.clientWidth - blockW);
          const maxTop = Math.max(0, page.clientHeight - blockH);
          const newLeft = Math.min(maxLeft, Math.max(0, startLeft + dx));
          const newTop = Math.min(maxTop, Math.max(0, startTop + dy));
          block.style.left = newLeft + 'px';
          block.style.top = newTop + 'px';
          hasUnsavedChanges = true;
        }
        function onUp() {
          block.classList.remove('qa-dragging');
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
        }
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
      });

      // Resize width — right edge only (left edge stays fixed)
      rightHandle.addEventListener('pointerdown', function(e) {
        e.preventDefault();
        e.stopPropagation();
        const startX = e.clientX;
        const startWidth = block.offsetWidth;
        function onMove(ev) {
          const dx = ev.clientX - startX;
          block.style.width = Math.max(140, startWidth + dx) + 'px';
          hasUnsavedChanges = true;
        }
        function onUp() {
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
        }
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
      });

      // Resize the answer box's height — bottom edge only (top edge stays fixed)
      bottomHandle.addEventListener('pointerdown', function(e) {
        e.preventDefault();
        e.stopPropagation();
        const startY = e.clientY;
        const startHeight = answerBox.offsetHeight;
        function onMove(ev) {
          const dy = ev.clientY - startY;
          answerBox.style.minHeight = Math.max(28, startHeight + dy) + 'px';
          hasUnsavedChanges = true;
        }
        function onUp() {
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
        }
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
      });
    }

    // Button — same floating-block idea as Question & Answer, one editable shape with its own
    // move handle and edge-only resize handles.
    function insertButtonBlock() {
      const page = document.getElementById('formSheet');

      const block = document.createElement('div');
      block.className = 'btn-block';
      block.contentEditable = 'false';
      block.style.left = (20 + qaBlockCascadeOffset) + 'px';
      block.style.top = (20 + qaBlockCascadeOffset) + 'px';
      block.style.width = '140px';
      qaBlockCascadeOffset = (qaBlockCascadeOffset + 24) % 120;

      block.innerHTML = `
        <div class="btn-move-zone"><div class="btn-move-handle" title="Move">+</div></div>
        <div class="btn-shape-wrapper">
          <div class="btn-shape" contenteditable="true">Button</div>
          <div class="btn-resize-right"></div>
          <div class="btn-resize-bottom"></div>
        </div>
      `;
      page.appendChild(block);
      wireButtonBlockInteractions(block);
      hasUnsavedChanges = true;
    }

    function wireButtonBlockInteractions(block) {
      const page = document.getElementById('formSheet');
      const moveHandle = block.querySelector('.btn-move-handle');
      const rightHandle = block.querySelector('.btn-resize-right');
      const bottomHandle = block.querySelector('.btn-resize-bottom');
      const shape = block.querySelector('.btn-shape');

      moveHandle.addEventListener('pointerdown', function(e) {
        e.preventDefault();
        e.stopPropagation();
        block.classList.add('btn-dragging');
        const startX = e.clientX, startY = e.clientY;
        const startLeft = parseFloat(block.style.left) || 0;
        const startTop = parseFloat(block.style.top) || 0;
        const blockW = block.offsetWidth, blockH = block.offsetHeight;

        function onMove(ev) {
          const dx = ev.clientX - startX, dy = ev.clientY - startY;
          const maxLeft = Math.max(0, page.clientWidth - blockW);
          const maxTop = Math.max(0, page.clientHeight - blockH);
          block.style.left = Math.min(maxLeft, Math.max(0, startLeft + dx)) + 'px';
          block.style.top = Math.min(maxTop, Math.max(0, startTop + dy)) + 'px';
          hasUnsavedChanges = true;
        }
        function onUp() {
          block.classList.remove('btn-dragging');
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
        }
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
      });

      rightHandle.addEventListener('pointerdown', function(e) {
        e.preventDefault();
        e.stopPropagation();
        const startX = e.clientX;
        const startWidth = block.offsetWidth;
        function onMove(ev) {
          block.style.width = Math.max(80, startWidth + (ev.clientX - startX)) + 'px';
          hasUnsavedChanges = true;
        }
        function onUp() {
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
        }
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
      });

      bottomHandle.addEventListener('pointerdown', function(e) {
        e.preventDefault();
        e.stopPropagation();
        const startY = e.clientY;
        const startHeight = shape.offsetHeight;
        function onMove(ev) {
          shape.style.minHeight = Math.max(28, startHeight + (ev.clientY - startY)) + 'px';
          hasUnsavedChanges = true;
        }
        function onUp() {
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
        }
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
      });
    }

    function insertTable() {
      let rows = '';
      for (let r = 0; r < 3; r++) {
        let cells = '';
        for (let c = 0; c < 3; c++) cells += '<td>&nbsp;</td>';
        rows += '<tr>' + cells + '</tr>';
      }
      insertHtmlAtCursor('<table class="inserted-table">' + rows + '</table><br>');
    }

    function insertImageFromFile(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        insertHtmlAtCursor('<img class="inserted-image" src="' + e.target.result + '"><br>');
      };
      reader.readAsDataURL(file);
      input.value = '';
    }

    const TEXT_ALIGN_COMMANDS = ['justifyLeft', 'justifyCenter', 'justifyRight', 'justifyFull'];
    let textAlignIndex = 0;

    function cycleTextAlign() {
      document.getElementById('formSheet').focus();
      document.execCommand(TEXT_ALIGN_COMMANDS[textAlignIndex]);
      textAlignIndex = (textAlignIndex + 1) % TEXT_ALIGN_COMMANDS.length;
      hasUnsavedChanges = true;
    }

    function applyFillColor(color) {
      document.getElementById('formSheet').focus();
      document.execCommand('hiliteColor', false, color);
      hasUnsavedChanges = true;
    }

    function applyTextColor(color) {
      document.getElementById('formSheet').focus();
      document.execCommand('foreColor', false, color);
      hasUnsavedChanges = true;
    }
  </script>
</body>
</html>
