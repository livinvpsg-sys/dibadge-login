  <script>
    function handleChatInputKey(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    function getTimeString() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'pm' : 'am';
      hours = hours % 12 || 12;
      return `${String(hours).padStart(2, '0')}:${minutes} ${ampm}`;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    let mediaGalleries = {};
    let galleryCounter = 0;
    let currentGalleryId = null;
    let currentMediaIndex = 0;

    function registerGallery(items) {
      const id = 'gal_' + (galleryCounter++);
      mediaGalleries[id] = items;
      return id;
    }

    function openMediaViewer(galleryId, index) {
      currentGalleryId = galleryId;
      currentMediaIndex = index;
      renderMediaViewerContent();
      document.getElementById('mediaViewerOverlay').classList.add('active');
    }

    function renderMediaViewerContent() {
      const items = mediaGalleries[currentGalleryId] || [];
      const item = items[currentMediaIndex];
      const content = document.getElementById('mediaViewerContent');
      if (!item) return;

    if (item.type === 'Video') {
        content.innerHTML = `<video src="${item.url}" controls autoplay playsinline></video>`;
      } else if (item.type === 'Audio') {
        content.innerHTML = `
          <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px; background: #1e1e1e; border-radius: 12px; border: 1px solid var(--border-color);">
            <div style="font-size: 48px;">🎵</div>
            <audio src="${item.url}" controls autoplay style="width: 300px; max-width: 80vw;"></audio>
          </div>`;
      } else {
        content.innerHTML = `<img src="${item.url}" alt="media">`;
      }

      const showNav = items.length > 1;
      const prevBtn = document.getElementById('mediaViewerPrev');
      const nextBtn = document.getElementById('mediaViewerNext');
      if (prevBtn) prevBtn.style.display = showNav ? 'flex' : 'none';
      if (nextBtn) nextBtn.style.display = showNav ? 'flex' : 'none';
    }

    function showPrevMedia(event) {
      if (event) event.stopPropagation();
      const items = mediaGalleries[currentGalleryId] || [];
      if (items.length < 2) return;
      currentMediaIndex = (currentMediaIndex - 1 + items.length) % items.length;
      renderMediaViewerContent();
    }

    function showNextMedia(event) {
      if (event) event.stopPropagation();
      const items = mediaGalleries[currentGalleryId] || [];
      if (items.length < 2) return;
      currentMediaIndex = (currentMediaIndex + 1) % items.length;
      renderMediaViewerContent();
    }

    function closeMediaViewer() {
      const overlay = document.getElementById('mediaViewerOverlay');
      const content = document.getElementById('mediaViewerContent');
      const video = content.querySelector('video');
      if (video) video.pause();
      overlay.classList.remove('active');
      content.innerHTML = '';
      currentGalleryId = null;
    }

    let readViewerCurrentUrl = null;
    let readViewerCurrentFileName = null;

    const READ_VIEWER_ENTER_FS_ICON = `<svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"></path><path d="M16 3h3a2 2 0 0 1 2 2v3"></path><path d="M21 16v3a2 2 0 0 1-2 2h-3"></path><path d="M3 16v3a2 2 0 0 0 2 2h3"></path></svg>`;
    const READ_VIEWER_EXIT_FS_ICON = `<svg viewBox="0 0 24 24"><path d="M9 3v3a2 2 0 0 1-2 2H4"></path><path d="M15 3v3a2 2 0 0 0 2 2h3"></path><path d="M20 16h-3a2 2 0 0 0-2 2v3"></path><path d="M4 16h3a2 2 0 0 1 2 2v3"></path></svg>`;

    function downloadReadViewerFile() {
      if (!readViewerCurrentUrl) return;
      const a = document.createElement('a');
      a.href = readViewerCurrentUrl;
      a.download = readViewerCurrentFileName || 'download';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function isReadViewerFullscreen() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }

    function toggleReadViewerFullscreen() {
      const container = document.querySelector('.read-viewer-container');
      if (!container) return;
      if (!isReadViewerFullscreen()) {
        if (container.requestFullscreen) container.requestFullscreen();
        else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    function updateReadViewerFullscreenIcon() {
      const btn = document.getElementById('readViewerFullscreenBtn');
      if (!btn) return;
      const isFs = isReadViewerFullscreen();
      btn.title = isFs ? 'Exit full screen' : 'Full screen';
      btn.innerHTML = isFs ? READ_VIEWER_EXIT_FS_ICON : READ_VIEWER_ENTER_FS_ICON;
    }

    document.addEventListener('fullscreenchange', updateReadViewerFullscreenIcon);
    document.addEventListener('webkitfullscreenchange', updateReadViewerFullscreenIcon);

    function closeReadViewer() {
      const overlay = document.getElementById('readViewerOverlay');
      const bodyEl = document.getElementById('readViewerBody');
      const media = bodyEl ? bodyEl.querySelector('video, audio') : null;
      if (media) media.pause();
      if (isReadViewerFullscreen()) {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
      overlay.classList.remove('active');
      bodyEl.innerHTML = '';
      readViewerCurrentUrl = null;
      readViewerCurrentFileName = null;
    }

    // Swipe support (touch) + arrow-key support for the fullscreen viewer
    (function setupMediaViewerGestures() {
      const overlay = document.getElementById('mediaViewerOverlay');
      if (!overlay) return;
      let touchStartX = null;

      overlay.addEventListener('touchstart', function(e) {
        touchStartX = e.touches[0].clientX;
      }, { passive: true });

      overlay.addEventListener('touchend', function(e) {
        if (touchStartX === null) return;
        const deltaX = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(deltaX) > 50) {
          if (deltaX > 0) showPrevMedia();
          else showNextMedia();
        }
        touchStartX = null;
      }, { passive: true });

      document.addEventListener('keydown', function(e) {
        if (!overlay.classList.contains('active')) return;
        if (e.key === 'ArrowLeft') showPrevMedia();
        else if (e.key === 'ArrowRight') showNextMedia();
        else if (e.key === 'Escape') closeMediaViewer();
      });
    })();

    function openFileInNewTab(url) {
      window.open(url, '_blank');
    }

  function setAppHeight() {
    const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-height', h + 'px');
  }
  setAppHeight();
  window.addEventListener('resize', setAppHeight);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', setAppHeight);
  }
  </script>

  <script>
    const defaultProjects = [
      { id: 'proj-1', client: 'Amber Holdings', projectNo: 'PRJ-2026-001', year: '2026' },
      { id: 'proj-2', client: 'Alpha Corp', projectNo: 'PRJ-2026-002', year: '2026' }
    ];

    function getProjects() {
      const stored = localStorage.getItem('dibadge_project_tiles');
      if (!stored) return defaultProjects;
      try { return JSON.parse(stored); } catch(e) { return defaultProjects; }
    }

    (function initChatHeader() {
      const urlParams = new URLSearchParams(window.location.search);
      const projectId = urlParams.get('id') || 'proj-1';
      
      const projects = getProjects();
      const currentProj = projects.find(p => p.id === projectId) || projects[0];

      // Sets exact project folder name and project number cleanly
      const crumbEl = document.getElementById("projectTitleCrumb");
      if (crumbEl) {
        crumbEl.textContent = `${currentProj.client} (${currentProj.projectNo})`;
      }

      // Back button handlers
      const backBtn = document.getElementById("backBtn");
      if (backBtn) {
        backBtn.onclick = () => {
          window.location.href = `../?id=${currentProj.id}`;
        };
      }

      const projectsCrumb = document.getElementById("projectsCrumb");
      if (projectsCrumb) {
        projectsCrumb.onclick = () => {
          window.location.href = `../?id=${currentProj.id}`;
        };
      }
    })();

function toggleAttachmentPopup(event) {
      event.stopPropagation();
      const popup = document.getElementById("attachmentPopup");
      if (popup.classList.contains('active')) {
        popup.classList.remove('active');
        return;
      }
      positionAttachmentPopup();
      popup.classList.add('active');
    }

    function positionAttachmentPopup() {
      const popup = document.getElementById("attachmentPopup");
      const attachBtn = document.getElementById("attachBtn");
      const plusBtn = document.getElementById("previewPlusBtn");
      const footer = document.querySelector(".chat-footer");
      // Whichever trigger icon is currently shown is the one the popup should anchor to
      const triggerBtn = (attachBtn && attachBtn.style.display !== 'none') ? attachBtn : plusBtn;
      if (!triggerBtn) return;

      const gap = 44;
      const btnRect = triggerBtn.getBoundingClientRect();
      // Clear the whole footer bar (icons + input + send button), not just the icon itself
      const footerRect = footer ? footer.getBoundingClientRect() : btnRect;
      const clearAboveY = Math.min(btnRect.top, footerRect.top);

      // Measure the popup's own size first (off-screen) so we can size/clamp it correctly
      popup.style.left = '-9999px';
      popup.style.top = '-9999px';
      popup.style.visibility = 'hidden';
      popup.style.pointerEvents = 'none';
      popup.classList.add('active');
      const popupRect = popup.getBoundingClientRect();
      popup.classList.remove('active');
      popup.style.visibility = '';
      popup.style.pointerEvents = '';

      // Left edge of the popup starts flush with the left edge of the icon
      let left = btnRect.left;
      left = Math.max(8, Math.min(left, window.innerWidth - popupRect.width - 8));
      const top = clearAboveY - popupRect.height - gap;

      popup.style.left = left + 'px';
      popup.style.top = top + 'px';

      // Keep the scale-in animation anchored to the icon's actual horizontal position,
      // even if the popup itself had to shift left/right to stay on screen
      const originX = (btnRect.left + btnRect.width / 2) - left;
      popup.style.transformOrigin = `${originX}px 100%`;
    }

    // Close popup when clicking outside
    window.addEventListener('click', function(e) {
      const popup = document.getElementById("attachmentPopup");
      const attachBtn = document.getElementById("attachBtn");
      if (popup && popup.classList.contains('active')) {
        if (!popup.contains(e.target) && !attachBtn.contains(e.target)) {
          popup.classList.remove('active');
        }
      }
    });

let selectedStagedFiles = [];
    let activeUploadType = 'Image';
    let stagedFileUrlMap = new Map(); // File -> object URL, created once per file, not per render

    function getStagedFileUrl(file) {
      if (!stagedFileUrlMap.has(file)) {
        stagedFileUrlMap.set(file, URL.createObjectURL(file));
      }
      return stagedFileUrlMap.get(file);
    }

    function handleFilesSelected(input, type) {
      const files = input.files;
      if (!files || files.length === 0) return;

      activeUploadType = type;
      for (let i = 0; i < files.length; i++) {
        selectedStagedFiles.push(files[i]);
      }

      renderPreviewTray();
      document.getElementById("attachmentPopup").classList.remove('active');
      input.value = '';
    }

function openFilePicker() {
      if (activeUploadType === 'Image') document.getElementById('imageInput').click();
      else if (activeUploadType === 'Video') document.getElementById('videoInput').click();
      else if (activeUploadType === 'Audio') document.getElementById('audioInput').click();
      else document.getElementById('documentInput').click();
    }

    function removeStagedFile(index) {
      const file = selectedStagedFiles[index];
      if (file && stagedFileUrlMap.has(file)) {
        URL.revokeObjectURL(stagedFileUrlMap.get(file));
        stagedFileUrlMap.delete(file);
      }
      selectedStagedFiles.splice(index, 1);
      renderPreviewTray();
    }

    function clearAllStagedFiles() {
      selectedStagedFiles.forEach(file => {
        if (stagedFileUrlMap.has(file)) {
          URL.revokeObjectURL(stagedFileUrlMap.get(file));
          stagedFileUrlMap.delete(file);
        }
      });
      selectedStagedFiles = [];
      renderPreviewTray();
    }

function renderPreviewTray() {
      const tray = document.getElementById("filePreviewTray");
      const container = document.getElementById("previewScrollContainer");
      const plusBtn = document.getElementById("previewPlusBtn");
      const attachBtn = document.getElementById("attachBtn");
      container.innerHTML = '';

      if (selectedStagedFiles.length === 0) {
        tray.classList.remove('active');
        if (plusBtn) plusBtn.style.display = 'none';
        if (attachBtn) attachBtn.style.display = 'flex';
        return;
      }

      tray.classList.add('active');
      if (plusBtn) plusBtn.style.display = 'flex';
      if (attachBtn) attachBtn.style.display = 'none';

      // Fixed half-width tile at the left — clears every staged file in one tap
      const clearTile = document.createElement("div");
      clearTile.className = "preview-clear-tile";
      clearTile.title = "Remove all";
      clearTile.innerHTML = `<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;
      clearTile.onclick = () => clearAllStagedFiles();
      container.appendChild(clearTile);

      // Build a gallery so staged images/videos can be swiped through, same as sent media
   let stagedGalleryId = null;
      if (activeUploadType === 'Image' || activeUploadType === 'Video' || activeUploadType === 'Audio') {
        const galleryItems = selectedStagedFiles.map(f => ({
          url: getStagedFileUrl(f),
          type: activeUploadType
        }));
        stagedGalleryId = registerGallery(galleryItems);
      }

      selectedStagedFiles.forEach((file, index) => {
        const objectUrl = getStagedFileUrl(file);
        const tile = document.createElement("div");

        if (activeUploadType === 'Image') {
          tile.className = "preview-tile";
          tile.innerHTML = `
            <img src="${objectUrl}" alt="preview">
            <button class="preview-remove-btn" onclick="event.stopPropagation(); removeStagedFile(${index})">✕</button>
          `;
          tile.onclick = () => openMediaViewer(stagedGalleryId, index);
        } else if (activeUploadType === 'Video') {
          tile.className = "preview-tile";
          tile.innerHTML = `
            <video src="${objectUrl}"></video>
            <button class="preview-remove-btn" onclick="event.stopPropagation(); removeStagedFile(${index})">✕</button>
          `;
          tile.onclick = () => openMediaViewer(stagedGalleryId, index);
        } else if (activeUploadType === 'Audio') {
          tile.className = "preview-tile preview-tile-doc";
          tile.innerHTML = `
            <div class="preview-doc-icon" style="background: #ff9800;">🎵</div>
            <span class="preview-doc-name">${file.name}</span>
            <button class="preview-remove-btn" onclick="event.stopPropagation(); removeStagedFile(${index})">✕</button>
          `;
          tile.onclick = () => openMediaViewer(stagedGalleryId, index);
       } else {
         const ext = file.name.split('.').pop().toLowerCase();
          let badgeColor = '#607d8b'; // default slate color
          let label = ext ? ext.toUpperCase() : 'FILE';

          if (['pdf'].includes(ext)) { badgeColor = '#f44336'; } // Red for PDF
          else if (['doc', 'docx'].includes(ext)) { badgeColor = '#2196f3'; } // Blue for Word
          else if (['xls', 'xlsx'].includes(ext)) { badgeColor = '#4caf50'; } // Green for Excel
          else if (['ppt', 'pptx'].includes(ext)) { badgeColor = '#ff9800'; } // Orange for PowerPoint
          else if (['txt', 'rtf'].includes(ext)) { badgeColor = '#78909c'; } // Blue-Grey for Text
          else if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) { badgeColor = '#ab47bc'; } // Purple for Archives

          tile.className = "preview-tile preview-tile-doc";
          tile.innerHTML = `
            <div class="preview-doc-icon" style="background: ${badgeColor};">${label}</div>
            <span class="preview-doc-name">${file.name}</span>
            <button class="preview-remove-btn" onclick="event.stopPropagation(); removeStagedFile(${index})">✕</button>
          `;
          tile.onclick = () => openReadViewer(objectUrl, file.name, 'Document');
        }

        container.appendChild(tile);
      });
    }

    function sendMessage() {
      const inputField = document.getElementById("msgInput");
      const text = inputField.value.trim();
      const hasFiles = selectedStagedFiles.length > 0;

      if (!text && !hasFiles) return;

      // Editing an existing text message updates it in place instead of sending a new one
      if (editingMessageId) {
        applyEdit(editingMessageId, text);
        inputField.value = "";
        cancelEdit();
        return;
      }

      const chatContainer = document.getElementById("chatContainer");
      const timeString = getTimeString();

      function buildQuotedHtml(targetId) {
        if (!targetId || !messages[targetId]) return '';
        const m = messages[targetId];
        const senderLabel = m.isOutgoing ? 'You' : 'John';
        const snippet = m.kind === 'text' ? truncateSnippet(m.text, 80) : (m.kind === 'media' ? '📷 Media' : '📄 Document');
        return `<div class="quoted-reply-block" data-target-id="${targetId}"><div class="quoted-reply-sender">${escapeHtml(senderLabel)}</div><div class="quoted-reply-snippet">${escapeHtml(snippet)}</div></div>`;
      }

      // ---------------- Documents: each attached file becomes its own separate message bubble ----------------
      if (hasFiles && activeUploadType === 'Document') {
        const fileCount = selectedStagedFiles.length;

        selectedStagedFiles.forEach((file, idx) => {
          const docMessageId = generateMessageId();
          const objectUrl = getStagedFileUrl(file);
          const ext = file.name.split('.').pop().toLowerCase();
          let badgeColor = '#607d8b';
          let label = ext ? ext.toUpperCase() : 'FILE';
          if (['pdf'].includes(ext)) { badgeColor = '#f44336'; }
          else if (['doc', 'docx'].includes(ext)) { badgeColor = '#2196f3'; }
          else if (['xls', 'xlsx'].includes(ext)) { badgeColor = '#4caf50'; }
          else if (['ppt', 'pptx'].includes(ext)) { badgeColor = '#ff9800'; }
          else if (['txt', 'rtf'].includes(ext)) { badgeColor = '#78909c'; }
          else if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) { badgeColor = '#ab47bc'; }

          const isFirst = idx === 0;
          const isLast = idx === fileCount - 1;
          const thisQuoted = isFirst ? buildQuotedHtml(replyingToId) : '';
          const thisCaption = (isLast && text) ? `<div class="media-caption">${escapeHtml(text)}</div>` : '';
          const ticksSpan = `<span class="msg-ticks" id="ticks-${docMessageId}"></span>`;

          const docRow = document.createElement('div');
          docRow.className = 'message-row outgoing';
          docRow.setAttribute('data-id', docMessageId);
          docRow.innerHTML = `<div class="msg-bubble outgoing media-bubble">
            ${thisQuoted}
            <div class="doc-list-container">
              <a href="#" onclick="event.preventDefault(); openReadViewer('${objectUrl}', '${file.name.replace(/'/g, "\\'")}', 'Document')" class="doc-tile-row" style="text-decoration: none;">
                <div class="doc-icon-box" style="background: ${badgeColor};">${label}</div>
                <div class="doc-info"><span class="doc-name">${file.name}</span></div>
              </a>
            </div>
            ${thisCaption}
            <div class="doc-time-row">${timeString} ${ticksSpan}</div>
          </div>`;

          chatContainer.appendChild(docRow);
          registerMessage({
            id: docMessageId,
            isOutgoing: true,
            kind: 'document',
            text: isLast ? text : '',
            time: timeString,
            status: 'sent',
            readAt: null,
            edited: false,
            editedAt: null,
            deletedFor: 'none',
            reaction: null,
            replyTo: isFirst ? replyingToId : null
          });
          updateTicksUI(docMessageId);
          simulateDeliveryAndRead(docMessageId);
        });

        chatContainer.scrollTop = chatContainer.scrollHeight;
        cancelReply();
        inputField.value = "";
        selectedStagedFiles.forEach(file => stagedFileUrlMap.delete(file));
        selectedStagedFiles = [];
        renderPreviewTray();
        return;
      }

      // ---------------- Text-only messages, or an Image/Video/Audio album in one bubble ----------------
      const messageId = generateMessageId();
      const messageRow = document.createElement("div");
      messageRow.className = "message-row outgoing";
      messageRow.setAttribute('data-id', messageId);
      const quotedHtml = buildQuotedHtml(replyingToId);
      let msgKind = 'text';

      if (hasFiles) {
        // Image / Video / Audio: kept grouped as one album bubble (WhatsApp-style),
        // unlike Documents above which now split into individual bubbles.
        msgKind = 'media';
        let mediaItemsHtml = '';
        const count = selectedStagedFiles.length;

        const galleryItems = selectedStagedFiles.map(f => ({
          url: getStagedFileUrl(f),
          type: activeUploadType
        }));
        const sentGalleryId = registerGallery(galleryItems);

        selectedStagedFiles.forEach((file, idx) => {
          const objectUrl = getStagedFileUrl(file);
          if (activeUploadType === 'Image') {
            mediaItemsHtml += `<div class="media-grid-item" onclick="openMediaViewer('${sentGalleryId}', ${idx})"><img src="${objectUrl}" alt="attachment"></div>`;
          } else if (activeUploadType === 'Video') {
            mediaItemsHtml += `<div class="media-grid-item" onclick="openMediaViewer('${sentGalleryId}', ${idx})"><video src="${objectUrl}"></video></div>`;
          } else if (activeUploadType === 'Audio') {
            mediaItemsHtml += `
            <div class="doc-tile-row" onclick="openMediaViewer('${sentGalleryId}', ${idx})" style="cursor: pointer;">
              <div class="doc-icon-box" style="background: #ff9800;">🎵</div>
              <div class="doc-info"><span class="doc-name">${file.name}</span></div>
            </div>`;
          }
        });

        const captionHtml = text ? `<div class="media-caption">${escapeHtml(text)}</div>` : '';
        const ticksSpan = `<span class="msg-ticks" id="ticks-${messageId}"></span>`;
        let contentLayout = '';

        if (activeUploadType === 'Image' || activeUploadType === 'Video') {
          let gridClass = 'media-grid-1';
          if (count === 2) gridClass = 'media-grid-2';
          else if (count >= 3) gridClass = 'media-grid-3';

          contentLayout = `
            ${quotedHtml}
            <div class="media-grid ${gridClass}">${mediaItemsHtml}</div>
            ${captionHtml}
            ${text ? `<div class="media-time-row">${timeString} ${ticksSpan}</div>` : `<div class="media-time-overlay">${timeString} ${ticksSpan}</div>`}
          `;
        } else {
          contentLayout = `
            ${quotedHtml}
            <div class="doc-list-container">${mediaItemsHtml}</div>
            ${captionHtml}
            <div class="doc-time-row">${timeString} ${ticksSpan}</div>
          `;
        }

        messageRow.innerHTML = `<div class="msg-bubble outgoing media-bubble">${contentLayout}</div>`;
      } else {
        // Text-only message
        messageRow.innerHTML = `
          <div class="msg-bubble outgoing">
            ${quotedHtml}
            <span class="message-text"></span>
            <span class="msg-meta-row">${timeString} <span class="msg-ticks" id="ticks-${messageId}"></span></span>
          </div>
        `;
        messageRow.querySelector(".message-text").textContent = text;
      }

      chatContainer.appendChild(messageRow);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      registerMessage({
        id: messageId,
        isOutgoing: true,
        kind: msgKind,
        text: text,
        time: timeString,
        status: 'sent',
        readAt: null,
        edited: false,
        editedAt: null,
        deletedFor: 'none',
        reaction: null,
        replyTo: replyingToId
      });
      updateTicksUI(messageId);
      simulateDeliveryAndRead(messageId);
      cancelReply();

      // Clear both the input and any staged files together.
      // Note: for a sent message, ownership of its object URLs transfers to the message
      // bubble (they must stay alive to keep displaying), so we only drop the map entries
      // here — we do NOT revoke, unlike clearAllStagedFiles()/removeStagedFile() which discard unsent files.
      inputField.value = "";
      selectedStagedFiles.forEach(file => stagedFileUrlMap.delete(file));
      selectedStagedFiles = [];
      renderPreviewTray();
    }

  async function openReadViewer(url, fileName, fileType) {
      const overlay = document.getElementById('readViewerOverlay');
      const titleEl = document.getElementById('readViewerTitle');
      const bodyEl = document.getElementById('readViewerBody');

      readViewerCurrentUrl = url;
      readViewerCurrentFileName = fileName;

      titleEl.textContent = fileName || 'Document Reader';
      bodyEl.innerHTML = '';
      overlay.classList.add('active');

      const ext = fileName ? fileName.split('.').pop().toLowerCase() : '';

      if (fileType === 'Image' || ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'].includes(ext)) {
        bodyEl.innerHTML = `<img src="${url}" alt="${fileName}">`;
      } else if (fileType === 'Video' || ['mp4', 'webm', 'ogg'].includes(ext)) {
        bodyEl.innerHTML = `<video src="${url}" controls autoplay playsinline style="width:100%; height:100%;"></video>`;
      } else if (fileType === 'Audio' || ['mp3', 'wav', 'm4a', 'aac'].includes(ext)) {
        bodyEl.innerHTML = `
          <div style="display: flex; flex-direction: column; align-items: center; gap: 16px;">
            <div style="font-size: 64px;">🎵</div>
            <div style="color: #fff; font-size: 0.95rem;">${fileName}</div>
            <audio src="${url}" controls autoplay style="width: 300px;"></audio>
          </div>`;
      } else if (ext === 'pdf') {
        bodyEl.innerHTML = `<iframe src="${url}#toolbar=0" type="application/pdf"></iframe>`;
      } else if (['txt', 'csv', 'json', 'xml', 'html'].includes(ext)) {
        // Read text/code files directly via fetch & preformatted view
        bodyEl.innerHTML = `<div id="textViewerContent" style="width: 100%; height: 100%; padding: 20px; box-sizing: border-box; color: #fff; font-family: monospace; white-space: pre-wrap; overflow: auto; background: #121212;">Loading...</div>`;
        try {
          const res = await fetch(url);
          const text = await res.text();
          const container = document.getElementById('textViewerContent');
          if (container) container.textContent = text;
        } catch (err) {
          const container = document.getElementById('textViewerContent');
          if (container) container.textContent = "Failed to load text content.";
        }
      } else if (ext === 'docx') {
        // Word (.docx): parsed and rendered client-side with Mammoth.js.
        // (Google Docs Viewer needs a public URL — local blob: URLs aren't reachable by Google's servers,
        // which is why it was throwing a 400 "malformed request" error.)
        bodyEl.innerHTML = `<div style="width:100%; height:100%; overflow:auto; background:#fff; box-sizing:border-box; padding:40px 32px;"><div id="docxViewerContent" style="max-width:760px; margin:0 auto; color:#1a1a1a; font-family:Georgia, 'Times New Roman', serif; line-height:1.6; font-size:0.95rem;">Loading document…</div></div>`;
        try {
          const res = await fetch(url);
          const arrayBuffer = await res.arrayBuffer();
          const result = await mammoth.convertToHtml({ arrayBuffer });
          const container = document.getElementById('docxViewerContent');
          if (container) container.innerHTML = result.value || '<p><em>This document appears to be empty.</em></p>';
        } catch (err) {
          const container = document.getElementById('docxViewerContent');
          if (container) container.innerHTML = '<p style="color:#c00;">Could not preview this document. Please download it instead.</p>';
        }
      } else if (['xls', 'xlsx'].includes(ext)) {
        // Excel: parsed and rendered client-side with SheetJS, one table per sheet.
        bodyEl.innerHTML = `<div style="width:100%; height:100%; overflow:auto; background:#fff; box-sizing:border-box; padding:24px;"><div id="xlsxViewerContent" style="color:#1a1a1a;">Loading spreadsheet…</div></div>`;
        try {
          const res = await fetch(url);
          const arrayBuffer = await res.arrayBuffer();
          const workbook = XLSX.read(arrayBuffer, { type: 'array' });
          const container = document.getElementById('xlsxViewerContent');
          if (container) {
            container.innerHTML = '';
            workbook.SheetNames.forEach((sheetName) => {
              const sheet = workbook.Sheets[sheetName];
              const tableHtml = XLSX.utils.sheet_to_html(sheet, { editable: false });
              const wrapper = document.createElement('div');
              wrapper.style.marginBottom = '28px';
              wrapper.innerHTML = `<div style="font-weight:700; font-size:0.9rem; margin-bottom:8px;">${sheetName}</div>${tableHtml}`;
              container.appendChild(wrapper);
            });
            container.querySelectorAll('table').forEach(t => {
              t.style.borderCollapse = 'collapse';
              t.style.width = '100%';
              t.style.fontSize = '0.82rem';
              t.querySelectorAll('td, th').forEach(c => {
                c.style.border = '1px solid #ddd';
                c.style.padding = '5px 9px';
                c.style.whiteSpace = 'nowrap';
              });
            });
          }
        } catch (err) {
          const container = document.getElementById('xlsxViewerContent');
          if (container) container.innerHTML = '<p style="color:#c00;">Could not preview this spreadsheet. Please download it instead.</p>';
        }
      } else if (['doc', 'ppt', 'pptx', 'rtf'].includes(ext)) {
        // Legacy .doc, PowerPoint, and .rtf files have no reliable client-side renderer
        // without a backend conversion step, so offer a direct download instead of a broken viewer.
        bodyEl.innerHTML = `
          <div style="display:flex; flex-direction:column; align-items:center; gap:14px; color:#fff; text-align:center; padding:32px;">
            <div style="font-size:48px;">📄</div>
            <div style="font-size:0.95rem;">Preview isn't available for .${ext} files.</div>
            <a href="${url}" download="${fileName}" style="background:#fff; color:#000; padding:10px 22px; border-radius:8px; text-decoration:none; font-weight:600; font-size:0.9rem;">Download to view</a>
          </div>`;
      } else if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) {
        // Archives can't be previewed in-browser at all — offer download only.
        bodyEl.innerHTML = `
          <div style="display:flex; flex-direction:column; align-items:center; gap:14px; color:#fff; text-align:center; padding:32px;">
            <div style="font-size:48px;">🗜️</div>
            <div style="font-size:0.95rem;">Archives can't be previewed. Download to extract and view its contents.</div>
            <a href="${url}" download="${fileName}" style="background:#fff; color:#000; padding:10px 22px; border-radius:8px; text-decoration:none; font-weight:600; font-size:0.9rem;">Download</a>
          </div>`;
      } else {
        bodyEl.innerHTML = `<iframe src="${url}"></iframe>`;
      }
    }

    // ===================== Message interactions: reply / delete / react / copy / edit / info =====================

    let messageIdCounter = 1;
    let messages = {}; // id -> message data
    let replyingToId = null;
    let editingMessageId = null;
    let contextMenuTargetId = null;
    let reactTargetId = null;

    const TICK_SINGLE_SVG = `<svg viewBox="0 0 16 15" fill="none"><path d="M11.1 3.4 5.6 9.9 3 7.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    const TICK_DOUBLE_SVG = `<svg viewBox="0 0 16 15" fill="none"><path d="M11.1 3.4 5.6 9.9 3 7.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M14.9 3.4 9.4 9.9 8.4 8.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

    function generateMessageId() {
      return 'msg_' + (messageIdCounter++);
    }

    function registerMessage(data) {
      messages[data.id] = data;
    }

    function getMessageRow(id) {
      return document.querySelector(`.message-row[data-id="${id}"]`);
    }

    function truncateSnippet(text, max) {
      if (!text) return '';
      return text.length > max ? text.slice(0, max) + '…' : text;
    }

    function updateTicksUI(id) {
      const msg = messages[id];
      if (!msg || !msg.isOutgoing) return;
      const el = document.getElementById('ticks-' + id);
      if (!el) return;
      el.className = 'msg-ticks status-' + msg.status;
      el.innerHTML = msg.status === 'sent' ? TICK_SINGLE_SVG : TICK_DOUBLE_SVG;
    }

    function simulateDeliveryAndRead(id) {
      // Demo-only simulation: no real second participant/backend exists here,
      // so we fake the normal WhatsApp-style progression sent -> delivered -> read.
      setTimeout(() => {
        const msg = messages[id];
        if (!msg || msg.deletedFor === 'everyone') return;
        msg.status = 'delivered';
        updateTicksUI(id);
        setTimeout(() => {
          const msg2 = messages[id];
          if (!msg2 || msg2.deletedFor === 'everyone') return;
          msg2.status = 'read';
          msg2.readAt = getTimeString();
          updateTicksUI(id);
        }, 2200);
      }, 700);
    }

    // Register the two pre-existing seed messages already in the markup
    (function initSeedMessages() {
      registerMessage({ id: 'seed_1', isOutgoing: false, kind: 'text', text: 'Hi there!', time: '04:13 pm', status: null, readAt: null, edited: false, editedAt: null, deletedFor: 'none', reaction: null, replyTo: null });
      registerMessage({ id: 'seed_2', isOutgoing: true, kind: 'text', text: 'Hello! How can I help you?', time: '04:13 pm', status: 'delivered', readAt: null, edited: false, editedAt: null, deletedFor: 'none', reaction: null, replyTo: null });
      updateTicksUI('seed_2');
    })();

    // ---------- Right-click context menu ----------

    document.getElementById('chatContainer').addEventListener('contextmenu', function(e) {
      const bubble = e.target.closest('.msg-bubble');
      if (!bubble) return;
      const row = bubble.closest('.message-row');
      if (!row) return;
      const id = row.getAttribute('data-id');
      const msg = messages[id];
      if (!msg || msg.deletedFor === 'everyone') return;
      e.preventDefault();
      openMsgContextMenu(e.clientX, e.clientY, id);
    });

    function openMsgContextMenu(x, y, id) {
      contextMenuTargetId = id;
      const msg = messages[id];
      const menu = document.getElementById('msgContextMenu');
      const isText = msg.kind === 'text';

      let itemsHtml = `
        <div class="msg-context-menu-item" onclick="startReply('${id}')">
          <svg viewBox="0 0 24 24"><path d="M9 17l-5-5 5-5"></path><path d="M4 12h11a5 5 0 0 1 5 5v1"></path></svg> Reply
        </div>
        <div class="msg-context-menu-item danger" onclick="openDeleteConfirm('${id}')">
          <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg> Delete
        </div>
        <div class="msg-context-menu-item" onclick="openReactBarFromMenu('${id}')">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg> React
        </div>`;

      if (isText) {
        itemsHtml += `
        <div class="msg-context-menu-item" onclick="copyMessageText('${id}')">
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy
        </div>`;
      }

      itemsHtml += `
        <div class="msg-context-menu-item" onclick="openMsgInfo('${id}')">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg> Message Info
        </div>`;

      if (isText) {
        itemsHtml += `
        <div class="msg-context-menu-item" onclick="startEdit('${id}')">
          <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg> Edit
        </div>`;
      }

      menu.innerHTML = itemsHtml;
      menu.style.left = '-9999px';
      menu.style.top = '-9999px';
      menu.classList.add('active');
      const rect = menu.getBoundingClientRect();
      const left = Math.max(8, Math.min(x, window.innerWidth - rect.width - 8));
      const top = Math.max(8, Math.min(y, window.innerHeight - rect.height - 8));
      menu.style.left = left + 'px';
      menu.style.top = top + 'px';
    }

    function closeMsgContextMenu() {
      document.getElementById('msgContextMenu').classList.remove('active');
    }

    window.addEventListener('click', function(e) {
      const menu = document.getElementById('msgContextMenu');
      if (menu.classList.contains('active') && !menu.contains(e.target)) {
        closeMsgContextMenu();
      }
    });
    window.addEventListener('scroll', closeMsgContextMenu, true);

    // ---------- Reply ----------

    function startReply(id) {
      closeMsgContextMenu();
      const msg = messages[id];
      if (!msg) return;
      cancelEdit(); // can't be editing and replying at the same time
      replyingToId = id;
      const bar = document.getElementById('replyPreviewBar');
      document.getElementById('replyPreviewSender').textContent = msg.isOutgoing ? 'You' : 'John';
      document.getElementById('replyPreviewSnippet').textContent =
        msg.kind === 'text' ? truncateSnippet(msg.text, 80) : (msg.kind === 'media' ? '📷 Media' : '📄 Document');
      bar.classList.add('active');
      document.getElementById('msgInput').focus();
    }

    function cancelReply() {
      replyingToId = null;
      document.getElementById('replyPreviewBar').classList.remove('active');
    }

    function jumpToMessage(id) {
      const row = getMessageRow(id);
      if (!row) return;
      row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      const bubble = row.querySelector('.msg-bubble');
      if (bubble) {
        bubble.classList.remove('jump-highlight');
        void bubble.offsetWidth; // restart the flash animation even if clicked repeatedly
        bubble.classList.add('jump-highlight');
      }
    }

    document.getElementById('chatContainer').addEventListener('click', function(e) {
      const quoted = e.target.closest('.quoted-reply-block');
      if (quoted) {
        const targetId = quoted.getAttribute('data-target-id');
        if (targetId) jumpToMessage(targetId);
      }
    });

    // ---------- Delete ----------

    function openDeleteConfirm(id) {
      closeMsgContextMenu();
      contextMenuTargetId = id;
      const msg = messages[id];
      const box = document.querySelector('#deleteConfirmOverlay .confirm-modal-box');
      let btns = '';
      // Real WhatsApp-style rule: only your own messages can be deleted for everyone
      if (msg && msg.isOutgoing) {
        btns += `<button class="confirm-modal-btn danger" onclick="confirmDelete('everyone')">Delete for everyone</button>`;
      }
      btns += `<button class="confirm-modal-btn" onclick="confirmDelete('me')">Delete for me</button>`;
      btns += `<button class="confirm-modal-btn cancel" onclick="closeDeleteConfirm()">Cancel</button>`;
      box.innerHTML = `<div class="confirm-modal-title">Delete message?</div>${btns}`;
      document.getElementById('deleteConfirmOverlay').classList.add('active');
    }

    function closeDeleteConfirm() {
      document.getElementById('deleteConfirmOverlay').classList.remove('active');
    }

    function confirmDelete(scope) {
      const id = contextMenuTargetId;
      closeDeleteConfirm();
      if (!id) return;
      const msg = messages[id];
      if (!msg) return;

      if (scope === 'me') {
        // Only removes it from this device's view — doesn't touch anyone else's chat
        const row = getMessageRow(id);
        if (row) row.remove();
        delete messages[id];
        return;
      }

      // Delete for everyone: replace the bubble with a placeholder, stamped with the deletion time
      msg.deletedFor = 'everyone';
      msg.deletedAt = getTimeString();
      const row = getMessageRow(id);
      if (!row) return;
      const bubble = row.querySelector('.msg-bubble');
      if (!bubble) return;
      bubble.className = 'msg-bubble deleted-bubble ' + (msg.isOutgoing ? 'outgoing' : 'incoming');
      bubble.innerHTML = `<span class="message-text">This message was deleted</span><span class="msg-meta-row">${msg.deletedAt}</span>`;
    }

    // ---------- Copy ----------

    function copyMessageText(id) {
      closeMsgContextMenu();
      const msg = messages[id];
      if (!msg || msg.kind !== 'text') return;
      navigator.clipboard.writeText(msg.text).catch(() => {});
    }

    // ---------- Edit ----------

    function startEdit(id) {
      closeMsgContextMenu();
      const msg = messages[id];
      if (!msg || msg.kind !== 'text') return;
      cancelReply(); // can't be replying and editing at the same time
      editingMessageId = id;
      document.getElementById('editModeBar').classList.add('active');
      const input = document.getElementById('msgInput');
      input.value = msg.text;
      input.focus();
    }

    function cancelEdit() {
      editingMessageId = null;
      document.getElementById('editModeBar').classList.remove('active');
    }

    function applyEdit(id, newText) {
      const msg = messages[id];
      if (!msg || !newText) return;
      msg.text = newText;
      msg.edited = true;
      msg.editedAt = getTimeString();
      const row = getMessageRow(id);
      if (!row) return;
      const bubble = row.querySelector('.msg-bubble');
      const textEl = bubble.querySelector('.message-text');
      if (textEl) textEl.textContent = newText;
      const metaEl = bubble.querySelector('.msg-meta-row');
      if (metaEl) {
        const ticksHtml = msg.isOutgoing ? `<span class="msg-ticks" id="ticks-${id}"></span>` : '';
        metaEl.innerHTML = `<span class="edited-label">Edited</span>${msg.time} ${ticksHtml}`;
        if (msg.isOutgoing) updateTicksUI(id);
      }
    }

    // ---------- Message Info ----------

    function openMsgInfo(id) {
      closeMsgContextMenu();
      const msg = messages[id];
      if (!msg) return;
      const body = document.getElementById('msgInfoBody');
      let rows = '';
      if (msg.isOutgoing) {
        if (msg.status === 'read') {
          rows += `<div class="msg-info-row"><span class="msg-ticks status-read">${TICK_DOUBLE_SVG}</span><span class="msg-info-row-label">Read</span><span class="msg-info-row-time">${msg.readAt || msg.time}</span></div>`;
        }
        rows += `<div class="msg-info-row"><span class="msg-ticks status-delivered">${TICK_DOUBLE_SVG}</span><span class="msg-info-row-label">Delivered</span><span class="msg-info-row-time">${msg.time}</span></div>`;
        rows += `<div class="msg-info-row"><span class="msg-ticks status-sent">${TICK_SINGLE_SVG}</span><span class="msg-info-row-label">Sent</span><span class="msg-info-row-time">${msg.time}</span></div>`;
      } else {
        rows += `<div class="msg-info-row"><span class="msg-info-row-label">Received from John</span><span class="msg-info-row-time">${msg.time}</span></div>`;
      }
      body.innerHTML = rows;
      document.getElementById('msgInfoOverlay').classList.add('active');
    }

    function closeMsgInfo() {
      document.getElementById('msgInfoOverlay').classList.remove('active');
    }

    // ---------- React / Emoji picker (shared bar: reacting to a message, or inserting into the composer) ----------

    const REACT_EMOJIS = ['👍', '❤️', '😂', '😮', '😢', '🙏'];
    let quickBarMode = 'react'; // 'react' -> reacts to reactTargetId | 'insert' -> inserts into the message input

    function openReactBarFromMenu(id) {
      closeMsgContextMenu();
      const row = getMessageRow(id);
      if (!row) return;
      const bubble = row.querySelector('.msg-bubble');
      const rect = bubble.getBoundingClientRect();
      quickBarMode = 'react';
      reactTargetId = id;
      openReactBar(rect.left, rect.top - 50);
    }

    function toggleComposerEmojiPicker(event) {
      event.stopPropagation();
      const bar = document.getElementById('reactQuickBar');
      if (bar.classList.contains('active') && quickBarMode === 'insert') {
        closeReactBar();
        return;
      }
      quickBarMode = 'insert';
      reactTargetId = null;
      const btnRect = event.currentTarget.getBoundingClientRect();
      openReactBar(btnRect.left, btnRect.top - 54);
    }

    function openReactBar(x, y) {
      const bar = document.getElementById('reactQuickBar');
      bar.innerHTML = REACT_EMOJIS.map(e => `<button class="react-emoji-btn" onclick="handleQuickBarEmojiPick('${e}')">${e}</button>`).join('');
      bar.style.left = '-9999px';
      bar.style.top = '-9999px';
      bar.classList.add('active');
      const rect = bar.getBoundingClientRect();
      const left = Math.max(8, Math.min(x, window.innerWidth - rect.width - 8));
      const top = Math.max(8, y);
      bar.style.left = left + 'px';
      bar.style.top = top + 'px';
    }

    function closeReactBar() {
      document.getElementById('reactQuickBar').classList.remove('active');
    }

    window.addEventListener('click', function(e) {
      const bar = document.getElementById('reactQuickBar');
      if (bar.classList.contains('active') && !bar.contains(e.target)) {
        closeReactBar();
      }
    });

    function handleQuickBarEmojiPick(emoji) {
      if (quickBarMode === 'insert') {
        insertEmojiIntoInput(emoji);
      } else if (reactTargetId) {
        applyReaction(reactTargetId, emoji);
      }
    }

    function insertEmojiIntoInput(emoji) {
      const input = document.getElementById('msgInput');
      const start = (typeof input.selectionStart === 'number') ? input.selectionStart : input.value.length;
      const end = (typeof input.selectionEnd === 'number') ? input.selectionEnd : input.value.length;
      input.value = input.value.slice(0, start) + emoji + input.value.slice(end);
      const newPos = start + emoji.length;
      closeReactBar();
      input.focus();
      input.setSelectionRange(newPos, newPos);
    }

    function applyReaction(id, emoji) {
      closeReactBar();
      const msg = messages[id];
      if (!msg) return;
      msg.reaction = (msg.reaction === emoji) ? null : emoji; // clicking the same emoji again removes it
      const row = getMessageRow(id);
      if (!row) return;
      const bubble = row.querySelector('.msg-bubble');
      let badge = bubble.querySelector('.msg-reaction-badge');
      if (msg.reaction) {
        if (!badge) {
          badge = document.createElement('span');
          badge.className = 'msg-reaction-badge';
          badge.title = 'Click to remove';
          bubble.appendChild(badge);
        }
        badge.textContent = msg.reaction;
        badge.onclick = (ev) => { ev.stopPropagation(); applyReaction(id, msg.reaction); };
      } else if (badge) {
        badge.remove();
      }
    }
  </script>
</body>
</html>
