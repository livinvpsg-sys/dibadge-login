      return [{ name: 'Recent', icon: '🕓', emojis: emojiRecents.slice() }, ...EMOJI_CATEGORIES];
    }

    function openEmojiPickerPanel(x, y, mode) {
      emojiPickerMode = mode;
      emojiPickerActiveCategory = emojiRecents.length > 0 ? 0 : 1;
      renderEmojiPickerTabs();
      renderEmojiPickerGrid();
      const panel = document.getElementById('emojiPickerPanel');
      panel.style.left = '-9999px';
      panel.style.top = '-9999px';
      panel.classList.add('active');
      const rect = panel.getBoundingClientRect();
      const left = Math.max(8, Math.min(x, window.innerWidth - rect.width - 8));
      const top = Math.max(8, Math.min(y, window.innerHeight - rect.height - 8));
      panel.style.left = left + 'px';
      panel.style.top = top + 'px';
    }

    function closeEmojiPickerPanel() {
      document.getElementById('emojiPickerPanel').classList.remove('active');
      commitEmojiRecents(); // flush this session's picks to storage, same as the Kotlin commitRecents()
    }

    window.addEventListener('click', function(e) {
      const panel = document.getElementById('emojiPickerPanel');
      if (panel.classList.contains('active') && !panel.contains(e.target)) {
        closeEmojiPickerPanel();
      }
    });

      const cats = getEmojiPickerCategories();
      document.getElementById('emojiPickerTabs').innerHTML = cats.map((cat, i) =>
        `<button class="emoji-picker-tab-btn${i === emojiPickerActiveCategory ? ' active' : ''}" onclick="selectEmojiPickerCategory(${i})" title="${cat.name}">${cat.icon}</button>`
      ).join('');
    }

      emojiPickerActiveCategory = i;
      renderEmojiPickerTabs();
      renderEmojiPickerGrid();

      const grid = document.getElementById('emojiPickerGrid');
      if (!cat || !cat.emojis || cat.emojis.length === 0) {
        grid.innerHTML = `<div class="emoji-picker-empty-hint">No recent emojis yet</div>`;
        return;
      }
      grid.innerHTML = cat.emojis.map(e => `<button class="emoji-grid-btn" onclick="handleEmojiPickerPick('${e}')">${e}</button>`).join('');
    }

    function handleEmojiPickerPick(emoji) {
      recordEmojiUsage(emoji);
      if (emojiPickerMode === 'insert') {
        insertEmojiIntoInput(emoji);
        closeEmojiPickerPanel();
      } else if (emojiPickerMode === 'react' && reactTargetId) {
        applyReaction(reactTargetId, emoji);
        closeEmojiPickerPanel();
      }
    }

    function insertEmojiIntoInput(emoji) {
      const input = document.getElementById('msgInput');
      const start = (typeof input.selectionStart === 'number') ? input.selectionStart : input.value.length;
      const end = (typeof input.selectionEnd === 'number') ? input.selectionEnd : input.value.length;
      input.value = input.value.slice(0, start) + emoji + input.value.slice(end);
      const newPos = start + emoji.length;
      input.focus();
      input.setSelectionRange(newPos, newPos);
    }

    // Composer's emoji button opens the full picker directly (typing benefits from the full palette)
    function toggleComposerEmojiPicker(event) {
      event.stopPropagation();
      const panel = document.getElementById('emojiPickerPanel');
      if (panel.classList.contains('active') && emojiPickerMode === 'insert') {
        closeEmojiPickerPanel();
        return;
      }
      const btnRect = event.currentTarget.getBoundingClientRect();
      openEmojiPickerPanel(btnRect.left, btnRect.top - 366, 'insert');
    }

    // ---------- Reaction mini-bar: 5 quick emojis + a "+" that opens the full picker ----------

    const QUICK_REACT_EMOJIS = ['👍', '❤️', '😂', '😮', '😢'];

    function quickReactOpen(event, id) {
      event.stopPropagation();
      closeMsgContextMenu();
      const msg = messages[id];
      if (!msg || msg.deletedFor === 'everyone') return;
      reactTargetId = id;
      const btnRect = event.currentTarget.getBoundingClientRect();
      openQuickReactMiniBar(btnRect.left, btnRect.top - 46);
    }

    function openQuickReactMiniBar(x, y) {
      const bar = document.getElementById('reactQuickBar');
      bar.innerHTML = QUICK_REACT_EMOJIS.map(e => `<button class="react-emoji-btn" onclick="handleQuickBarEmojiPick('${e}')">${e}</button>`).join('')
        + `<button class="react-emoji-btn react-emoji-plus-btn" onclick="openFullPickerFromMiniBar(event)" title="More emojis">+</button>`;
      bar.style.left = '-9999px';
      bar.style.top = '-9999px';
      bar.classList.add('active');
      const rect = bar.getBoundingClientRect();
      const left = Math.max(8, Math.min(x, window.innerWidth - rect.width - 8));
      const top = Math.max(8, y);
      bar.style.left = left + 'px';
      bar.style.top = top + 'px';
    }

    function closeReactBar() {
      document.getElementById('reactQuickBar').classList.remove('active');
    }

    window.addEventListener('click', function(e) {
      const bar = document.getElementById('reactQuickBar');
      if (bar.classList.contains('active') && !bar.contains(e.target)) {
        closeReactBar();
      }
    });

    function openFullPickerFromMiniBar(event) {
      event.stopPropagation();
      const btnRect = event.currentTarget.getBoundingClientRect();
      closeReactBar();
      openEmojiPickerPanel(btnRect.left, btnRect.top - 366, 'react');
    }

    function handleQuickBarEmojiPick(emoji) {
      if (!reactTargetId) return;
      recordEmojiUsage(emoji);
      applyReaction(reactTargetId, emoji);
      commitEmojiRecents();
    }

    function applyReaction(id, emoji) {
      closeReactBar();
      const msg = messages[id];
      if (!msg) return;
      msg.reaction = (msg.reaction === emoji) ? null : emoji; // clicking the same emoji again removes it
      const row = getMessageRow(id);
      if (!row) return;
      const bubble = row.querySelector('.msg-bubble');
      let badge = bubble.querySelector('.msg-reaction-badge');
      if (msg.reaction) {
        if (!badge) {
          badge = document.createElement('span');
          badge.className = 'msg-reaction-badge';
          badge.title = 'Click to remove';
          bubble.appendChild(badge);
        }
        badge.textContent = msg.reaction;
        badge.onclick = (ev) => { ev.stopPropagation(); applyReaction(id, msg.reaction); };
      } else if (badge) {
        badge.remove();
      }
    }
  </script>
</body>
</html>
