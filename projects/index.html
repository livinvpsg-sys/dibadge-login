<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>diBadge | Projects</title>

  <script>
    (function() {
      const savedTheme = localStorage.getItem('dibadge_web_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>

  <style>
    :root {
      --jet-black: #0f0f0f;
      --paper-white: #f8f9fa;
      --slate-surface: #1e1e1e;
      --accent-white: #ffffff;
      --muted-gray: #8e8e93;
      --cool-ash: #a1a1a6;
      --soft-border: #e5e5ea;
      --error-red: #ff3b30;

      --bg-color: var(--paper-white);
      --text-color: var(--jet-black);
      --surface-color: var(--accent-white);
      --header-bg: var(--paper-white);
      --tabbar-bg: var(--paper-white);
      --border-color: var(--soft-border);
      --subtext-color: var(--cool-ash);
    }

    [data-theme="dark"] {
      --bg-color: var(--jet-black);
      --text-color: var(--accent-white);
      --surface-color: var(--slate-surface);
      --header-bg: #050505;
      --tabbar-bg: #050505;
      --border-color: #2c2c2e;
      --subtext-color: var(--muted-gray);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    #authGate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--jet-black); display: flex; justify-content: center; align-items: center; z-index: 1000; color: var(--accent-white); font-size: 0.9rem; }

    /* Header Line */
    .dashboard-header { background: var(--header-bg); color: var(--text-color); padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 64px; flex-shrink: 0; border-bottom: 1px solid var(--border-color); }
    .header-left { display: flex; align-items: center; gap: 12px; }
     
    .default-header-title { display: flex; align-items: center; gap: 12px; }
    .default-header-title h1 { font-size: 1.25rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .year-select { background: var(--surface-color); color: var(--text-color); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 6px; font-size: 0.88rem; font-weight: 600; outline: none; }

    /* Header Breadcrumb Navigation */
    .folder-header-nav { display: none; align-items: center; gap: 12px; font-size: 1.05rem; font-weight: 600; }
    .header-back-icon { background: transparent; border: none; color: var(--text-color); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; border-radius: 6px; transition: background 0.15s; }
    .header-back-icon:hover { background: var(--surface-color); color: var(--paper-white); }
    .header-breadcrumb-path { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .breadcrumb-item { cursor: pointer; color: var(--paper-white); text-decoration: none; }
    .breadcrumb-item:hover { text-decoration: underline; }
    .breadcrumb-item.active { color: var(--text-color); cursor: default; text-decoration: none; }

    .header-center { flex: 1; max-width: 450px; margin: 0 20px; display: flex; align-items: center; gap: 12px; }
    .search-input { flex: 1; background: var(--surface-color); color: var(--text-color); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 20px; font-size: 0.88rem; outline: none; }
    .search-input::placeholder { color: var(--subtext-color); }

    /* Header View Mode Controls */
    .view-mode-toggle { display: flex; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 2px; }
    .view-btn { background: transparent; border: none; color: var(--subtext-color); padding: 6px 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
    .view-btn svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; }
    .view-btn.active { background: var(--paper-white); color: var(--jet-black); }

    .dashboard-body-split { display: flex; flex: 1; height: calc(100vh - 64px); overflow: hidden; position: relative; }

    /* Left Navigation Bar */
    .left-vertical-tabbar { width: 64px; background: var(--tabbar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; padding: 16px 0; z-index: 10; }
    .tab-btn { width: 44px; height: 44px; border-radius: 10px; background: transparent; border: none; color: var(--subtext-color); display: flex; justify-content: center; align-items: center; margin-bottom: 10px; text-decoration: none; cursor: pointer; transition: all 0.2s; }
    .tab-btn svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .tab-btn:hover { background: var(--slate-surface); color: #ffffff; }
    .tab-btn.active { background: var(--slate-surface); color: #ffffff; }

    .main-nav-group, .project-sub-nav { display: flex; flex-direction: column; align-items: center; width: 100%; }
    .project-sub-nav { display: none; }

    .fab-tab-btn { margin-top: auto; background: var(--paper-white); color: var(--jet-black); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); cursor: pointer; display: flex; }
    .fab-tab-btn:hover { opacity: 0.9; transform: scale(1.05); }

    /* Center Projects Grid Workspace */
    .tiles-wrapper { flex: 1; display: flex; justify-content: flex-start; align-items: flex-start; padding: 24px; overflow-y: auto; position: relative; background: var(--bg-color); }
    .tiles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 16px; width: 100%; justify-items: start; }

    .tile { position: relative; width: 100%; max-width: 140px; aspect-ratio: 1 / 1; border-radius: 10px; padding: 12px 8px; display: flex; flex-direction: column; justify-content: space-between; align-items: stretch; background-color: var(--surface-color); border: 1px solid var(--border-color); color: var(--text-color); cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); user-select: none; }
    .tile:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); border-color: var(--paper-white); }

    .tile-avatar-center { flex: 1; display: flex; justify-content: center; align-items: center; }
    .tile-letter-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--border-color); color: var(--text-color); font-size: 1.1rem; font-weight: 800; display: flex; justify-content: center; align-items: center; }
     
    .tile-content-bottom { display: flex; flex-direction: column; gap: 1px; width: 100%; text-align: center; }
    .tile-client-name { font-size: 0.8rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.2px; }
    .tile-project-no { font-size: 0.68rem; color: var(--subtext-color); font-weight: 600; text-transform: uppercase; }

    .projects-list-table { width: 100%; border-collapse: collapse; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; }
    .projects-list-table th { background: var(--header-bg); color: var(--subtext-color); text-align: left; padding: 12px 16px; font-size: 0.82rem; text-transform: uppercase; border-bottom: 1px solid var(--border-color); }
    .projects-list-table td { padding: 12px 16px; border-bottom: 1px solid var(--border-color); font-size: 0.88rem; color: var(--text-color); cursor: pointer; }
    .projects-list-table tr:hover td { background: var(--border-color); }

    /* Folder Explorer View Workspace */
    .folder-explorer-view { display: none; flex: 1; flex-direction: column; height: 100%; padding: 24px; overflow-y: auto; background: var(--bg-color); position: relative; }
     
    .project-meta-banner { background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 10px; padding: 14px 18px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 4px; position: relative; }
    .project-meta-line1 { display: flex; align-items: center; gap: 10px; font-size: 0.98rem; font-weight: 700; color: var(--text-color); }
    .project-meta-badge { font-size: 0.72rem; font-weight: 600; background: var(--border-color); color: var(--text-color); padding: 2px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px; }

    .edit-meta-btn { background: transparent; border: none; color: var(--subtext-color); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; border-radius: 6px; transition: color 0.15s, background 0.15s; margin-left: 4px; }
    .edit-meta-btn:hover { color: var(--paper-white); background: var(--border-color); }
    .edit-meta-btn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    .project-meta-line2 { font-size: 0.82rem; color: var(--subtext-color); font-weight: 500; display: flex; align-items: center; gap: 6px; }
    .project-meta-line3 { font-size: 0.82rem; color: var(--text-color); opacity: 0.9; margin-top: 2px; line-height: 1.3; }

    .folder-contents-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 16px; width: 100%; justify-items: start; min-height: 300px; }

    .folder-card { background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; transition: transform 0.15s, border-color 0.15s, background 0.15s; user-select: none; width: 100%; max-width: 140px; aspect-ratio: 1 / 1; justify-content: space-between; }
    .folder-card:hover { transform: translateY(-3px); }
    .folder-card svg { width: 46px; height: 46px; stroke: var(--text-color); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; margin-top: 4px; }
    .folder-name { font-size: 0.8rem; font-weight: 600; color: var(--text-color); word-break: break-word; line-height: 1.2; }
    .folder-items-count { font-size: 0.68rem; color: var(--subtext-color); }

    .underline-modal-input { width: 100%; padding: 8px 2px; border: none; border-bottom: 1px solid var(--border-color); background: transparent; color: var(--text-color); border-radius: 0; font-size: 0.9rem; outline: none; transition: border-color 0.15s; }
    .underline-modal-input:focus { border-bottom-color: var(--paper-white); }
    textarea.underline-modal-input { resize: vertical; min-height: 50px; font-family: inherit; }

    /* Sub-view Panels */
    .sub-view-panel { display: none; flex: 1; padding: 24px; color: var(--text-color); overflow-y: auto; background: var(--bg-color); }
    .sub-view-panel.active { display: block; }

    /* Forms tab: demo form templates for this project */
    .forms-panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .forms-panel-header h2 { font-size: 1.05rem; font-weight: 700; }
    .forms-add-btn { background: var(--surface-color); border: 1px solid var(--border-color); color: var(--text-color); padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    .forms-add-btn:hover { background: var(--border-color); }
    .forms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
    .form-card { background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 16px 12px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; cursor: pointer; transition: transform 0.15s, background 0.15s; }
    .form-card:hover { transform: translateY(-3px); background: rgba(255,255,255,0.05); }
    .form-card svg { width: 40px; height: 40px; stroke: var(--text-color); fill: none; stroke-width: 1.6; }
    .form-card-name { font-size: 0.82rem; font-weight: 600; color: var(--text-color); line-height: 1.25; word-break: break-word; }

    /* List-view row for forms, used when the header's list toggle is active */
    .form-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 8px; cursor: pointer; transition: background 0.15s; }
    .form-row:hover { background: rgba(255,255,255,0.05); }
    .form-row svg { width: 22px; height: 22px; stroke: var(--text-color); fill: none; stroke-width: 1.6; flex-shrink: 0; }
    .form-row-name { font-size: 0.88rem; font-weight: 600; color: var(--text-color); }
    .forms-list-container { display: flex; flex-direction: column; gap: 2px; }

    /* Standard Modals */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 15, 15, 0.75); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 100; }
    .modal-card { background: var(--surface-color); padding: 28px; border-radius: 12px; text-align: left; max-width: 480px; width: 90%; position: relative; color: var(--text-color); border: 1px solid var(--border-color); }
    .modal-card h3 { text-align: center; margin-bottom: 16px; font-size: 1.1rem; }
    .modal-label { display: block; font-size: 0.82rem; color: var(--subtext-color); margin: 10px 0 4px 0; font-weight: 600; }
    .modal-input { width: 100%; padding: 10px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); border-radius: 6px; font-size: 0.9rem; outline: none; }
    textarea.modal-input { resize: vertical; min-height: 65px; font-family: inherit; }

    .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
    .modal-btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .btn-save { background: var(--paper-white); color: var(--jet-black); }
    .btn-cancel { background: var(--border-color); color: var(--text-color); }
    .close-btn { position: absolute; top: 14px; right: 14px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--subtext-color); }

    /* Context Menus */
    .context-menu { position: absolute; z-index: 1000; width: 150px; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); display: none; flex-direction: column; padding: 4px 0; }
    .context-menu-item { padding: 8px 16px; font-size: 0.85rem; color: var(--text-color); cursor: pointer; display: flex; align-items: center; gap: 10px; font-weight: 500; transition: background 0.15s; }
    .context-menu-item:hover { background: var(--paper-white); color: var(--jet-black); }
    .context-menu-item.danger:hover { background: var(--error-red); color: white; }
    .context-menu-divider { height: 1px; background: var(--border-color); margin: 4px 0; }

    @media (max-width: 1024px) { .activity-feed-panel { display: none; } }

    /* Activity Feed — ported exactly from the chat screen, so it's one shared design, not a duplicate */
    .activity-feed-panel {
      width: 300px;
      flex-shrink: 0;
      background: var(--surface-color);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      padding: 16px;
      height: 100%;
    }
    .details-panel-section-header { display: flex; align-items: center; justify-content: space-between; }
    .details-panel-title-group { display: flex; align-items: center; gap: 8px; }
    .details-panel-title-group svg { width: 16px; height: 16px; stroke: var(--subtext-color); stroke-width: 2; fill: none; flex-shrink: 0; }
    .details-panel-title { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--subtext-color); }
    .details-panel-live-dot { width: 8px; height: 8px; border-radius: 50%; background: #25D366; animation: livePulse 1.6s ease-in-out infinite; flex-shrink: 0; }
    @keyframes livePulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    .activity-feed-card { background: transparent; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; }
    .activity-feed-title { font-size: 0.85rem; font-weight: 700; color: var(--text-color); margin-bottom: 2px; }
    .activity-feed-desc { font-size: 0.78rem; color: var(--subtext-color); line-height: 1.4; }
    .activity-feed-time { font-size: 0.68rem; color: var(--subtext-color); margin-top: 6px; }
    .activity-feed-empty { font-size: 0.78rem; color: var(--subtext-color); padding: 4px 2px; }
  </style>
</head>
<body onclick="hideContextMenus();">

  <div id="authGate">Checking your session…</div>

  <div id="appShell" style="display:none; flex-direction: column; height: 100%;">

  <!-- Header -->
  <header class="dashboard-header">
    <div class="header-left">
      <div class="default-header-title" id="defaultHeaderTitle">
        <h1>
          <svg style="width:24px; height:24px; stroke:currentColor; stroke-width:2; fill:none;" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
          <span>Projects</span>
        </h1>
        <select id="yearPicker" class="year-select" onchange="filterProjects()">
          <option value="2026" selected>2026</option>
          <option value="2025">2025</option>
          <option value="2024">2024</option>
        </select>
      </div>

      <div class="folder-header-nav" id="folderHeaderNav">
        <button class="header-back-icon" onclick="navigateUpBreadcrumb()" title="Go Back">
          <svg style="width:22px; height:22px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </button>
        <div class="header-breadcrumb-path" id="breadcrumbBar"></div>
      </div>
    </div>

    <div class="header-center">
      <input type="text" id="projectSearchInput" class="search-input" placeholder="search projects.." onkeyup="filterProjects()" />
      <div class="view-mode-toggle" id="headerViewToggle">
        <button class="view-btn active" id="btnViewTile" onclick="switchProjectDisplayMode('grid')" title="Tile Grid View">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        </button>
        <button class="view-btn" id="btnViewList" onclick="switchProjectDisplayMode('list')" title="Detailed List View">
          <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
    </div>

    <div style="width: 120px;"></div>
  </header>

  <div class="dashboard-body-split">
    
    <!-- Left Navigation Bar -->
    <aside class="left-vertical-tabbar">
      <div class="main-nav-group" id="mainNavGroup">
        <a href="../home" class="tab-btn" title="Home">
          <svg viewBox="0 0 24 24" style="width: 22px; height: 22px;">
            <path d="M2.768 19.985c0 1.978 1.594 3.584 3.563 3.584h10.615c1.968 0 3.563-1.605 3.563-3.584V10.611c0-1.973-1.596-3.577-3.563-3.577H9.859c-0.463 0-0.899 0.229-1.164 0.62-0.266 0.385-0.323 0.874-0.153 1.311 0.527 1.382 1.85 2.292 3.325 2.292h4.038v7.65H7.857v-6.551c0-0.979-0.401-1.921-1.108-2.598L4.011 7.199c-0.202-0.194-0.502-0.251-0.757-0.136-0.255 0.109-0.418 0.36-0.418 0.641v11.691zM7.897 0.669c0-0.204-0.165-0.365-0.362-0.365H3.163c-0.198 0-0.356 0.161-0.356 0.365v3.995c0 0.199 0.158 0.36 0.356 0.36h4.377c0.197 0 0.362-0.161 0.362-0.36V0.669z" fill="#008080" stroke="none"/>
          </svg>
        </a>

        <button class="tab-btn active" id="btnNavSuitcase" onclick="switchMainViewTab('projects')" title="Projects">
          <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
        </button>

        <button class="tab-btn" id="btnNavForms" onclick="window.location.href='common/forms/' " title="Project forms">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="12" x2="16" y2="12"></line><line x1="8" y1="16" x2="16" y2="16"></line></svg>
        </button>

        <button class="tab-btn" id="btnNavSchedule" onclick="switchMainViewTab('schedule')" title="Schedule">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        </button>
      </div>

      <!-- Project Sub Nav -->
      <div class="project-sub-nav" id="projectSubNav">
        <button class="tab-btn active" id="btnSubFolder" onclick="switchProjectSubTab('folder')" title="Folders & Files">
          <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
        </button>

        <!-- Redirects to separated chat workspace -->
        <button class="tab-btn" id="btnSubChat" onclick="openProjectChat()" title="Chats">
          <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        </button>

        <button class="tab-btn" id="btnSubForms" onclick="switchProjectSubTab('forms')" title="Forms">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="12" x2="16" y2="12"></line><line x1="8" y1="16" x2="16" y2="16"></line></svg>
        </button>

        <!-- Redirects to separated BOQ workspace -->
        <button class="tab-btn" id="btnSubBOQ" onclick="openProjectBOQ()" title="Bill of Quantity (BOQ)">
          <svg viewBox="0 0 24 24"><text x="12" y="16" font-size="11" font-weight="900" text-anchor="middle" fill="currentColor" stroke="none" letter-spacing="0.5px">BOQ</text></svg>
        </button>

        <button class="tab-btn" id="btnSubCompare" onclick="switchProjectSubTab('compare')" title="Expense vs BOQ Comparison">

  <!-- Auth check — must run before any page content or data is shown. Same Firebase project
       as login.html and the rest of diBadge. If there's no signed-in session, this page (and
       all the project data it renders) is skipped entirely and the visitor is sent to login. -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, collection, addDoc, updateDoc, deleteDoc,
      collectionGroup, query, where, getDocs, arrayUnion, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB2unuKGf0MQqxcB78Skh1H9U3ySFj16e0",
      authDomain: "dibadge-fabxdi.firebaseapp.com",
      projectId: "dibadge-fabxdi",
      storageBucket: "dibadge-fabxdi.firebasestorage.app",
      messagingSenderId: "390433769514",
      appId: "1:390433769514:web:10c4fb97906be8690b1b53",
      measurementId: "G-ZJVXLDZPRY"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Exposed so the plain (non-module) script below — which holds all the existing UI
    // logic — can read/write Firestore without this whole file becoming one giant module.
    window.dbFns = { db, doc, getDoc, collection, addDoc, updateDoc, deleteDoc, query, where, getDocs, arrayUnion, serverTimestamp };

    onAuthStateChanged(auth, async function(user) {
      const gate = document.getElementById('authGate');
      if (!user) {
        window.location.href = '../login/';
        return;
      }

      window.currentUid = user.uid;
      const userSnap = await getDoc(doc(db, 'users', user.uid));
      const userData = userSnap.exists() ? userSnap.data() : null;

      if (userData && userData.accountType === 'organisation_creator') {
        window.currentOrgId = userData.organisationId;
      } else {
        // Not the creator — check for delegated Projects-tile access as a verified member.
        // Requires a Firestore index on the 'members' collection group for
        // (uid, tileAccess.projects); the console will show a link to create it if missing.
        try {
          const q = query(
            collectionGroup(db, 'members'),
            where('uid', '==', user.uid),
            where('tileAccess.projects', '==', true)
          );
          const snap = await getDocs(q);
          if (!snap.empty) {
            window.currentOrgId = snap.docs[0].ref.parent.parent.id;
          }
        } catch (err) {
          // No access — currentOrgId stays unset, handled below.
        }
      }

      // Resolve who counts as this org's "always has access" people — the true creator,
      // plus any current Super Admins — so new projects can start with them included,
      // alongside whoever actually creates the project (that project's admin).
      if (window.currentOrgId) {
        try {
          const orgSnap = await getDoc(doc(db, 'organisations', window.currentOrgId));
          window.currentOrgCreatorUid = orgSnap.exists() ? orgSnap.data().creatorUid : null;

          const superAdminSnap = await getDocs(query(
            collection(db, 'organisations', window.currentOrgId, 'members'),
            where('isSuperAdmin', '==', true)
          ));
          window.currentOrgSuperAdminUids = superAdminSnap.docs.map(d => d.id);
        } catch (err) {
          window.currentOrgCreatorUid = null;
          window.currentOrgSuperAdminUids = [];
        }
      }

      gate.style.display = 'none';
      document.getElementById('appShell').style.display = 'flex';

      if (!window.currentOrgId) {
        document.getElementById('projectDisplayContainer').innerHTML =
          `<div style="color: var(--subtext-color); margin-top: 40px; text-align: center;">You don't have access to Projects.</div>`;
        return;
      }

      if (typeof window.initProjectsApp === 'function') window.initProjectsApp();
    });
  </script>

 <script>
    let activeOpenedProject = null;
    let folderObjectStack = [];
    let activeViewMode = 'projects';
    let currentProjectDisplayMode = 'grid';

    function getDefaultSubFolders() {
      return [
        { id: 'f-1', name: 'Site Photos & diCam', items: '1 Files', children: [], files: ['sample_site_record.jpg'] },
        { id: 'f-2', name: 'Safety & Compliance Logs', items: '0 Files', children: [], files: [] },
        { id: 'f-3', name: 'Reports & Worksheets', items: '0 Files', children: [], files: [] },
        { id: 'f-4', name: 'Drawings & Blueprints', items: '0 Files', children: [], files: [] }
      ];
    }

    // Demo form templates seeded for every project. Stored to localStorage per-project so the
    // project's own Chat screen (a separate page) can read the SAME real list for its Import
    // modal, instead of a made-up placeholder list.
    function getDefaultForms() {
      return [
        'Tower B Foundation Log Sheet',
        'Daily Site Inspection Form',
        'Safety Compliance Checklist',
        'Material Delivery Record'
      ];
    }

    function formsStorageKey(projectId) {
      return 'dibadge_project_forms_' + projectId;
    }

    function getProjectForms(projectId) {
      const stored = localStorage.getItem(formsStorageKey(projectId));
      if (!stored) return null;
      try { return JSON.parse(stored); } catch (e) { return null; }
    }

    function saveProjectForms(projectId, forms) {
      localStorage.setItem(formsStorageKey(projectId), JSON.stringify(forms));
    }

    // Ensures every project has a forms list in storage (seeding the demo set the first time).
    function ensureProjectFormsSeeded(projectId) {
      if (getProjectForms(projectId) === null) {
        saveProjectForms(projectId, getDefaultForms());
      }
    }

    // In-memory cache of "my projects" (fetched from Firestore, filtered to this
    // organisation), so the UI can filter/search synchronously without re-querying
    // on every keystroke. Refreshed via loadProjects() after any write.
    let myProjectsCache = [];

    async function loadProjects() {
      const { db, collection, query, where, getDocs } = window.dbFns;
      const q = query(collection(db, 'projects'), where('members', 'array-contains', window.currentUid));
      const snap = await getDocs(q);
      myProjectsCache = snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .filter(p => p.organisationId === window.currentOrgId);
      filterProjects();
    }

    function getProjects() {
      return myProjectsCache;
    }

    async function createProject(newProjData) {
      const { db, collection, addDoc, serverTimestamp } = window.dbFns;
      // Initial members: whoever actually creates the project (its "project admin"),
      // the organisation's true creator, and any current Super Admins — all three
      // get access from the moment the project exists, per how this app is designed.
      const initialMembers = Array.from(new Set([
        window.currentUid,
        window.currentOrgCreatorUid,
        ...(window.currentOrgSuperAdminUids || [])
      ].filter(Boolean)));

      const docRef = await addDoc(collection(db, 'projects'), {
        ...newProjData,
        organisationId: window.currentOrgId,
        creatorUid: window.currentUid, // this project's admin
        members: initialMembers,
        createdAt: serverTimestamp()
      });
      ensureProjectFormsSeeded(docRef.id);
      await loadProjects();
    }

    // Passes project ID to chat folder
    function openProjectChat() {
      if (!activeOpenedProject) return;
      window.location.href = `modules/chat/?id=${activeOpenedProject.id}`;
    }

    // Passes project ID to BOQ folder
    function openProjectBOQ() {
      if (!activeOpenedProject) return;
      window.location.href = `boq/index.html?id=${activeOpenedProject.id}`;
    }

    function switchProjectDisplayMode(mode) {
      currentProjectDisplayMode = mode;
      document.getElementById("btnViewTile").classList.toggle("active", mode === 'grid');
      document.getElementById("btnViewList").classList.toggle("active", mode === 'list');
      if (activeOpenedProject && activeViewMode === 'folder') renderFolderView();
      else if (activeOpenedProject && activeViewMode === 'forms') renderFormsPanel();
      else filterProjects();
    }

    // Shared by both the main-screen "Project Forms" library and a specific project's own
    // Forms tab — renders as a card grid or a list, depending on the header's view toggle, and
    // each entry opens that form in its own separate file (forms/index.html) when clicked.
    function renderFormEntries(containerEl, forms) {
      if (currentProjectDisplayMode === 'list') {
        containerEl.className = 'forms-list-container';
        containerEl.innerHTML = forms.map(name => `
          <div class="form-row" title="${name}" onclick="openFormFile('${name.replace(/'/g, "\\'")}')">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="12" x2="16" y2="12"></line><line x1="8" y1="16" x2="16" y2="16"></line></svg>
            <span class="form-row-name">${name}</span>
          </div>
        `).join('');
      } else {
        containerEl.className = 'forms-grid';
        containerEl.innerHTML = forms.map(name => `
          <div class="form-card" title="${name}" onclick="openFormFile('${name.replace(/'/g, "\\'")}')">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="12" x2="16" y2="12"></line><line x1="8" y1="16" x2="16" y2="16"></line></svg>
            <div class="form-card-name">${name}</div>
          </div>
        `).join('');
      }
    }

    // Opens the clicked form in its own separate file, passing which form + which project
    // (if any) it was opened from.
    function openFormFile(formName) {
      const projectPart = activeOpenedProject ? `&projectId=${encodeURIComponent(activeOpenedProject.id)}` : '';
      window.location.href = `common/forms/index.html?name=${encodeURIComponent(formName)}${projectPart}`;
    }

    function filterProjects() {
      const selectedYear = document.getElementById("yearPicker").value;
      const searchQuery = document.getElementById("projectSearchInput").value.toLowerCase().trim();
      const displayContainer = document.getElementById("projectDisplayContainer");
      if (!displayContainer) return;
      displayContainer.innerHTML = "";

      const filtered = getProjects().filter(p => p.year === selectedYear && (p.client.toLowerCase().includes(searchQuery) || p.projectNo.toLowerCase().includes(searchQuery)));

      if (filtered.length === 0) {
        displayContainer.innerHTML = `<div style="color: var(--subtext-color); margin-top: 40px; text-align: center;">No projects found.</div>`;
        return;
      }

      const grid = document.createElement("div");
      grid.className = "tiles-grid";
      filtered.forEach(proj => {
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.innerHTML = `
          <div class="tile-avatar-center"><div class="tile-letter-avatar">${proj.client.charAt(0).toUpperCase()}</div></div>
          <div class="tile-content-bottom"><div class="tile-client-name">${proj.client}</div><div class="tile-project-no">${proj.projectNo}</div></div>
        `;
        tile.onclick = () => openProjectFolder(proj);
        grid.appendChild(tile);
      });
      displayContainer.appendChild(grid);
    }

    function switchMainViewTab(tabKey) {
      activeViewMode = tabKey;
      document.getElementById("mainGridWorkspace").style.display = tabKey === 'projects' ? "flex" : "none";
      ['btnNavSuitcase', 'btnNavForms', 'btnNavSchedule'].forEach(id => {
        const btn = document.getElementById(id);
        if (btn) btn.classList.remove('active');
      });
      const activeBtnId = { projects: 'btnNavSuitcase', schedule: 'btnNavSchedule' }[tabKey];
      if (activeBtnId) {
        const btn = document.getElementById(activeBtnId);
        if (btn) btn.classList.add('active');
      }
      if (tabKey === 'projects') filterProjects();
    }

    function openProjectFolder(proj) {
      activeOpenedProject = proj;
      folderObjectStack = [proj];
      activeViewMode = 'folder';

      ensureProjectFormsSeeded(proj.id);

      document.getElementById("mainNavGroup").style.display = "none";
      document.getElementById("projectSubNav").style.display = "flex";
      document.getElementById("defaultHeaderTitle").style.display = "none";
      document.getElementById("folderHeaderNav").style.display = "flex";
      document.getElementById("projectSearchInput").style.display = "none";
      document.getElementById("mainGridWorkspace").style.display = "none";

      switchProjectSubTab('folder');
    }

    function switchProjectSubTab(tabKey) {
      activeViewMode = tabKey;
      document.getElementById("folderExplorerWorkspace").style.display = tabKey === 'folder' ? "flex" : "none";
      document.getElementById("formsSubPanel").classList.toggle("active", tabKey === 'forms');
      if (tabKey === 'folder') renderFolderView();
      if (tabKey === 'forms') renderFormsPanel();

      ['btnSubFolder', 'btnSubForms', 'btnSubBOQ', 'btnSubCompare', 'btnSubClaims', 'btnSubSchedule'].forEach(id => {
        const btn = document.getElementById(id);
        if (btn) btn.classList.remove('active');
      });
      const activeBtnId = { folder: 'btnSubFolder', forms: 'btnSubForms', compare: 'btnSubCompare', claims: 'btnSubClaims', schedule: 'btnSubSchedule' }[tabKey];
      if (activeBtnId) {
        const activeBtn = document.getElementById(activeBtnId);
        if (activeBtn) activeBtn.classList.add('active');
      }
    }

    function renderFormsPanel() {
      if (!activeOpenedProject) return;
      const grid = document.getElementById("formsGrid");
      const forms = getProjectForms(activeOpenedProject.id) || getDefaultForms();
      renderFormEntries(grid, forms);
    }

    function openAddFormModal() {
      document.getElementById('newFormNameInput').value = '';
      document.getElementById('addFormModal').style.display = 'flex';
    }

    function closeAddFormModal() {
      document.getElementById('addFormModal').style.display = 'none';
    }

    function confirmAddForm() {
      if (!activeOpenedProject) return;
      const name = document.getElementById('newFormNameInput').value.trim();
      if (!name) return;
      const forms = getProjectForms(activeOpenedProject.id) || getDefaultForms();
      forms.push(name);
      saveProjectForms(activeOpenedProject.id, forms);
      closeAddFormModal();
      renderFormsPanel();
    }

    function getCurrentWorkspaceFolder() {
      return folderObjectStack[folderObjectStack.length - 1];
    }

    function renderFolderView() {
      const breadcrumbContainer = document.getElementById("breadcrumbBar");
      if (!breadcrumbContainer) return;
      breadcrumbContainer.innerHTML = `<span class="breadcrumb-item" onclick="jumpToBreadcrumbIndex(0)">Projects</span>`;

      folderObjectStack.forEach((node, idx) => {
        const isLast = idx === folderObjectStack.length - 1;
        const displayName = node.client ? `${node.client} (${node.projectNo})` : node.name;
        breadcrumbContainer.innerHTML += ` > `;
        breadcrumbContainer.innerHTML += isLast ? `<span class="breadcrumb-item active">${displayName}</span>` : `<span class="breadcrumb-item" onclick="jumpToBreadcrumbIndex(${idx + 1})">${displayName}</span>`;
      });

      const subGrid = document.getElementById("innerFolderGrid");
      subGrid.innerHTML = "";
      const currentFolderNode = getCurrentWorkspaceFolder();

      (currentFolderNode.children || []).forEach(folder => {
        const card = document.createElement("div");
        card.className = "folder-card";
        card.innerHTML = `
          <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
          <div class="folder-name">${folder.name}</div>
          <div class="folder-items-count">${folder.files ? folder.files.length + ' Files' : '0 Files'}</div>
        `;
        card.onclick = () => {
          folderObjectStack.push(folder);
          renderFolderView();
        };
        subGrid.appendChild(card);
      });
    }

    function jumpToBreadcrumbIndex(targetIndex) {
      if (targetIndex === 0) {
        activeOpenedProject = null;
        folderObjectStack = [];
        document.getElementById("projectSubNav").style.display = "none";
        document.getElementById("mainNavGroup").style.display = "flex";
        document.getElementById("folderHeaderNav").style.display = "none";
        document.getElementById("defaultHeaderTitle").style.display = "flex";
        document.getElementById("projectSearchInput").style.display = "";
        document.getElementById("folderExplorerWorkspace").style.display = "none";
        document.getElementById("formsSubPanel").classList.remove("active");
        // Clean URL parameter when going back to main list
        window.history.replaceState({}, document.title, window.location.pathname);
        switchMainViewTab('projects');
      } else {
        folderObjectStack = folderObjectStack.slice(0, targetIndex);
        switchProjectSubTab('folder');
      }
    }

    function navigateUpBreadcrumb() {
      jumpToBreadcrumbIndex(folderObjectStack.length - 1);
    }

    async function handleFabClick() {
      if (activeViewMode === 'projects') {
        const client = prompt("Enter Client Name:");
        if (!client) return;
        const newProj = {
          client: client,
          projectNo: `PRJ-2026-${Math.floor(100 + Math.random() * 900)}`,
          location: 'Main Site',
          remarks: 'Newly added project',
          year: document.getElementById("yearPicker").value,
          children: getDefaultSubFolders()
        };
        await createProject(newProj);
      }
    }

    function hideContextMenus() {}
    function confirmDeleteProjectAction() {}
    function closeCustomDeleteProjectModal() {}

    // ===================== Project members: add org-verified people to a project =====================
    // Any current member of a project can add another person already verified by the
    // organisation (organisations/{orgId}/members). Adding someone NOT yet verified is a
    // separate join-request flow, not built here.

    async function openProjectMembersModal() {
      if (!activeOpenedProject) return;
      const { db, collection, getDocs } = window.dbFns;
      const modal = document.getElementById('projectMembersModal');
      const listEl = document.getElementById('projectMembersList');
      listEl.innerHTML = `<div style="color: var(--subtext-color); padding: 12px 0;">Loading…</div>`;
      modal.style.display = 'flex';

      try {
        const orgMembersSnap = await getDocs(collection(db, 'organisations', window.currentOrgId, 'members'));
        const currentMembers = new Set(activeOpenedProject.members || []);
        const candidates = [];
        orgMembersSnap.forEach(d => {
          const m = d.data();
          if (!currentMembers.has(m.uid)) candidates.push(m);
        });

        if (candidates.length === 0) {
          listEl.innerHTML = `<div style="color: var(--subtext-color); padding: 12px 0;">Every verified member is already in this project.</div>`;
          return;
        }

        listEl.innerHTML = '';
        candidates.forEach(m => {
          const row = document.createElement('div');
          row.style.cssText = 'display:flex; align-items:center; justify-content:space-between; padding:10px 4px; border-bottom:1px solid var(--border-color);';
          row.innerHTML = `<span>${m.email}</span><button class="modal-btn btn-save" style="width:auto; padding:6px 14px;">Add</button>`;
          row.querySelector('button').onclick = () => addProjectMember(m.uid);
          listEl.appendChild(row);
        });
      } catch (err) {
        listEl.innerHTML = `<div style="color: var(--subtext-color); padding: 12px 0;">Couldn't load organisation members.</div>`;
      }
    }

    function closeProjectMembersModal() {
      document.getElementById('projectMembersModal').style.display = 'none';
    }

    async function addProjectMember(uid) {
      if (!activeOpenedProject) return;
      const { db, doc, updateDoc, arrayUnion } = window.dbFns;
      try {
        await updateDoc(doc(db, 'projects', activeOpenedProject.id), {
          members: arrayUnion(uid)
        });
        activeOpenedProject.members = [...(activeOpenedProject.members || []), uid];
        openProjectMembersModal(); // refresh the candidate list in place
      } catch (err) {
        // Leave the modal as-is; the person can retry.
      }
    }

    // Kicked off once by the auth module script, after currentUid/currentOrgId are known —
    // replaces the old immediately-invoked init(), since project data now loads asynchronously.
    window.initProjectsApp = async function() {
      const urlParams = new URLSearchParams(window.location.search);
      const projectId = urlParams.get('id');

      await loadProjects();

      if (projectId) {
        const matchedProj = myProjectsCache.find(p => p.id === projectId);
        if (matchedProj) {
          openProjectFolder(matchedProj);
          return;
        }
      }
      // Seed forms for every project this user can see, up front, so Chat's Import modal
      // always has data to read even if that project's folder was never opened on this device.
      myProjectsCache.forEach(p => ensureProjectFormsSeeded(p.id));
    };
  </script>
</body>
</html>
