<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>diBadge | Projects</title>

  <!-- Global Theme Pre-loader Script -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('dibadge_web_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>

  <style>
    :root {
      --jet-black: #0f0f0f;
      --paper-white: #f8f9fa;
      --slate-surface: #1e1e1e;
      --accent-white: #ffffff;
      --muted-gray: #8e8e93;
      --cool-ash: #a1a1a6;
      --soft-border: #e5e5ea;
      --accent-blue: #0284c7;

      --bg-color: var(--paper-white);
      --text-color: var(--jet-black);
      --surface-color: var(--accent-white);
      --header-bg: var(--jet-black);
      --tabbar-bg: var(--jet-black);
      --border-color: var(--soft-border);
      --subtext-color: var(--cool-ash);
    }

    [data-theme="dark"] {
      --bg-color: var(--jet-black);
      --text-color: var(--accent-white);
      --surface-color: var(--slate-surface);
      --header-bg: #050505;
      --tabbar-bg: #050505;
      --border-color: #2c2c2e;
      --subtext-color: var(--muted-gray);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    /* Single Header Line */
    .dashboard-header { background: var(--header-bg); color: var(--accent-white); padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 64px; flex-shrink: 0; border-bottom: 1px solid var(--border-color); }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-left h1 { font-size: 1.25rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .year-select { background: var(--surface-color); color: var(--text-color); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 6px; font-size: 0.88rem; font-weight: 600; outline: none; cursor: pointer; }

    .header-center { flex: 1; max-width: 400px; margin: 0 20px; }
    .search-input { width: 100%; background: var(--surface-color); color: var(--text-color); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 20px; font-size: 0.88rem; outline: none; }
    .search-input::placeholder { color: var(--subtext-color); }

    .dashboard-body-split { display: flex; flex: 1; height: calc(100vh - 64px); overflow: hidden; position: relative; }

    /* Left Navigation Bar */
    .left-vertical-tabbar { width: 64px; background: var(--tabbar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; padding: 16px 0; z-index: 20; flex-shrink: 0; }
    .tab-btn { width: 44px; height: 44px; border-radius: 10px; background: transparent; border: none; color: var(--muted-gray); display: flex; justify-content: center; align-items: center; margin-bottom: 12px; text-decoration: none; transition: all 0.2s; }
    .tab-btn svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .tab-btn:hover { background: var(--accent-blue); color: white; }

    .fab-tab-btn { margin-top: auto; background: var(--accent-blue); color: white; box-shadow: 0 4px 10px rgba(2, 132, 199, 0.4); cursor: pointer; }
    .fab-tab-btn:hover { background: #0369a1; transform: scale(1.05); }

    /* Center Projects Grid Workspace */
    .tiles-wrapper { flex: 1; display: flex; justify-content: flex-start; align-items: flex-start; padding: 24px; overflow-y: auto; position: relative; background: var(--bg-color); }
    .tiles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 16px; width: 100%; justify-items: start; }

    /* Tile Design Matching Folder Sizing */
    .tile { position: relative; width: 100%; max-width: 140px; aspect-ratio: 1 / 1; border-radius: 10px; padding: 12px 8px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; text-align: center; color: #ffffff; cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.15); user-select: none; }
    .tile:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.25); }

    .tile-avatar-center { flex: 1; display: flex; justify-content: center; align-items: center; }
    .tile-letter-avatar { width: 38px; height: 38px; border-radius: 50%; background: rgba(255, 255, 255, 0.22); color: #ffffff; font-size: 1.1rem; font-weight: 800; display: flex; justify-content: center; align-items: center; border: 1px solid rgba(255, 255, 255, 0.3); text-transform: uppercase; }
    
    .tile-content-bottom { display: flex; flex-direction: column; gap: 1px; width: 100%; }
    .tile-client-name { font-size: 0.8rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.2px; }
    .tile-project-no { font-size: 0.68rem; opacity: 0.85; font-weight: 600; text-transform: uppercase; }

    .tile-blue   { background-color: #0284c7; }
    .tile-green  { background-color: #059669; }
    .tile-purple { background-color: #7c3aed; }
    .tile-orange { background-color: #ea580c; }

    /* Folder Explorer View */
    .folder-explorer-view { display: none; flex: 1; flex-direction: column; height: 100%; padding: 24px; overflow-y: auto; background: var(--bg-color); position: relative; }
    
    .folder-breadcrumb-bar { display: flex; justify-content: space-between; align-items: center; background: var(--surface-color); border: 1px solid var(--border-color); padding: 12px 20px; border-radius: 10px; margin-bottom: 24px; }
    .breadcrumb-path { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 0.92rem; color: var(--text-color); flex-wrap: wrap; }
    .breadcrumb-item { cursor: pointer; color: var(--accent-blue); text-decoration: none; }
    .breadcrumb-item:hover { text-decoration: underline; }
    .breadcrumb-item.active { color: var(--text-color); cursor: default; text-decoration: none; }
    
    .breadcrumb-back-btn { background: var(--border-color); color: var(--text-color); border: none; padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .breadcrumb-back-btn:hover { background: var(--accent-blue); color: white; }

    .folder-contents-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 16px; width: 100%; justify-items: start; }

    /* Folder Cards */
    .folder-card { background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; transition: transform 0.15s, border-color 0.15s; user-select: none; width: 100%; max-width: 140px; aspect-ratio: 1 / 1; justify-content: space-between; }
    .folder-card:hover { transform: translateY(-3px); border-color: var(--accent-blue); }
    .folder-card.selected-cut { opacity: 0.4; border-style: dashed; }
    .folder-card svg { width: 44px; height: 44px; fill: #0284c7; stroke: none; margin-top: 4px; }
    .folder-name { font-size: 0.8rem; font-weight: 600; color: var(--text-color); word-break: break-word; line-height: 1.2; }
    .folder-items-count { font-size: 0.68rem; color: var(--subtext-color); }

    /* Custom Right-Click Context Menu */
    .context-menu { position: absolute; z-index: 1000; width: 160px; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); display: none; flex-direction: column; padding: 4px 0; backdrop-filter: blur(8px); }
    .context-menu-item { padding: 8px 16px; font-size: 0.85rem; color: var(--text-color); cursor: pointer; display: flex; align-items: center; gap: 10px; font-weight: 500; transition: background 0.15s; }
    .context-menu-item:hover { background: var(--accent-blue); color: white; }
    .context-menu-divider { height: 1px; background: var(--border-color); margin: 4px 0; }

    /* Right Activity Feed */
    .notifications-panel { width: 25%; min-width: 250px; max-width: 300px; background: var(--surface-color); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; height: 100%; flex-shrink: 0; }
    .notifications-header { padding: 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 0.95rem; }
    .notifications-header svg { width: 18px; height: 18px; stroke: var(--accent-blue); stroke-width: 2; fill: none; margin-right: 6px; }
    .notifications-list { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .notification-item { padding: 12px; border-radius: 8px; background: var(--bg-color); border: 1px solid var(--border-color); font-size: 0.85rem; }
    .notification-item .title { font-weight: 600; color: var(--text-color); margin-bottom: 4px; }
    .notification-item .time { font-size: 0.75rem; color: var(--subtext-color); margin-top: 6px; }

    /* Modal Form */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 15, 15, 0.75); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 100; }
    .modal-card { background: var(--surface-color); border: 1px solid var(--border-color); padding: 28px; border-radius: 12px; text-align: left; max-width: 420px; width: 90%; position: relative; color: var(--text-color); }
    .modal-card h3 { text-align: center; margin-bottom: 16px; font-size: 1.1rem; }
    .modal-label { display: block; font-size: 0.82rem; color: var(--subtext-color); margin: 10px 0 4px 0; font-weight: 600; }
    .modal-input { width: 100%; padding: 10px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); border-radius: 6px; font-size: 0.9rem; outline: none; }
    textarea.modal-input { resize: vertical; min-height: 65px; font-family: inherit; }
    .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
    .modal-btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .btn-save { background: var(--accent-blue); color: white; }
    .btn-cancel { background: var(--border-color); color: var(--text-color); }
    .close-btn { position: absolute; top: 14px; right: 14px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--subtext-color); }

    @media (max-width: 1024px) { .tiles-grid { grid-template-columns: repeat(3, 1fr); } .notifications-panel { display: none; } }
  </style>
</head>
<body onclick="hideContextMenu();">

  <!-- Header -->
  <header class="dashboard-header">
    <div class="header-left">
      <h1>
        <svg style="width:24px; height:24px; stroke:#0284c7; stroke-width:2; fill:none;" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
        Projects
      </h1>
      <select id="yearPicker" class="year-select" onchange="filterProjects()">
        <option value="2026" selected>2026</option>
        <option value="2025">2025</option>
        <option value="2024">2024</option>
      </select>
    </div>

    <div class="header-center">
      <input type="text" id="projectSearchInput" class="search-input" placeholder="search projects.." onkeyup="filterProjects()" />
    </div>

    <div style="width: 120px;"></div>
  </header>

  <div class="dashboard-body-split">
    
    <!-- Left Navigation Bar -->
    <aside class="left-vertical-tabbar">
      <a href="index.html" class="tab-btn" title="Home Grid">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      </a>

      <button class="tab-btn fab-tab-btn" id="fabBtn" onclick="handleFabClick()" title="Create New Project Tile">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
    </aside>

    <!-- Center Grid Workspace -->
    <main class="tiles-wrapper" id="mainGridWorkspace">
      <div class="tiles-grid" id="projectTilesGrid"></div>
    </main>

    <!-- Folder Browser View -->
    <section class="folder-explorer-view" id="folderExplorerWorkspace" oncontextmenu="handleWorkspaceContextMenu(event)">
      <div class="folder-breadcrumb-bar">
        <div class="breadcrumb-path" id="breadcrumbBar"></div>
        <button class="breadcrumb-back-btn" onclick="navigateUpBreadcrumb()">
          <svg style="width:16px; height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
          Back
        </button>
      </div>

      <div class="folder-contents-grid" id="innerFolderGrid"></div>
    </section>

    <!-- Right Activity Feed -->
    <aside class="notifications-panel">
      <div class="notifications-header">
        <span><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg> Activity Feed</span>
        <span style="font-size:0.75rem; background:rgba(2,132,199,0.15); color:var(--accent-blue); padding:2px 8px; border-radius:10px;">Live</span>
      </div>
      <div class="notifications-list">
        <div class="notification-item">
          <div class="title">New Project Initialized</div>
          <p style="color:var(--subtext-color);">Amber Holdings setup complete.</p>
          <div class="time">1 hour ago</div>
        </div>
      </div>
    </aside>
  </div>

  <!-- Custom Right-Click Context Menu -->
  <div class="context-menu" id="folderContextMenu">
    <div class="context-menu-item" onclick="executeContextAction('copy')">Copy</div>
    <div class="context-menu-item" onclick="executeContextAction('cut')">Cut</div>
    <div class="context-menu-item" id="pasteContextBtn" onclick="executeContextAction('paste')" style="display:none;">Paste</div>
    <div class="context-menu-divider"></div>
    <div class="context-menu-item" onclick="executeContextAction('rename')">Rename</div>
    <div class="context-menu-item" onclick="executeContextAction('delete')" style="color:var(--error-red,#ff3b30);">Delete</div>
  </div>

  <!-- Create New Project Modal -->
  <div class="modal-overlay" id="createProjectModal">
    <div class="modal-card">
      <button class="close-btn" onclick="closeCreateProjectModal()">&times;</button>
      <h3>Create New Project Tile</h3>

      <label class="modal-label">Client Name</label>
      <input type="text" id="newProjectClient" class="modal-input" />

      <label class="modal-label">Project No</label>
      <input type="text" id="newProjectNo" class="modal-input" />

      <label class="modal-label">Project Location</label>
      <input type="text" id="newProjectLocation" class="modal-input" />

      <label class="modal-label">Remarks</label>
      <textarea id="newProjectRemarks" class="modal-input"></textarea>

      <div class="modal-actions">
        <button class="modal-btn btn-save" onclick="createNewProject()">Create Project</button>
        <button class="modal-btn btn-cancel" onclick="closeCreateProjectModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const colors = ['tile-blue', 'tile-green', 'tile-purple', 'tile-orange'];
    let activeOpenedProject = null;
    let folderObjectStack = [];

    let clipboardFolder = null;
    let isCutOperation = false;
    let selectedFolderForContext = null;

    function getDefaultSubFolders() {
      return [
        { id: 'f-' + Date.now() + '-1', name: 'Site Photos & diCam', items: '0 Items', children: [] },
        { id: 'f-' + Date.now() + '-2', name: 'Safety & Compliance Logs', items: '0 Items', children: [] },
        { id: 'f-' + Date.now() + '-3', name: 'Reports & Worksheets', items: '0 Items', children: [] },
        { id: 'f-' + Date.now() + '-4', name: 'Drawings & Blueprints', items: '0 Items', children: [] }
      ];
    }

    const defaultProjects = [
      { id: 'proj-1', client: 'Amber Holdings', projectNo: 'PRJ-2026-001', location: 'North Tower B', remarks: 'Site inspection & visual logs', year: '2026', color: 'tile-blue', children: getDefaultSubFolders() },
      { id: 'proj-2', client: 'Alpha Corp', projectNo: 'PRJ-2026-002', location: 'Zone 4 Logistics', remarks: 'Routine safety audit', year: '2026', color: 'tile-green', children: getDefaultSubFolders() },
      { id: 'proj-3', client: 'Metro Gov Authority', projectNo: 'PRJ-2025-089', location: 'Central Hub', remarks: 'Year-end compliance check', year: '2025', color: 'tile-purple', children: getDefaultSubFolders() }
    ];

    function getProjects() {
      const stored = localStorage.getItem('dibadge_project_tiles');
      if (!stored) return defaultProjects;
      const parsed = JSON.parse(stored);
      return parsed.map(p => {
        if (!p.children) p.children = getDefaultSubFolders();
        return p;
      });
    }

    function saveProjects(array) {
      localStorage.setItem('dibadge_project_tiles', JSON.stringify(array));
      if (!activeOpenedProject) filterProjects();
    }

    function filterProjects() {
      const selectedYear = document.getElementById("yearPicker").value;
      const searchQuery = document.getElementById("projectSearchInput").value.toLowerCase().trim();
      const grid = document.getElementById("projectTilesGrid");
      grid.innerHTML = "";

      const projects = getProjects();
      const filtered = projects.filter(p => {
        const matchesYear = p.year === selectedYear;
        const matchesSearch = (p.client && p.client.toLowerCase().includes(searchQuery)) ||
                              (p.projectNo && p.projectNo.toLowerCase().includes(searchQuery)) ||
                              (p.location && p.location.toLowerCase().includes(searchQuery));
        return matchesYear && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1 / -1; color: var(--subtext-color); margin-top: 40px;">No projects found for ${selectedYear} matching "${searchQuery}"</div>`;
        return;
      }

      filtered.forEach(proj => {
        const clientName = proj.client || 'Client';
        const firstLetter = clientName.charAt(0).toUpperCase();

        const tileEl = document.createElement("div");
        tileEl.className = `tile ${proj.color}`;
        
        tileEl.innerHTML = `
          <div class="tile-avatar-center">
            <div class="tile-letter-avatar">${firstLetter}</div>
          </div>
          <div class="tile-content-bottom">
            <div class="tile-client-name">${clientName}</div>
            <div class="tile-project-no">${proj.projectNo || 'NO-ID'}</div>
          </div>
        `;

        // Single click opens project folder
        tileEl.onclick = function(e) {
          e.stopPropagation();
          openProjectFolder(proj);
        };

        grid.appendChild(tileEl);
      });
    }

    /* Single-Click Tree Folder Navigation */
    function openProjectFolder(proj) {
      activeOpenedProject = proj;
      folderObjectStack = [proj];

      document.getElementById("mainGridWorkspace").style.display = "none";
      document.getElementById("folderExplorerWorkspace").style.display = "flex";

      renderFolderView();
    }

    function getCurrentWorkspaceFolder() {
      return folderObjectStack[folderObjectStack.length - 1];
    }

    function renderFolderView() {
      const breadcrumbContainer = document.getElementById("breadcrumbBar");
      breadcrumbContainer.innerHTML = `<span class="breadcrumb-item" onclick="jumpToBreadcrumbIndex(0)">Projects</span>`;

      folderObjectStack.forEach((node, idx) => {
        const isLast = idx === folderObjectStack.length - 1;
        const displayName = node.client ? `${node.client} (${node.projectNo})` : node.name;
        
        breadcrumbContainer.innerHTML += ` <span style="color:var(--subtext-color);">></span> `;
        
        if (isLast) {
          breadcrumbContainer.innerHTML += `<span class="breadcrumb-item active">${displayName}</span>`;
        } else {
          breadcrumbContainer.innerHTML += `<span class="breadcrumb-item" onclick="jumpToBreadcrumbIndex(${idx + 1})">${displayName}</span>`;
        }
      });

      const currentFolderNode = getCurrentWorkspaceFolder();
      const subGrid = document.getElementById("innerFolderGrid");
      subGrid.innerHTML = "";

      if (!currentFolderNode.children) currentFolderNode.children = [];

      if (currentFolderNode.children.length === 0) {
        subGrid.innerHTML = `<div style="grid-column: 1 / -1; color: var(--subtext-color); margin-top: 40px; text-align: center;">Folder is empty. Click the + button to add a new folder.</div>`;
        return;
      }

      currentFolderNode.children.forEach((folder, idx) => {
        const folderCard = document.createElement("div");
        folderCard.className = "folder-card";
        if (clipboardFolder && clipboardFolder.id === folder.id && isCutOperation) {
          folderCard.classList.add("selected-cut");
        }

        folderCard.innerHTML = `
          <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
          <div class="folder-name">${folder.name}</div>
          <div class="folder-items-count">${folder.children ? folder.children.length + ' Items' : folder.items || '0 Items'}</div>
        `;

        // Single click opens sub-folder
        folderCard.onclick = (e) => {
          e.stopPropagation();
          folderObjectStack.push(folder);
          renderFolderView();
        };

        folderCard.oncontextmenu = (e) => {
          e.preventDefault();
          e.stopPropagation();
          showContextMenu(e, folder, idx);
        };

        subGrid.appendChild(folderCard);
      });
    }

    function jumpToBreadcrumbIndex(targetIndex) {
      if (targetIndex === 0) {
        activeOpenedProject = null;
        folderObjectStack = [];
        document.getElementById("folderExplorerWorkspace").style.display = "none";
        document.getElementById("mainGridWorkspace").style.display = "flex";
        filterProjects();
      } else {
        folderObjectStack = folderObjectStack.slice(0, targetIndex);
        renderFolderView();
      }
    }

    function navigateUpBreadcrumb() {
      jumpToBreadcrumbIndex(folderObjectStack.length - 1);
    }

    function showContextMenu(e, folder, idx) {
      selectedFolderForContext = { folder, idx };
      const menu = document.getElementById("folderContextMenu");
      
      document.getElementById("pasteContextBtn").style.display = clipboardFolder ? "flex" : "none";

      menu.style.top = `${e.clientY}px`;
      menu.style.left = `${e.clientX}px`;
      menu.style.display = "flex";
    }

    function handleWorkspaceContextMenu(e) {
      if (activeOpenedProject && clipboardFolder) {
        e.preventDefault();
        selectedFolderForContext = null;
        const menu = document.getElementById("folderContextMenu");
        document.getElementById("pasteContextBtn").style.display = "flex";
        menu.style.top = `${e.clientY}px`;
        menu.style.left = `${e.clientX}px`;
        menu.style.display = "flex";
      }
    }

    function hideContextMenu() {
      document.getElementById("folderContextMenu").style.display = "none";
    }

    function executeContextAction(action) {
      hideContextMenu();
      let currentFolderNode = getCurrentWorkspaceFolder();

      if (action === 'copy') {
        if (!selectedFolderForContext) return;
        clipboardFolder = JSON.parse(JSON.stringify(selectedFolderForContext.folder));
        isCutOperation = false;
        renderFolderView();
      } 
      else if (action === 'cut') {
        if (!selectedFolderForContext) return;
        clipboardFolder = JSON.parse(JSON.stringify(selectedFolderForContext.folder));
        clipboardFolder.sourceIdx = selectedFolderForContext.idx;
        clipboardFolder.sourceParent = currentFolderNode;
        isCutOperation = true;
        renderFolderView();
      } 
      else if (action === 'paste') {
        if (!clipboardFolder) return;
        
        if (isCutOperation && clipboardFolder.sourceParent) {
          clipboardFolder.sourceParent.children.splice(clipboardFolder.sourceIdx, 1);
        }
        
        const newPastedFolder = JSON.parse(JSON.stringify(clipboardFolder));
        newPastedFolder.id = 'f-' + Date.now();
        if (!isCutOperation) newPastedFolder.name += " - Copy";

        currentFolderNode.children.push(newPastedFolder);

        clipboardFolder = null;
        isCutOperation = false;
        persistProjectTree();
        renderFolderView();
      } 
      else if (action === 'rename') {
        if (!selectedFolderForContext) return;
        const newName = prompt("Rename folder:", selectedFolderForContext.folder.name);
        if (newName && newName.trim()) {
          currentFolderNode.children[selectedFolderForContext.idx].name = newName.trim();
          persistProjectTree();
          renderFolderView();
        }
      } 
      else if (action === 'delete') {
        if (!selectedFolderForContext) return;
        if (confirm(`Delete folder "${selectedFolderForContext.folder.name}"?`)) {
          currentFolderNode.children.splice(selectedFolderForContext.idx, 1);
          persistProjectTree();
          renderFolderView();
        }
      }
    }

    function persistProjectTree() {
      const allProjects = getProjects();
      const idx = allProjects.findIndex(p => p.id === activeOpenedProject.id);
      if (idx !== -1) {
        allProjects[idx] = activeOpenedProject;
        saveProjects(allProjects);
      }
    }

    function handleFabClick() {
      if (activeOpenedProject) {
        const newSubName = prompt("Enter new folder name:");
        if (newSubName && newSubName.trim()) {
          let currentFolderNode = getCurrentWorkspaceFolder();
          if (!currentFolderNode.children) currentFolderNode.children = [];
          
          currentFolderNode.children.push({
            id: 'f-' + Date.now(),
            name: newSubName.trim(),
            items: '0 Items',
            children: []
          });

          persistProjectTree();
          renderFolderView();
        }
      } else {
        openCreateProjectModal();
      }
    }

    function openCreateProjectModal() {
      document.getElementById("newProjectClient").value = "";
      document.getElementById("newProjectNo").value = "";
      document.getElementById("newProjectLocation").value = "";
      document.getElementById("newProjectRemarks").value = "";
      
      document.getElementById("createProjectModal").style.display = "flex";
    }

    function closeCreateProjectModal() {
      document.getElementById("createProjectModal").style.display = "none";
    }

    function createNewProject() {
      const client = document.getElementById("newProjectClient").value.trim();
      const projectNo = document.getElementById("newProjectNo").value.trim();
      const location = document.getElementById("newProjectLocation").value.trim();
      const remarks = document.getElementById("newProjectRemarks").value.trim();
      
      const year = document.getElementById("yearPicker").value || "2026";

      if (!client) return alert("Please enter a client name.");

      const projects = getProjects();
      projects.push({
        id: 'proj-' + Date.now(),
        client: client,
        projectNo: projectNo || `PRJ-${year}-${Math.floor(100 + Math.random() * 900)}`,
        location: location || 'N/A',
        remarks: remarks,
        year: year,
        color: colors[Math.floor(Math.random() * colors.length)],
        children: getDefaultSubFolders()
      });

      saveProjects(projects);
      filterProjects();
      closeCreateProjectModal();
    }

    filterProjects();
  </script>
</body>
</html>
