<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>diBadge | Organization Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f1f5f9; color: #0f172a; min-height: 100vh; overflow-x: hidden; }

    /* Site Lock */
    #gateModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .gate-card { background: #ffffff; padding: 40px; border-radius: 16px; text-align: center; max-width: 400px; width: 90%; }
    .gate-card input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; margin: 12px 0; text-align: center; }
    .gate-card button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }

    /* Layout */
    #dashboardLayout { display: none; flex-direction: column; height: 100vh; }
    .dashboard-header { background: #0f172a; color: white; padding: 0 32px; display: flex; justify-content: space-between; align-items: center; height: 64px; }
    .dashboard-header h1 { font-size: 1.25rem; display: flex; align-items: center; gap: 10px; }
    .header-logo-icon { width: 24px; height: 24px; stroke: #0284c7; stroke-width: 2; fill: none; }
    
    .dashboard-body-split { display: flex; flex: 1; height: calc(100vh - 64px); }

    /* Left Tabbar */
    .left-vertical-tabbar { width: 64px; background: #0f172a; border-right: 1px solid #1e293b; display: flex; flex-direction: column; align-items: center; padding: 16px 0; }
    .tab-btn { width: 44px; height: 44px; border-radius: 10px; background: transparent; border: none; color: #94a3b8; display: flex; justify-content: center; align-items: center; cursor: pointer; margin-bottom: 12px; text-decoration: none; }
    .tab-btn svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2; fill: none; }
    .tab-btn:hover, .tab-btn.active { background: #0284c7; color: white; }

    /* Tiles Grid */
    .tiles-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 24px; overflow-y: auto; }
    .tiles-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; max-width: 1100px; width: 100%; }
    .tile { text-decoration: none; position: relative; width: 100%; aspect-ratio: 1 / 1; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: #ffffff; cursor: pointer; transition: transform 0.15s; }
    .tile:hover { transform: scale(1.04); }
    .tile-icon-wrapper { width: 42px; height: 42px; margin-bottom: 10px; }
    .tile-icon-wrapper svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; }
    .tile-title { font-size: 0.9rem; font-weight: 600; }

    .tile-blue   { background-color: #0284c7; }
    .tile-green  { background-color: #059669; }
    .tile-grey   { background-color: #475569; }
    .tile-olive  { background-color: #65a30d; }

    /* Notifications Panel */
    .notifications-panel { width: 25%; min-width: 260px; max-width: 320px; background: #ffffff; border-left: 1px solid #e2e8f0; display: flex; flex-direction: column; padding: 16px; }
    .notifications-header { font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .notification-item { padding: 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 8px; font-size: 0.85rem; }
  </style>
</head>
<body>

  <div id="gateModal">
    <div class="gate-card">
      <h2>diBadge Site Lock</h2>
      <input type="password" id="passInput" placeholder="Enter Access Passcode" />
      <button onclick="checkPasscode()">Unlock Site</button>
    </div>
  </div>

  <div id="dashboardLayout">
    <header class="dashboard-header">
      <h1>
        <svg class="header-logo-icon" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        Organization Portal
      </h1>
    </header>

    <div class="dashboard-body-split">
      <aside class="left-vertical-tabbar">
        <a href="index.html" class="tab-btn active" title="Home Grid">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        </a>
      </aside>

      <div class="tiles-wrapper">
        <div class="tiles-grid">
          <!-- Direct File Links -->
          <a href="groups.html" class="tile tile-blue">
            <div class="tile-icon-wrapper"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></div>
            <div class="tile-title">Groups</div>
          </a>

          <a href="members.html" class="tile tile-green">
            <div class="tile-icon-wrapper"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg></div>
            <div class="tile-title">Members</div>
          </a>

          <a href="hr.html" class="tile tile-grey">
            <div class="tile-icon-wrapper"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg></div>
            <div class="tile-title">HR</div>
          </a>

          <a href="finance.html" class="tile tile-olive">
            <div class="tile-icon-wrapper"><svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect></svg></div>
            <div class="tile-title">Finance</div>
          </a>
        </div>
      </div>

      <aside class="notifications-panel">
        <div class="notifications-header">Activity Feed</div>
        <div class="notification-item"><strong>Leave Request</strong><p>John Doe requested 2 days leave.</p></div>
        <div class="notification-item"><strong>New Member</strong><p>Sarah added to engineering.</p></div>
      </aside>
    </div>
  </div>

  <script>
    const SECRET_PASSCODE = "177994";
    if (localStorage.getItem("dibadge_unlocked") === "true") {
      document.getElementById("gateModal").style.display = "none";
      document.getElementById("dashboardLayout").style.display = "flex";
    }

    function checkPasscode() {
      if (document.getElementById("passInput").value === SECRET_PASSCODE) {
        localStorage.setItem("dibadge_unlocked", "true");
        document.getElementById("gateModal").style.display = "none";
        document.getElementById("dashboardLayout").style.display = "flex";
      } else {
        alert("Incorrect passcode.");
      }
    }
  </script>
</body>
</html>
