<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>diBadge | Organization Portal</title>
  
  <script>
    (function() {
      const savedTheme = localStorage.getItem('dibadge_web_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>

  <style>
    :root {
      --jet-black: #0f0f0f;
      --paper-white: #f8f9fa;
      --slate-surface: #1e1e1e;
      --accent-white: #ffffff;
      --muted-gray: #8e8e93;
      --cool-ash: #a1a1a6;
      --soft-border: #e5e5ea;
      --error-red: #ff3b30;
      --accent-blue: #0284c7;

      --bg-color: var(--paper-white);
      --text-color: var(--jet-black);
      --surface-color: var(--accent-white);
      --header-bg: var(--jet-black);
      --tabbar-bg: var(--jet-black);
      --border-color: var(--soft-border);
      --subtext-color: var(--cool-ash);
    }

    [data-theme="dark"] {
      --bg-color: var(--jet-black);
      --text-color: var(--accent-white);
      --surface-color: var(--slate-surface);
      --header-bg: #050505;
      --tabbar-bg: #050505;
      --border-color: #2c2c2e;
      --subtext-color: var(--muted-gray);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; overflow-x: hidden; transition: background-color 0.2s, color 0.2s; }

    #gateModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--jet-black); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .gate-card { background: var(--surface-color); padding: 40px; border-radius: 16px; text-align: center; max-width: 400px; width: 90%; border: 1px solid var(--border-color); }
    .gate-card h2 { margin-bottom: 8px; color: var(--text-color); }
    .gate-card input { width: 100%; padding: 12px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); border-radius: 8px; margin: 12px 0; text-align: center; outline: none; }
    .gate-card button { width: 100%; padding: 12px; background: var(--accent-blue); color: var(--accent-white); border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }

    #dashboardLayout { display: none; flex-direction: column; height: 100vh; overflow: hidden; }
    .dashboard-header { background: var(--header-bg); color: var(--accent-white); padding: 0 32px; display: flex; justify-content: space-between; align-items: center; height: 64px; z-index: 10; border-bottom: 1px solid var(--border-color); }
    .dashboard-header h1 { font-size: 1.25rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .header-logo-icon { width: 24px; height: 24px; stroke: var(--accent-blue); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    .dashboard-body-split { display: flex; flex: 1; height: calc(100vh - 64px); overflow: hidden; position: relative; }

    .left-vertical-tabbar { width: 64px; background: var(--tabbar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; padding: 16px 0; z-index: 20; flex-shrink: 0; }
    .tab-btn { width: 44px; height: 44px; border-radius: 10px; background: transparent; border: none; color: var(--muted-gray); display: flex; justify-content: center; align-items: center; cursor: pointer; margin-bottom: 12px; text-decoration: none; transition: all 0.2s; }
    .tab-btn svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .tab-btn:hover, .tab-btn.active { background: var(--accent-blue); color: var(--accent-white); }

    .fab-tab-btn { margin-top: auto; background: var(--accent-blue); color: var(--accent-white); box-shadow: 0 4px 10px rgba(2, 132, 199, 0.4); }
    .fab-tab-btn:hover { background: #0369a1; transform: scale(1.05); }

    /* PERFECTLY CENTERED TILES WORKSPACE */
    .tiles-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px; overflow-y: auto; position: relative; }
    .tiles-grid { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 20px; max-width: 1000px; width: 100%; margin: auto; }

    .tile { position: relative; width: 140px; height: 140px; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: #ffffff; cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); text-decoration: none; flex-shrink: 0; }
    .tile:hover { transform: scale(1.05); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2); }
    .tile-icon-wrapper { width: 42px; height: 42px; margin-bottom: 12px; display: flex; justify-content: center; align-items: center; }
    .tile-icon-wrapper svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .tile-title { font-size: 0.9rem; font-weight: 600; letter-spacing: 0.2px; word-break: break-word; }

    .tile-edit-btn { position: absolute; bottom: 6px; right: 6px; background: rgba(0, 0, 0, 0.35); color: #ffffff; border: none; width: 26px; height: 26px; border-radius: 4px; display: flex; justify-content: center; align-items: center; cursor: pointer; opacity: 0; transition: opacity 0.2s ease, background 0.2s ease; padding: 4px; }
    .tile-edit-btn svg { width: 14px; height: 14px; stroke: #ffffff; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .tile:hover .tile-edit-btn { opacity: 1; }
    .tile-edit-btn:hover { background: rgba(0, 0, 0, 0.7); }

    .tile-blue   { background-color: #0284c7; }
    .tile-green  { background-color: #059669; }
    .tile-grey   { background-color: #475569; }
    .tile-olive  { background-color: #65a30d; }

    #settingsView { display: none; flex: 1; padding: 40px; background: var(--surface-color); overflow-y: auto; }
    .settings-card { background: var(--bg-color); border: 1px solid var(--border-color); padding: 24px; border-radius: 12px; max-width: 500px; margin-top: 20px; }
    .theme-selector-group { display: flex; gap: 16px; margin-top: 12px; }
    .theme-option-btn { flex: 1; padding: 14px; border: 2px solid var(--border-color); background: var(--surface-color); color: var(--text-color); border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; }
    .theme-option-btn.active { border-color: var(--accent-blue); background: rgba(2, 132, 199, 0.15); color: var(--accent-blue); }

    .notifications-panel { width: 25%; min-width: 260px; max-width: 320px; background: var(--surface-color); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; height: 100%; box-shadow: -4px 0 10px -2px rgba(0, 0, 0, 0.03); flex-shrink: 0; }
    .notifications-header { padding: 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: var(--surface-color); font-weight: 600; font-size: 0.95rem; }
    .notifications-header svg { width: 18px; height: 18px; stroke: var(--accent-blue); stroke-width: 2; fill: none; margin-right: 6px; }
    .notifications-list { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .notification-item { padding: 12px; border-radius: 8px; background: var(--bg-color); border: 1px solid var(--border-color); font-size: 0.85rem; }
    .notification-item .title { font-weight: 600; color: var(--text-color); margin-bottom: 4px; }
    .notification-item .time { font-size: 0.75rem; color: var(--subtext-color); margin-top: 6px; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 15, 15, 0.75); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 100; }
    .modal-card { background: var(--surface-color); padding: 28px; border-radius: 12px; text-align: center; max-width: 380px; width: 90%; position: relative; border: 1px solid var(--border-color); color: var(--text-color); }
    .modal-label { display: block; text-align: left; font-size: 0.85rem; color: var(--subtext-color); margin: 12px 0 6px 0; font-weight: 600; }
    .modal-input { width: 100%; padding: 10px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); border-radius: 6px; font-size: 0.95rem; outline: none; }
    .icon-selector-trigger { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
    .icon-picker-grid { display: none; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 10px; padding: 8px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-color); max-height: 150px; overflow-y: auto; }
    .icon-option { width: 100%; aspect-ratio: 1 / 1; display: flex; justify-content: center; align-items: center; cursor: pointer; border-radius: 6px; padding: 8px; }
    .icon-option svg { width: 22px; height: 22px; stroke: var(--subtext-color); stroke-width: 2; fill: none; }
    .icon-option.selected { background: rgba(2, 132, 199, 0.15); }
    .icon-option.selected svg { stroke: var(--accent-blue); }
    .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
    .modal-btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .btn-save { background: var(--accent-blue); color: var(--accent-white); }
    .btn-delete { background: var(--error-red); color: var(--accent-white); }
    .btn-cancel { background: var(--border-color); color: var(--text-color); }
    .close-btn { position: absolute; top: 14px; right: 14px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--subtext-color); }

    @media (max-width: 1024px) { .notifications-panel { display: none; } }
  </style>
</head>
<body>

  <!-- Hidden SVG Template Library (Suitcase Icon for Projects) -->
  <div style="display: none;">
    <svg id="svg-projects" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
    <svg id="svg-members" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
    <svg id="svg-hr" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg>
    <svg id="svg-finance" viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
    <svg id="svg-folder" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
  </div>

  <div id="gateModal">
    <div class="gate-card">
      <h2>diBadge Site Lock</h2>
      <p style="color:var(--subtext-color); margin-bottom:12px;">Enter passcode to open site view.</p>
      <input type="password" id="passInput" placeholder="Enter Access Passcode" />
      <button onclick="checkPasscode()">Unlock Site</button>
    </div>
  </div>

  <div id="dashboardLayout">
    <header class="dashboard-header">
      <h1 id="pageTopHeader">
        <!-- Branded ID / Badge Icon -->
        <svg class="header-logo-icon" viewBox="0 0 24 24">
          <path d="M3 5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5z"></path>
          <path d="M9 3v2a3 3 0 0 0 6 0V3"></path>
          <circle cx="12" cy="11" r="2.5"></circle>
          <path d="M8 17a4 4 0 0 1 8 0"></path>
        </svg>
        diBadge
      </h1>
    </header>

    <div class="dashboard-body-split">
      <aside class="left-vertical-tabbar">
        <button class="tab-btn active" id="tabNavHome" onclick="switchMainTab('home')" title="Home Tiles">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        </button>
        <button class="tab-btn" id="tabNavSettings" onclick="switchMainTab('settings')" title="Organization Settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
        <button class="tab-btn fab-tab-btn" onclick="openCreateModal()" title="Create New Tile">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
      </aside>

      <div class="tiles-wrapper" id="homeView">
        <div class="tiles-grid" id="tilesGrid"></div>
      </div>

      <div id="settingsView">
        <h2>Organization Settings</h2>
        <p style="color:var(--subtext-color); margin-top:4px;">Customize portal preferences and theme options.</p>

        <div class="settings-card">
          <h3 style="font-size:1rem; margin-bottom:6px;">Appearance Theme</h3>
          <div class="theme-selector-group">
            <button class="theme-option-btn" id="themeBtnDark" onclick="setAppTheme('dark')">Dark Theme</button>
            <button class="theme-option-btn" id="themeBtnLight" onclick="setAppTheme('light')">Light Theme</button>
          </div>
        </div>
      </div>

      <aside class="notifications-panel">
        <div class="notifications-header">
          <span><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg> Activity Feed</span>
          <span style="font-size:0.75rem; background:rgba(2,132,199,0.15); color:var(--accent-blue); padding:2px 8px; border-radius:10px;">Live</span>
        </div>
        <div class="notifications-list">
          <div class="notification-item">
            <div class="title">Leave Request Submitted</div>
            <p style="color:var(--subtext-color);">John Doe requested 2 days medical leave.</p>
            <div class="time">10 mins ago</div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Tile Modal -->
  <div class="modal-overlay" id="tileModal">
    <div class="modal-card">
      <button class="close-btn" onclick="closeTileModal()">&times;</button>
      <h3 id="modalHeaderTitle">Tile Properties</h3>

      <label class="modal-label">Tile Name</label>
      <input type="text" id="modalTileTitle" class="modal-input" placeholder="Enter tile title" />

      <label class="modal-label">Icon</label>
      <button class="icon-selector-trigger" onclick="toggleIconPicker()">
        <span>Choose Icon</span>
        <div class="icon-preview-box" id="selectedIconPreview"></div>
      </button>

      <div class="icon-picker-grid" id="iconPickerGrid">
        <div class="icon-option" onclick="selectIcon('projects')" id="pick-projects"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg></div>
        <div class="icon-option" onclick="selectIcon('members')" id="pick-members"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg></div>
        <div class="icon-option" onclick="selectIcon('hr')" id="pick-hr"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg></div>
        <div class="icon-option" onclick="selectIcon('finance')" id="pick-finance"><svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect></svg></div>
      </div>

      <div class="modal-actions">
        <button class="modal-btn btn-save" onclick="saveTileModal()">Save</button>
        <button class="modal-btn btn-delete" id="deleteTileBtn" onclick="deleteCurrentTile()">Delete</button>
        <button class="modal-btn btn-cancel" onclick="closeTileModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const SECRET_PASSCODE = "1234";
    let activeEditTileId = null;
    let isCreateMode = false;
    let selectedIconKey = "projects";
    const colors = ['tile-blue', 'tile-green', 'tile-grey', 'tile-olive'];

    const defaultTiles = [
      { id: 'projects', title: 'Projects', url: 'projects.html', iconKey: 'projects', color: 'tile-blue', isProtected: true },
      { id: 'members', title: 'Members', url: 'members.html', iconKey: 'members', color: 'tile-green', isProtected: true },
      { id: 'hr', title: 'HR', url: 'hr.html', iconKey: 'hr', color: 'tile-grey', isProtected: false },
      { id: 'finance', title: 'Finance', url: 'finance.html', iconKey: 'finance', color: 'tile-olive', isProtected: false }
    ];

    function setAppTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('dibadge_web_theme', theme);
      const darkBtn = document.getElementById('themeBtnDark');
      const lightBtn = document.getElementById('themeBtnLight');
      if (darkBtn && lightBtn) {
        if (theme === 'dark') { darkBtn.classList.add('active'); lightBtn.classList.remove('active'); }
        else { lightBtn.classList.add('active'); darkBtn.classList.remove('active'); }
      }
    }

    setAppTheme(localStorage.getItem('dibadge_web_theme') || 'dark');

    function getStoredTiles() {
      const stored = localStorage.getItem('dibadge_custom_tiles');
      if (!stored) return defaultTiles;
      const parsed = JSON.parse(stored);
      return parsed.map(t => {
        if (t.id === 'projects' || t.id === 'members') t.isProtected = true;
        return t;
      });
    }

    function setStoredTiles(tilesArray) {
      localStorage.setItem('dibadge_custom_tiles', JSON.stringify(tilesArray));
      renderTiles();
    }

    function renderTiles() {
      const tiles = getStoredTiles();
      const grid = document.getElementById("tilesGrid");
      grid.innerHTML = "";

      tiles.forEach(tile => {
        const svgTemplate = document.getElementById("svg-" + tile.iconKey);
        const svgHTML = svgTemplate ? svgTemplate.outerHTML : "";

        const tileElement = document.createElement("a");
        tileElement.className = `tile ${tile.color}`;
        tileElement.id = `tile-${tile.id}`;
        tileElement.href = tile.url || "#";

        tileElement.innerHTML = `
          <div class="tile-icon-wrapper" id="icon-${tile.id}">${svgHTML}</div>
          <div class="tile-title" id="title-${tile.id}">${tile.title}</div>
          <button class="tile-edit-btn" onclick="openEditModal(event, '${tile.id}', ${!tile.isProtected})" title="Edit Tile">
            <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          </button>
        `;

        grid.appendChild(tileElement);
      });
    }

    function switchMainTab(tab) {
      const homeView = document.getElementById("homeView");
      const settingsView = document.getElementById("settingsView");
      const btnHome = document.getElementById("tabNavHome");
      const btnSettings = document.getElementById("tabNavSettings");

      if (tab === 'home') {
        homeView.style.display = "flex"; settingsView.style.display = "none";
        btnHome.classList.add("active"); btnSettings.classList.remove("active");
      } else {
        homeView.style.display = "none"; settingsView.style.display = "block";
        btnHome.classList.remove("active"); btnSettings.classList.add("active");
      }
    }

    function checkPasscode() {
      if (document.getElementById("passInput").value === SECRET_PASSCODE) {
        localStorage.setItem("dibadge_unlocked", "true");
        document.getElementById("gateModal").style.display = "none";
        document.getElementById("dashboardLayout").style.display = "flex";
        renderTiles();
      } else { alert("Incorrect passcode."); }
    }

    if (localStorage.getItem("dibadge_unlocked") === "true") {
      document.getElementById("gateModal").style.display = "none";
      document.getElementById("dashboardLayout").style.display = "flex";
      renderTiles();
    }

    function toggleIconPicker() {
      const picker = document.getElementById("iconPickerGrid");
      picker.style.display = (picker.style.display === "grid") ? "none" : "grid";
    }

    function selectIcon(iconKey) {
      selectedIconKey = iconKey;
      document.querySelectorAll('.icon-option').forEach(opt => opt.classList.remove('selected'));
      const targetOpt = document.getElementById("pick-" + iconKey);
      if (targetOpt) targetOpt.classList.add('selected');
      const templateSvg = document.getElementById("svg-" + iconKey);
      if (templateSvg) document.getElementById("selectedIconPreview").innerHTML = templateSvg.outerHTML;
      document.getElementById("iconPickerGrid").style.display = "none";
    }

    function openCreateModal() {
      isCreateMode = true; activeEditTileId = null;
      document.getElementById("modalHeaderTitle").innerText = "Create New Tile";
      document.getElementById("modalTileTitle").value = "";
      document.getElementById("deleteTileBtn").style.display = "none";
      selectIcon("projects");
      document.getElementById("tileModal").style.display = "flex";
    }

    function openEditModal(event, tileId, isDeletable) {
      event.preventDefault(); event.stopPropagation();
      isCreateMode = false; activeEditTileId = tileId;
      const targetTile = getStoredTiles().find(t => t.id === tileId);

      document.getElementById("modalHeaderTitle").innerText = "Edit Tile Properties";
      document.getElementById("modalTileTitle").value = targetTile ? targetTile.title : "";
      selectIcon(targetTile ? targetTile.iconKey : "projects");
      document.getElementById("deleteTileBtn").style.display = isDeletable ? "block" : "none";
      document.getElementById("tileModal").style.display = "flex";
    }

    function closeTileModal() { document.getElementById("tileModal").style.display = "none"; }

    function saveTileModal() {
      const titleInput = document.getElementById("modalTileTitle").value.trim();
      if (!titleInput) return alert("Please enter a tile name.");
      let tiles = getStoredTiles();

      if (isCreateMode) {
        tiles.push({ id: "custom-" + Date.now(), title: titleInput, url: `#`, iconKey: selectedIconKey, color: colors[Math.floor(Math.random() * colors.length)], isProtected: false });
      } else if (activeEditTileId) {
        const idx = tiles.findIndex(t => t.id === activeEditTileId);
        if (idx !== -1) { tiles[idx].title = titleInput; tiles[idx].iconKey = selectedIconKey; }
      }
      setStoredTiles(tiles);
      closeTileModal();
    }

    function deleteCurrentTile() {
      if (!activeEditTileId) return;
      setStoredTiles(getStoredTiles().filter(t => t.id !== activeEditTileId));
      closeTileModal();
    }
  </script>
</body>
</html>
