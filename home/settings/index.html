<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>diBadge | Settings</title>

  <script>
    (function() {
      const savedTheme = localStorage.getItem('dibadge_web_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>

  <style>
    :root {
      --jet-black: #0f0f0f;
      --paper-white: #f8f9fa;
      --slate-surface: #1e1e1e;
      --accent-white: #ffffff;
      --muted-gray: #8e8e93;
      --cool-ash: #a1a1a6;
      --slate-charcoal: #3a3a3c;
      --soft-border: #e5e5ea;
      --error-red: #ff3b30;
      --accent-teal: #14b8a6;

      --bg-color: #e8e9ed;
      --text-color: var(--slate-charcoal);
      --surface-color: var(--accent-white);
      --header-bg: var(--accent-white);
      --border-color: var(--soft-border);
      --subtext-color: var(--cool-ash);
    }
    [data-theme="dark"] {
      --bg-color: var(--jet-black);
      --text-color: var(--accent-white);
      --surface-color: var(--slate-surface);
      --header-bg: #050505;
      --border-color: #2c2c2e;
      --subtext-color: var(--muted-gray);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-color); color: var(--text-color); min-height: 100vh; transition: background-color 0.2s, color 0.2s; }

    #authGate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--jet-black); display: flex; justify-content: center; align-items: center; z-index: 1000; color: var(--accent-white); font-size: 0.9rem; }

    .page-header { display: flex; align-items: center; gap: 14px; padding: 20px 28px; border-bottom: 1px solid var(--border-color); }
    .back-btn { background: transparent; border: none; color: var(--text-color); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 6px; border-radius: 8px; }
    .back-btn:hover { background: var(--surface-color); }
    .back-btn svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2; fill: none; }
    .page-title { font-size: 1.15rem; font-weight: 700; }

    .page-body { max-width: 560px; margin: 0 auto; padding: 32px 24px; }

    .card { background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 14px; padding: 22px; margin-bottom: 20px; }
    .card-title { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
    .card-sub { font-size: 0.82rem; color: var(--subtext-color); margin-bottom: 18px; }

    .theme-selector-group { display: flex; gap: 16px; }
    .theme-option-btn {
      flex: 1;
      padding: 16px;
      border: 2px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-color);
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: all 0.15s;
    }
    .theme-option-btn svg { width: 26px; height: 26px; stroke: currentColor; stroke-width: 1.8; fill: none; }
    .theme-option-btn.active { border-color: var(--accent-teal); color: var(--accent-teal); }
    .theme-option-btn:hover { border-color: var(--accent-teal); }
  </style>
</head>
<body>

  <div id="authGate">Checking your session…</div>

  <div id="appShell" style="display:none;">
    <header class="page-header">
      <button class="back-btn" onclick="window.location.href='../'" title="Back to Home">
        <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      </button>
      <span class="page-title">Settings</span>
    </header>

    <div class="page-body">
      <div class="card">
        <div class="card-title">Appearance</div>
        <div class="card-sub">Choose how diBadge looks across every page.</div>
        <div class="theme-selector-group">
          <button class="theme-option-btn" id="themeBtnDark" onclick="setAppTheme('dark')">
            <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            Dark
          </button>
          <button class="theme-option-btn" id="themeBtnLight" onclick="setAppTheme('light')">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            Light
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB2unuKGf0MQqxcB78Skh1H9U3ySFj16e0",
      authDomain: "dibadge-fabxdi.firebaseapp.com",
      projectId: "dibadge-fabxdi",
      storageBucket: "dibadge-fabxdi.firebasestorage.app",
      messagingSenderId: "390433769514",
      appId: "1:390433769514:web:10c4fb97906be8690b1b53",
      measurementId: "G-ZJVXLDZPRY"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Exposed so the plain script below can save the choice against the signed-in
    // user's own account, not just this browser's localStorage — that's what makes the
    // preference follow you across a PC restart, a cleared browser, or a different device.
    window.themeDbFns = { db, doc, getDoc, setDoc };

    onAuthStateChanged(auth, async function(user) {
      const gate = document.getElementById('authGate');
      if (!user) {
        window.location.href = '../../login/';
        return;
      }
      window.currentUid = user.uid;
      gate.style.display = 'none';
      document.getElementById('appShell').style.display = 'block';

      // The account's saved preference is the source of truth — resync it here in case
      // this browser's localStorage doesn't match (e.g. it was cleared since last time).
      try {
        const snap = await getDoc(doc(db, 'users', user.uid));
        const savedTheme = snap.exists() ? snap.data().themePreference : null;
        if (savedTheme && savedTheme !== localStorage.getItem('dibadge_web_theme')) {
          document.documentElement.setAttribute('data-theme', savedTheme);
          localStorage.setItem('dibadge_web_theme', savedTheme);
          syncThemeButtons(savedTheme);
        }
      } catch (err) {
        // Falls back to whatever's already applied from localStorage — not fatal.
      }
    });
  </script>

  <script>
    async function setAppTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('dibadge_web_theme', theme);
      syncThemeButtons(theme);

      // Saved against the account itself, not just this browser — so it survives a PC
      // restart, a cleared browser, or logging in from a different device.
      if (window.currentUid) {
        try {
          const { db, doc, setDoc } = window.themeDbFns;
          await setDoc(doc(db, 'users', window.currentUid), { themePreference: theme }, { merge: true });
        } catch (err) {
          // The local choice still applies on this browser even if the account-level
          // save failed — not fatal, just won't follow the person elsewhere yet.
        }
      }
    }
    function syncThemeButtons(theme) {
      document.getElementById('themeBtnDark').classList.toggle('active', theme === 'dark');
      document.getElementById('themeBtnLight').classList.toggle('active', theme === 'light');
    }
    syncThemeButtons(localStorage.getItem('dibadge_web_theme') || 'dark');
  </script>
</body>
</html>
