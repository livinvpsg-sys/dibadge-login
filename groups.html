<!DOCTYPE html>

<head>

  <title>diBadge | Groups & Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f1f5f9; color: #0f172a; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    .dashboard-header { background: #0f172a; color: white; padding: 0 32px; display: flex; justify-content: space-between; align-items: center; height: 64px; }
    .back-btn { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 0.85rem; }
    .back-btn:hover { background: #334155; color: white; }

    .dashboard-body-split { display: flex; flex: 1; height: calc(100vh - 64px); }

    .left-vertical-tabbar { width: 64px; background: #0f172a; border-right: 1px solid #1e293b; display: flex; flex-direction: column; align-items: center; padding: 16px 0; }
    .tab-btn { width: 44px; height: 44px; border-radius: 10px; background: transparent; border: none; color: #94a3b8; display: flex; justify-content: center; align-items: center; margin-bottom: 12px; text-decoration: none; }
    .tab-btn svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2; fill: none; }
    .tab-btn:hover { background: #0284c7; color: white; }

    .module-workspace { flex: 1; padding: 32px; overflow-y: auto; background: #ffffff; }

    .notifications-panel { width: 25%; min-width: 260px; max-width: 320px; background: #ffffff; border-left: 1px solid #e2e8f0; padding: 16px; }
    .notification-item { padding: 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 8px; font-size: 0.85rem; }
  </style>
</head>
